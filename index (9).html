<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>西鐵小巴系統</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:16px}
.header{padding:12px;text-align:center;border-bottom:1px solid #333;flex-shrink:0;position:relative}
.header .title{font-size:28px;font-weight:800;color:#fc0}
.header .dev{font-size:13px;color:#888;margin-top:2px}
.voice-btn{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;background:#30d158;border:none;color:#fff;font-size:24px;cursor:pointer}
.voice-btn.muted{background:#ff453a}
.view{display:none;flex:1;overflow-y:auto;padding:12px}
.view.active{display:block}
.card{background:#1c1c1e;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #333}
.card-title{font-size:15px;font-weight:700;color:#fc0;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #333}
.btn{width:100%;padding:16px;border-radius:14px;font-size:17px;font-weight:700;border:none;cursor:pointer;color:#fff;margin-bottom:8px;display:block;text-align:center}
.btn:active{opacity:.8;transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:#0a84ff}
.btn-portal{background:linear-gradient(135deg,#0a84ff,#0066cc)}
.btn-driver{background:linear-gradient(135deg,#ff453a,#c62828)}
.btn-success{background:#30d158}
.btn-danger{background:#ff453a}
.btn-warn{background:#ff9f0a;color:#000}
.btn-secondary{background:#3a3a3c}
.btn-outline{background:transparent;border:1px solid #555;color:#aaa}
.btn-purple{background:#bf5af2}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;display:inline-block;margin:0 4px 0 0}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #444;font-size:16px;background:#2c2c2e;color:#fff;margin-bottom:10px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#0a84ff}
label{display:block;font-size:13px;color:#aaa;margin-bottom:4px;font-weight:600}
.badge{display:inline-block;padding:6px 14px;border-radius:20px;font-weight:700;font-size:13px;margin:2px}
.badge-purple{background:#bf5af2;color:#fff}
.badge-red{background:#ff453a;color:#fff}
.badge-green{background:#30d158;color:#fff}
.badge-yellow{background:#fc0;color:#000}
.badge-blue{background:#0a84ff;color:#fff}
.badge-orange{background:#ff9f0a;color:#000}
.big-number{font-size:52px;font-weight:800;text-align:center;color:#fc0;margin:6px 0}
.station-name{font-size:26px;font-weight:700;text-align:center;color:#fc0;margin:6px 0}
.msg-area{background:#1a1a1a;border-radius:12px;padding:10px;margin-top:8px}
.msg-list{max-height:180px;overflow-y:auto;margin-bottom:8px;font-size:14px}
.msg-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #333}
.msg-row:last-child{border-bottom:none}
.msg-input{flex:1;padding:12px;border-radius:10px;border:none;font-size:15px;background:#2c2c2e;color:#fff;margin:0}
.send-btn{width:52px;height:52px;border-radius:12px;border:none;background:#0a84ff;color:#fff;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:30px;font-size:16px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.toast.show{opacity:1}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-card{background:#1c1c1e;border:2px solid #fc0;border-radius:20px;padding:22px;max-width:400px;width:100%;max-height:90vh;overflow-y:auto}
.modal-card h2{color:#fc0;margin-bottom:14px;font-size:22px;text-align:center}
.route-strip{display:flex;overflow-x:auto;gap:12px;padding:12px 8px;border-top:2px solid #555;margin-top:10px;background:rgba(255,255,255,.05);border-radius:12px;min-height:70px;align-items:center}
.dot-node{flex:0 0 150px;text-align:center;font-size:15px;white-space:nowrap;padding:4px 0}
.dot{width:28px;height:28px;border-radius:50%;background:#444;margin:0 auto 4px;border:3px solid #666;transition:all .3s}
.dot-node.current .dot{background:#00ff66;border-color:#fff;box-shadow:0 0 20px #00ff66;transform:scale(1.15)}
.dot-node.current span{color:#fff;font-weight:800;font-size:17px}
.dot-node.next .dot{background:#00ff66;border-color:#fff;animation:blink .8s infinite}
.dot-node.next span{color:#00ff66;font-weight:700}
.dot-node.passed .dot{background:#666;opacity:.4}
.dot-node.passed span{color:#666}
@keyframes blink{50%{opacity:.4;transform:scale(.9)}}
.play-audio{background:#0a84ff;color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.tab-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab-btn{flex:1;min-width:80px;padding:12px 6px;background:#2c2c2e;border:none;color:#888;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;transition:.2s}
.tab-btn.active{background:#0a84ff;color:#fff}
.rec-controls{display:none;gap:6px;margin-top:8px}
.rec-controls button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.rec-stop{background:#30d158;color:#fff}
.rec-cancel{background:#ff453a;color:#fff}
.rec-status{display:none;align-items:center;gap:8px;padding:8px;background:#1a1a1a;border-radius:8px;margin-top:8px;font-size:14px;color:#fc0}
.rec-dot{width:10px;height:10px;border-radius:50%;background:red;animation:pulse .6s infinite}
@keyframes pulse{50%{opacity:.3}}
.booking-card{background:#1e293b;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #334155}
.booking-card.full{border-color:#ef4444;background:#450a0a}
.booking-card .time{font-size:24px;font-weight:900;color:#38bdf8}
.booking-card .info{font-size:12px;color:#94a3b8;margin-top:2px}
.booking-card .pickup{font-size:13px;color:#4ade80;margin-top:4px;font-weight:600}
.booking-card .counts{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.booking-card .seat-num{font-size:26px;font-weight:900;color:#22c55e}
.booking-card .seat-num.zero{color:#ef4444}
.pending-item{background:#0f172a;border-radius:8px;padding:10px;margin-bottom:6px;border-left:3px solid #fb923c}
.pending-item .name{font-size:15px;font-weight:700}
.pending-item .actions{display:flex;gap:6px;margin-top:8px}
.pending-item .actions button{flex:1;padding:8px;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer}
.btn-confirm{background:#22c55e;color:#fff}
.btn-reject{background:#ef4444;color:#fff}
.pax-card{background:#1e293b;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #334155;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.pax-card.full{opacity:.5}
.pax-card .time{font-size:20px;font-weight:700}
.pax-card .info{font-size:12px;color:#94a3b8;margin-top:2px}
.pax-card .num{font-size:22px;font-weight:700;color:#22c55e}
.pax-card .num.zero{color:#ef4444}
.wake-lock-status{position:fixed;bottom:12px;left:12px;font-size:12px;color:#666;z-index:5;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:10px}
.connection-status{position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:6px 20px;border-radius:20px;font-size:14px;z-index:100;display:none}
.connection-status.online{background:#30d158;color:#fff;display:block}
.connection-status.offline{background:#ff453a;color:#fff;display:block}
.admin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.admin-stat{background:#2c2c2e;border-radius:10px;padding:10px;text-align:center}
.admin-stat .label{font-size:12px;color:#888}
.admin-stat .value{font-size:22px;font-weight:800;color:#fc0}
</style>
</head>
<body>
<div class="header">
  <div class="title">🚐 西鐵小巴系統</div>
  <div class="dev">開發者-大輝</div>
  <button class="voice-btn" id="global-voice-btn">🔊</button>
</div>
<div class="connection-status" id="connection-status"></div>

<div class="modal" id="login-modal">
  <div class="modal-card">
    <h2>🔐 登入</h2>
    <div id="login-choice">
      <button class="btn btn-primary" id="login-google">🅶 管理員 Google 登入</button>
      <button class="btn btn-driver" id="login-driver">🚏 司機登入</button>
      <button class="btn btn-portal" id="login-passenger">🧍 乘客登入</button>
    </div>
    <div id="driver-login-form" style="display:none">
      <label>司機電郵 / 電話</label>
      <input type="text" id="driver-identifier" placeholder="例如：91234567">
      <button class="btn btn-success" id="driver-login-btn">確認登入</button>
      <button class="btn btn-secondary" id="driver-login-back">返回</button>
      <div id="driver-login-error" style="color:#ff453a;font-size:14px;margin-top:8px;text-align:center"></div>
    </div>
    <div id="passenger-login-form" style="display:none">
      <label>電話號碼（8 位數字）</label>
      <input type="tel" id="passenger-phone" placeholder="例如：91234567" maxlength="8" inputmode="numeric">
      <label>姓名</label>
      <input type="text" id="passenger-name" placeholder="例如：陳先生" maxlength="20">
      <button class="btn btn-portal" id="passenger-login-btn">確認登入</button>
      <button class="btn btn-secondary" id="passenger-login-back">返回</button>
      <div id="passenger-login-error" style="color:#ff453a;font-size:14px;margin-top:8px;text-align:center"></div>
    </div>
    <button class="btn btn-secondary" id="login-cancel">取消</button>
  </div>
</div>

<div id="view-lobby" class="view active">
  <div class="card">
    <div class="card-title">📋 使用說明</div>
    <div style="font-size:14px;line-height:1.8;color:#ccc">
      🚏 司機：登入→輸入車牌→開始當值→自動報站→留位確認<br>
      🧍 乘客：登入→追蹤小巴或留位<br>
      🎙️ 對講機：司機之間／管理員與司機通話
    </div>
  </div>
  <button class="btn btn-portal" id="btn-passenger">🧍 乘客入口</button>
  <button class="btn btn-driver" id="btn-driver">🚏 司機入口</button>
  <button class="btn btn-warn" id="btn-admin-panel" style="display:none">👑 總管後台</button>
  <button class="btn btn-secondary" id="btn-logout" style="display:none">🚪 登出</button>
  <div class="card" style="text-align:center">
    <div style="font-size:16px;font-weight:700;color:#fc0;margin-bottom:8px">☕ 支持開發者</div>
    <div id="fps-code" style="background:#000;padding:10px;border-radius:10px;display:inline-block;font-size:18px;color:#fc0;cursor:pointer">轉數快：122891914</div>
  </div>
</div>

<div id="view-passenger-list" class="view">
  <div class="card-title">🚐 線上小巴</div>
  <button class="btn btn-secondary btn-sm" id="btn-refresh-buslist" style="margin-bottom:10px">🔄 重新整理</button>
  <div id="bus-list-container">載入中…</div>
  <button class="btn btn-secondary" id="btn-back-list" style="margin-top:12px">← 返回大堂</button>
</div>

<div id="view-passenger" class="view">
  <div class="tab-bar">
    <button class="tab-btn active" id="pax-tab-track">🚐 追蹤小巴</button>
    <button class="tab-btn" id="pax-tab-booking">🎫 留位</button>
  </div>
  <div id="pax-panel-track">
    <div class="card" id="pass-data-card">讀取中…</div>
    <div class="route-strip" id="pass-route-strip"></div>
    <div class="msg-area">
      <div class="msg-list" id="pass-msg-list"></div>
      <div class="msg-row">
        <input id="pass-msg-input" class="msg-input" placeholder="訊息…">
        <button class="send-btn" id="btn-pass-send">發</button>
      </div>
    </div>
    <button class="btn btn-secondary" id="btn-back-track" style="margin-top:10px">← 返回列表</button>
  </div>
  <div id="pax-panel-booking" style="display:none">
    <div id="passenger-booking-content"></div>
  </div>
</div>

<div id="view-driver" class="view">
  <div class="card" style="text-align:center">
    <div style="font-size:16px;color:#aaa" id="d-info">🚐 未登入</div>
    <div style="margin:8px 0">
      <span class="badge badge-purple" id="d-mode-badge">西鐵快線</span>
      <span class="badge badge-red" id="d-dir-badge">往元朗</span>
    </div>
    <div class="station-name" id="d-station">大棠黃泥墩</div>
    <div id="d-target" style="font-size:18px;color:#fc0">下一站：--</div>
    <div id="d-gps-status" style="font-size:14px;color:#888;margin-top:6px">📍 GPS 定位中...</div>
  </div>
  <div class="card" style="text-align:center">
    <div style="font-size:18px;color:#aaa">目前乘客</div>
    <div class="big-number" id="d-pass-count">0</div>
    <div class="row">
      <button class="btn btn-success" id="btn-add-pass">＋ 乘客</button>
      <button class="btn btn-danger" id="btn-sub-pass">－ 乘客</button>
    </div>
  </div>
  <div class="row">
    <button class="btn btn-primary" id="btn-prev">◀ 上一站</button>
    <button class="btn btn-primary" id="btn-next">下一站 ▶</button>
  </div>
  <div class="row">
    <button class="btn btn-success" id="d-full-btn">🚫 滿座</button>
    <button class="btn btn-secondary" id="d-car-btn">16座</button>
  </div>
  <div class="row">
    <button class="btn btn-secondary" id="btn-switch-dir">🔄 調頭</button>
    <button class="btn btn-purple" id="btn-mode-toggle">🔄 切換路線</button>
  </div>
  <div class="row">
    <input id="driver-plate-input" placeholder="輸入車牌" style="margin:0">
    <button class="btn btn-success" id="btn-set-plate" style="width:auto;flex:0 0 auto;padding:12px 20px">設定</button>
  </div>
  <button class="btn btn-success" id="start-gps">🟢 開始當值 (GPS)</button>
  <button class="btn btn-danger" id="stop-gps" style="display:none">🔴 停止當值</button>
  <div class="route-strip" id="d-route-strip"></div>
  <div class="tab-bar" style="margin-top:12px">
    <button class="tab-btn active" id="driver-tab-booking">🎫 留位確認</button>
    <button class="tab-btn" id="driver-tab-walkie">🎙️ 對講機</button>
    <button class="tab-btn" id="driver-tab-msg">💬 訊息</button>
  </div>
  <div id="driver-panel-booking">
    <div id="driver-booking-content"></div>
  </div>
  <div id="driver-panel-walkie" style="display:none">
    <div class="card">
      <label>廣播目標</label>
      <div class="row">
        <select id="walkie-target"><option value="all">📢 全部司機</option></select>
        <button class="btn btn-secondary btn-sm" id="walkie-refresh-targets" style="flex:0 0 auto">🔄</button>
      </div>
      <button class="btn btn-warn" id="btn-walkie-record">🎤 撳一下開始錄音</button>
      <div id="walkie-record-controls" class="rec-controls">
        <button class="rec-stop" id="walkie-stop">✅ 發送</button>
        <button class="rec-cancel" id="walkie-cancel">❌ 取消</button>
      </div>
      <div id="walkie-rec-status" class="rec-status"><div class="rec-dot"></div><span>錄音中... <span id="walkie-rec-time">0</span>s</span></div>
      <div id="walkie-messages" style="max-height:200px;overflow-y:auto;background:#1a1a1a;border-radius:10px;padding:8px;margin-top:8px"></div>
    </div>
  </div>
  <div id="driver-panel-msg" style="display:none">
    <div class="msg-area">
      <div class="msg-list" id="driver-msg-list"></div>
      <div class="msg-row">
        <input id="driver-msg-input" class="msg-input" placeholder="訊息…">
        <button class="send-btn" id="btn-driver-send">發</button>
      </div>
      <button class="btn btn-warn" id="btn-driver-record" style="margin-top:8px">🎤 撳一下開始錄音</button>
      <div id="driver-record-controls" class="rec-controls">
        <button class="rec-stop" id="driver-stop">✅ 發送</button>
        <button class="rec-cancel" id="driver-cancel">❌ 取消</button>
      </div>
      <div id="driver-rec-status" class="rec-status"><div class="rec-dot"></div><span>錄音中... <span id="driver-rec-time">0</span>s</span></div>
    </div>
  </div>
  <button class="btn btn-secondary" id="btn-driver-back" style="margin-top:12px">← 返回大堂</button>
</div>

<div id="view-admin" class="view">
  <div class="card">
    <div class="card-title">🛡️ 總管後台</div>
    <div class="admin-grid">
      <div class="admin-stat"><div class="label">🚐 在線</div><div class="value" id="admin-active-count">0</div></div>
      <div class="admin-stat"><div class="label">👥 乘客</div><div class="value" id="admin-passenger-count">0</div></div>
      <div class="admin-stat"><div class="label">💬 訊息</div><div class="value" id="admin-msg-count">0</div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">📊 今日留位概況</div>
    <div id="admin-booking-stats" style="font-size:14px;line-height:1.8"></div>
  </div>
  <div class="card">
    <div class="card-title">📢 系統公告</div>
    <div id="admin-announce-list" style="max-height:200px;overflow-y:auto;margin-bottom:8px"></div>
    <input id="admin-announce-text" placeholder="輸入公告內容">
    <button class="btn btn-primary btn-sm" id="btn-publish-announce">發佈公告</button>
  </div>
  <button class="btn btn-secondary" id="btn-back-admin">← 返回大堂</button>
</div>

<div id="toast" class="toast"></div>
<div class="wake-lock-status" id="wake-lock-status">🔋 屏幕鎖: 未啟用</div>

function calcDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

/* ---------- 音頻播放（音量降低 30%）---------- */
function playBoostedAudio(base64, boost) {
  if (!base64) return;
  const actualBoost = boost || CONFIG.VOICE_MSG_BOOST;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const bytes = Uint8Array.from(atob(base64), function(c) { return c.charCodeAt(0); });
    ctx.decodeAudioData(bytes.buffer, function(buf) {
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const gain = ctx.createGain();
      gain.gain.value = actualBoost;
      src.connect(gain);
      gain.connect(ctx.destination);
      src.start(0);
    }, function() {
      const a = new Audio('data:audio/webm;base64,' + base64);
      a.volume = 0.7;
      a.play().catch(function() {});
    });
  } catch (e) {
    const a = new Audio('data:audio/webm;base64,' + base64);
    a.volume = 0.7;
    a.play().catch(function() {});
  }
}

/* ---------- 語音合成 ---------- */
function speakCantonese(text) {
  if (!voiceEnabled || !window.speechSynthesis) return Promise.resolve();
  return new Promise(function(resolve) {
    if (_speakQueue.length > 3) _speakQueue.shift();
    _speakQueue.push({ text: text, resolve: resolve });
    _processSpeakQueue();
  });
}

function _processSpeakQueue() {
  if (_speakBusy || _speakQueue.length === 0) return;
  _speakBusy = true;
  const item = _speakQueue.shift();
  const text = item.text;
  const resolve = item.resolve;
  if (!voiceEnabled || !window.speechSynthesis) {
    _speakBusy = false;
    resolve();
    setTimeout(_processSpeakQueue, 0);
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-HK';
  u.volume = 1;
  u.rate = 0.9;
  const voices = window.speechSynthesis.getVoices();
  if (voices.length > 0) {
    const v = voices.find(function(x) { return x.lang === 'zh-HK'; }) || voices.find(function(x) { return x.lang.indexOf('zh') === 0; });
    if (v) u.voice = v;
  }
  let resolved = false;
  const done = function() {
    if (!resolved) {
      resolved = true;
      resolve();
      _speakBusy = false;
      setTimeout(_processSpeakQueue, 0);
    }
  };
  const timer = setTimeout(done, 6000);
  u.onend = function() { clearTimeout(timer); done(); };
  u.onerror = function() { clearTimeout(timer); done(); };
  window.speechSynthesis.speak(u);
}

async function speakWithDelay(p1, p2) {
  voiceLock = false;
  try {
    await speakCantonese(p1);
    await new Promise(function(r) { setTimeout(r, 2000); });
    if (p2) await speakCantonese(p2);
  } finally {
    voiceLock = false;
  }
}

/* ---------- 錄音管理器（撳一下開始、撳一下發送、中途可取消）---------- */
const RecorderManager = {
  instances: {},
  create: function(id, onSend) {
    if (this.instances[id]) return this.instances[id];
    let mediaRecorder = null;
    let mediaStream = null;
    let chunks = [];
    let timer = null;
    let seconds = 0;
    let isRecording = false;
    const self = { id: id };
    self.start = function() {
      if (isRecording) return;
      isRecording = true;
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
        mediaStream = stream;
        let recorder;
        try {
          recorder = new MediaRecorder(stream, { audioBitsPerSecond: CONFIG.VOICE_BITRATE, mimeType: 'audio/webm;codecs=opus' });
        } catch (e) {
          recorder = new MediaRecorder(stream, { audioBitsPerSecond: CONFIG.VOICE_BITRATE });
        }
        mediaRecorder = recorder;
        chunks = [];
        mediaRecorder.ondataavailable = function(e) { chunks.push(e.data); };
        mediaRecorder.onstop = function() {
          if (mediaStream) {
            mediaStream.getTracks().forEach(function(t) { t.stop(); });
            mediaStream = null;
          }
        };
        mediaRecorder.start();
        seconds = 0;
        const st = document.getElementById(id + '-rec-status');
        if (st) st.style.display = 'flex';
        const tm = document.getElementById(id + '-rec-time');
        if (tm) tm.textContent = '0';
        timer = setInterval(function() {
          seconds++;
          if (tm) tm.textContent = seconds;
          if (seconds >= CONFIG.RECORD_MAX_SECONDS) { self.stop(); }
        }, 1000);
      }).catch(function() {
        showToast('❌ 無法開啟咪高峰');
        isRecording = false;
      });
    };
    self.stop = function() {
      if (!isRecording) return;
      isRecording = false;
      if (timer) { clearInterval(timer); timer = null; }
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.onstop = function() {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = function() {
            const base64 = reader.result.split(',')[1];
            if (onSend) onSend(base64);
            if (mediaStream) {
              mediaStream.getTracks().forEach(function(t) { t.stop(); });
              mediaStream = null;
            }
          };
          reader.readAsDataURL(blob);
        };
        mediaRecorder.stop();
      }
      const st = document.getElementById(id + '-rec-status');
      if (st) st.style.display = 'none';
    };
    self.cancel = function() {
      if (!isRecording) return;
      isRecording = false;
      if (timer) { clearInterval(timer); timer = null; }
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.onstop = function() {
          if (mediaStream) {
            mediaStream.getTracks().forEach(function(t) { t.stop(); });
            mediaStream = null;
          }
        };
        mediaRecorder.stop();
      }
      const st = document.getElementById(id + '-rec-status');
      if (st) st.style.display = 'none';
      showToast('❌ 錄音已取消');
    };
    self.isRecording = function() { return isRecording; };
    this.instances[id] = self;
    return self;
  },
  get: function(id) { return this.instances[id]; }
};

function setupRecorderUI(id, onSend) {
  const btn = document.getElementById('btn-' + id + '-record');
  const controls = document.getElementById(id + '-record-controls');
  const stopBtn = document.getElementById(id + '-stop');
  const cancelBtn = document.getElementById(id + '-cancel');
  if (!btn) return;
  RecorderManager.create(id, onSend);
  btn.addEventListener('click', function() {
    const rec = RecorderManager.get(id);
    if (rec.isRecording()) return;
    rec.start();
    if (controls) controls.style.display = 'flex';
    btn.style.display = 'none';
  });
  if (stopBtn) {
    stopBtn.addEventListener('click', function() {
      const rec = RecorderManager.get(id);
      if (rec && rec.isRecording()) rec.stop();
      if (controls) controls.style.display = 'none';
      btn.style.display = 'block';
    });
  }
  if (cancelBtn) {
    cancelBtn.addEventListener('click', function() {
      const rec = RecorderManager.get(id);
      if (rec && rec.isRecording()) rec.cancel();
      if (controls) controls.style.display = 'none';
      btn.style.display = 'block';
    });
  }
}

    if (cu && cu.uid === uid && cu.email && isSuperAdminEmail(cu.email)) return true;
    const s = await db.ref('admins/' + uid + '/super').once('value');

    if (isSuperAdminEmail(u.val())) return true;

async function checkRole(identifier, uid) {
  let role = 'passenger';
  try {
    if (uid) {
      const a = await db.ref('admins/' + uid).once('value');
      if (a.exists()) return 'admin';
    }
    const adminSnap = await db.ref('admins').orderByChild('identifier').equalTo(identifier).once('value');
    if (adminSnap.exists()) return 'admin';
    const driverSnap = await db.ref('drivers').orderByChild('identifier').equalTo(identifier).once('value');
    if (driverSnap.exists()) return 'driver';
  } catch (e) { console.warn('檢查角色失敗:', e); }
  return role;
}

/* ---------- 司機 UI ---------- */
function updateDriverUI() {
  const route = getRoute();
  const idx = driverData.stationIndex || 0;
  const station = route[idx] || '未知';
  const nextIdx = idx + 1 < route.length ? idx + 1 : 0;
  const nextStation = route[nextIdx] || '終點';
  const plateDisplay = driverData.plate || '未設定';
  const infoEl = document.getElementById('d-info');
  if (infoEl) infoEl.textContent = '🚐 ' + plateDisplay + ' | 司機: ' + (currentUser.identifier || '未登入');
  const stationEl = document.getElementById('d-station');
  if (stationEl) stationEl.textContent = station;
  const targetEl = document.getElementById('d-target');
  if (targetEl) targetEl.textContent = '下一站：' + nextStation;
  const passEl = document.getElementById('d-pass-count');
  if (passEl) passEl.textContent = driverData.passengerCount;
  const modeEl = document.getElementById('d-mode-badge');
  if (modeEl) modeEl.textContent = driverData.mode === 'busy' ? '西鐵快線' : '市中心循環線';
  const dirEl = document.getElementById('d-dir-badge');
  if (dirEl) dirEl.textContent = driverData.direction === 0 ? '往元朗' : '往大棠';
  const fullBtn = document.getElementById('d-full-btn');
  if (fullBtn) {
    fullBtn.style.background = driverData.isFull ? '#ff453a' : '#30d158';
    fullBtn.textContent = driverData.isFull ? '✅ 滿座' : '🚫 滿座';
  }
  const carBtn = document.getElementById('d-car-btn');
  if (carBtn) carBtn.textContent = driverData.carSeats + '座';
  renderDriverRouteStrip();
}

function renderDriverRouteStrip() {
  const strip = document.getElementById('d-route-strip');
  if (!strip) return;
  const route = getRoute();
  const idx = driverData.stationIndex || 0;
  const children = strip.children;
  if (children.length === route.length) {
    for (let i = 0; i < route.length; i++) {
      const node = children[i];
      node.className = 'dot-node';
      if (i < idx) node.classList.add('passed');
      else if (i === idx) node.classList.add('current');
      else if (i === idx + 1) node.classList.add('next');
      const span = node.querySelector('span');
      if (span && span.textContent !== route[i]) span.textContent = route[i];
    }
  } else {
    strip.innerHTML = '';
    route.forEach(function(name, i) {
      const node = document.createElement('div');
      node.className = 'dot-node';
      if (i < idx) node.classList.add('passed');
      else if (i === idx) node.classList.add('current');
      else if (i === idx + 1) node.classList.add('next');
      const dot = document.createElement('div');
      dot.className = 'dot';
      const span = document.createElement('span');
      span.textContent = name;
      node.appendChild(dot);
      node.appendChild(span);
      strip.appendChild(node);
    });
  }
  if (idx !== lastDriverScrollIndex) {
    const current = strip.querySelector('.dot-node.current');
    if (current) {
      const sr = strip.getBoundingClientRect();
      const nr = current.getBoundingClientRect();
      const offset = nr.left - sr.left - (sr.width / 2) + (nr.width / 2);
      strip.scrollLeft += offset;
    }
    lastDriverScrollIndex = idx;
  }
}

function updateDriverDB() {
  const route = getRoute();

  };

function resetDriverData(keepPlate) {
  driverData.stationIndex = 0;
  driverData.passengerCount = 0;
  driverData.isFull = false;
  driverData.isActive = false;
  if (!keepPlate) driverData.plate = null;
  lastReportedIndex = -1;
  lastDriverScrollIndex = -1;
  pendingStationIdx = -1;
  pendingStationCount = 0;
  if (gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
  if (gpsRetryTimer) { clearTimeout(gpsRetryTimer); gpsRetryTimer = null; }
  releaseWakeLock();
  updateDriverUI();
  if (driverData.plate) db.ref('van/active_buses/' + driverData.plate).remove().catch(function() {});
  const gs = document.getElementById('d-gps-status');
  if (gs) gs.textContent = '📍 GPS 已停止';
  const sg = document.getElementById('start-gps');

  const stg = document.getElementById('stop-gps');
  if (stg) stg.style.display = 'none';
}

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      if (wakeLock) { try { await wakeLock.release(); } catch (e) {} wakeLock = null; }
      wakeLock = await navigator.wakeLock.request('screen');
      const e = document.getElementById('wake-lock-status');
      if (e) e.textContent = '🔋 屏幕鎖: 已啟用 ✅';
      return true;
    }
    return false;
  } catch (e) { return false; }
}

async function releaseWakeLock() {
  try { if (wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) {}
}

function startGpsWatch() {
  if (gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
  if (gpsRetryTimer) { clearTimeout(gpsRetryTimer); gpsRetryTimer = null; }
  const gs = document.getElementById('d-gps-status');
  if (gs) gs.textContent = '📍 GPS 定位中⋯';
  let firstFix = false;
  gpsFirstFix = false;
  lastPos = null;
  lastPosTime = 0;
  positionBuffer = [];
  pendingStationIdx = -1;
  pendingStationCount = 0;
  gpsWatchId = navigator.geolocation.watchPosition(function(pos) {
    if (pos.coords.accuracy > CONFIG.GPS_ACCURACY_THRESHOLD) {
      if (gs) gs.textContent = '⚠️ GPS 精度不足 (' + Math.round(pos.coords.accuracy) + 'm)';
      return;
    }
    if (!firstFix) {
      firstFix = true;
      gpsFirstFix = true;
      if (gpsRetryTimer) { clearTimeout(gpsRetryTimer); gpsRetryTimer = null; }
      showToast('✅ GPS 已定位');
      if (gs) gs.textContent = '📍 GPS 已定位';
    }
    if (!driverData.isActive || !driverData.plate) return;
    const n = nowMs();
    if (n - lastGpsProcessTime < 1000) return;
    lastGpsProcessTime = n;
    positionBuffer.push({ lat: pos.coords.latitude, lng: pos.coords.longitude });
    if (positionBuffer.length > CONFIG.SMOOTHING_WINDOW) positionBuffer.shift();
    let avgLat = 0, avgLng = 0;
    positionBuffer.forEach(function(p) { avgLat += p.lat; avgLng += p.lng; });
    avgLat /= positionBuffer.length;
    avgLng /= positionBuffer.length;
    let speed = 0;
    if (lastPos) {
      const dt = (n - lastPosTime) / 1000;
      if (dt > 0) speed = calcDistance(lastPos.lat, lastPos.lng, pos.coords.latitude, pos.coords.longitude) / dt;
    }
    lastPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    lastPosTime = n;
    const coords = getCoords();
    const route = getRoute();
    if (!coords || !coords.length) return;
    let minDist = Infinity, nearestIdx = 0;
    for (let i = 0; i < coords.length; i++) {
      const d = calcDistance(avgLat, avgLng, coords[i].lat, coords[i].lng);
      if (d < minDist) { minDist = d; nearestIdx = i; }
    }
    if (gs) gs.textContent = '📍 ' + route[nearestIdx] + ' (' + Math.round(minDist) + 'm) · ' + speed.toFixed(1) + 'm/s';
    if (minDist < CONFIG.TRIGGER_DISTANCE && nearestIdx > lastReportedIndex) {
      if (speed < CONFIG.MIN_SPEED_FOR_TRIGGER) return;
      if (pendingStationIdx === nearestIdx) { pendingStationCount++; }
      else { pendingStationIdx = nearestIdx; pendingStationCount = 1; }
      if (pendingStationCount < 2) return;
      pendingStationIdx = -1;
      pendingStationCount = 0;
      lastReportedIndex = nearestIdx;
      driverData.stationIndex = nearestIdx;
      updateDriverDB();
      renderDriverRouteStrip();
      const stationName = route[nearestIdx];
      const nextIdx = nearestIdx + 1;
      const nextStationName = nextIdx < route.length ? route[nextIdx] : null;
      if (voiceEnabled) {
        if (nextStationName) {
          speakWithDelay(VOICE_TEXTS.arrived + stationName, VOICE_TEXTS.nextStation + nextStationName);
        } else {
          speakCantonese(VOICE_TEXTS.arrived + stationName).then(function() {
            setTimeout(function() { speakCantonese(VOICE_TEXTS.lastStation); }, 2000);
          });
        }
      }
      if (nearestIdx === route.length - 1 && driverData.isActive) {
        setTimeout(function() {
          if (!driverData.isActive) return;
          driverData.direction = driverData.direction === 0 ? 1 : 0;
          driverData.stationIndex = 0;
          driverData.passengerCount = 0;
          driverData.isFull = false;
          lastReportedIndex = 0;
          lastDriverScrollIndex = -1;
          updateDriverDB();
          renderDriverRouteStrip();
          showToast('🔄 已到總站，自動掉頭');
        }, 3000);
      }
    }
  }, function(err) {
    console.error('GPS 錯誤:', err);
    if (gs) gs.textContent = '📍 GPS 定位失敗';
    if (err.code === 3 || err.code === 1) {
      if (gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
      setTimeout(function() { if (driverData.isActive) startGpsWatch(); }, CONFIG.GPS_RETRY_DELAY);
    }
  }, { enableHighAccuracy: true, timeout: CONFIG.GPS_TIMEOUT, maximumAge: 0 });
  gpsRetryTimer = setTimeout(function() {
    if (!gpsFirstFix && driverData.isActive) {
      if (gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
      startGpsWatch();
    }
  }, 10000);
}

function startDuty() {
  if (!driverData.plate) { showToast('請先設定車牌'); return; }
  if (!navigator.geolocation) showToast('瀏覽器不支援 GPS');
  gpsFirstFix = false;
  if (gpsRetryTimer) { clearTimeout(gpsRetryTimer); gpsRetryTimer = null; }
  voiceLock = false;
  lastPos = null;
  lastPosTime = 0;
  gpsRestartNeeded = false;
  positionBuffer = [];
  pendingStationIdx = -1;
  pendingStationCount = 0;
  requestWakeLock();
  driverData.isActive = true;
  driverData.stationIndex = 0;
  driverData.direction = 0;
  driverData.passengerCount = 0;
  driverData.isFull = false;
  lastReportedIndex = -1;
  lastDriverScrollIndex = -1;
  updateDriverDB();
  updateDriverUI();
  showToast('🟢 已開始當值');
  if (voiceEnabled) speakCantonese(VOICE_TEXTS.startDuty);
  vibrate(50);
  if (navigator.geolocation) {
    setTimeout(function() { if (driverData.isActive) startGpsWatch(); }, 1500);
  }
  const sg = document.getElementById('start-gps');
  if (sg) sg.style.display = 'none';
  const stg = document.getElementById('stop-gps');
  if (stg) stg.style.display = 'block';
}

function stopDuty() {
  if (!confirm('確定停止當值？')) return;
  driverData.isActive = false;
  if (gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
  if (gpsRetryTimer) { clearTimeout(gpsRetryTimer); gpsRetryTimer = null; }
  releaseWakeLock();
  if (driverData.plate) db.ref('van/active_buses/' + driverData.plate).remove().catch(function() {});
  resetDriverData(true);
  const sg = document.getElementById('start-gps');
  if (sg) sg.style.display = 'block';
  const stg = document.getElementById('stop-gps');
  if (stg) stg.style.display = 'none';
  showToast('🔴 已停止當值');
  if (voiceEnabled) speakCantonese(VOICE_TEXTS.stopDuty);
}

async function goToNextStation() {
  if (!driverData.isActive) { showToast('請先開始當值'); return; }
  const route = getRoute();
  if (driverData.stationIndex < route.length - 1) {
    driverData.stationIndex++;
  } else {
    driverData.direction = driverData.direction === 0 ? 1 : 0;
    driverData.stationIndex = 0;
    driverData.passengerCount = 0;
    driverData.isFull = false;
    lastReportedIndex = 0;
    lastDriverScrollIndex = -1;
    showToast('🔄 已到總站，調頭清客');
    if (voiceEnabled) speakCantonese(VOICE_TEXTS.arrivedTerminus);
    updateDriverDB();
    renderDriverRouteStrip();
    return;
  }
  lastReportedIndex = driverData.stationIndex;
  updateDriverDB();
  renderDriverRouteStrip();
  const newRoute = getRoute();
  const currentStation = newRoute[driverData.stationIndex];
  const nextIdx = driverData.stationIndex + 1;
  const nextStationName = nextIdx < newRoute.length ? newRoute[nextIdx] : null;
  if (voiceEnabled) {
    if (nextStationName) {
      await speakWithDelay(VOICE_TEXTS.arrived + currentStation, VOICE_TEXTS.nextStation + nextStationName);
    } else {
      await speakCantonese(VOICE_TEXTS.arrived + currentStation);
      setTimeout(function() { speakCantonese(VOICE_TEXTS.lastStation); }, 2000);
    }
  }
}

async function goToPrevStation() {
  if (!driverData.isActive) { showToast('請先開始當值'); return; }
  const route = getRoute();
  if (driverData.stationIndex > 0) {
    driverData.stationIndex--;
  } else {
    driverData.direction = driverData.direction === 0 ? 1 : 0;
    const newRoute = getRoute();
    driverData.stationIndex = newRoute.length - 1;
    lastReportedIndex = -1;
    lastDriverScrollIndex = -1;
    showToast('🔄 已調頭至總站');
    if (voiceEnabled) speakCantonese(VOICE_TEXTS.turnAround);
    updateDriverDB();
    renderDriverRouteStrip();
    return;
  }
  lastReportedIndex = driverData.stationIndex;
  updateDriverDB();
  renderDriverRouteStrip();
  const newRoute = getRoute();
  const currentStation = newRoute[driverData.stationIndex];
  const nextIdx = driverData.stationIndex + 1;
  const nextStationName = nextIdx < newRoute.length ? newRoute[nextIdx] : null;
  if (voiceEnabled) {
    if (nextStationName) {
      await speakWithDelay(VOICE_TEXTS.arrived + currentStation, VOICE_TEXTS.nextStation + nextStationName);
    } else {
      await speakCantonese(VOICE_TEXTS.arrived + currentStation);
      setTimeout(function() { speakCantonese(VOICE_TEXTS.lastStation); }, 2000);
    }
  }
}

function renderDriverBookingContent() {
  const c = document.getElementById('driver-booking-content');
  if (!c) return;
  const t = getToday();
  const bookings = currentCachedBookings;
  const seatsConfig = currentCachedBookings._sc || {};
  let h = '';
  h += '<button class="btn btn-outline btn-sm" onclick="renderDriverBookingContent()" style="margin-bottom:10px">🔄 重新整理</button>';
  h += '<div class="card-title">📋 固定班次</div>';
  const allS = SM.concat(SE);
  let hasAny = false;
  allS.forEach(function(tm) {
    const sid = getSid(t, tm);
    const cfg = seatsConfig[tm.replace(':', '')];
    const quota = (cfg && (cfg.quota || cfg.seats)) || 16;
    const dir = getDir(tm);
    const sb = Object.keys(bookings).filter(function(k) { return k !== '_sc'; }).map(function(k) { return bookings[k]; }).filter(function(b) { return b && b.scheduleId === sid && b.status !== 'cancelled'; });
    const used = sb.filter(function(b) { return ['pending', 'reserved', 'arrived', 'boarded'].indexOf(b.status) >= 0; }).reduce(function(s, b) { return s + (b.seats || 0); }, 0);
    const rem = quota - used;
    const full = rem <= 0;
    const pl = sb.filter(function(b) { return b.status === 'pending'; });
    const cl = sb.filter(function(b) { return b.status === 'reserved'; });
    const al = sb.filter(function(b) { return b.status === 'arrived' || b.status === 'boarded'; });
    if (pl.length === 0 && cl.length === 0 && al.length === 0) return;
    hasAny = true;
    h += '<div class="booking-card' + (full ? ' full' : '') + '">';
    h += '<div class="time">' + esc(tm) + '</div>';
    h += '<div class="info" style="color:' + (dir === 'morning' ? '#4ade80' : '#fdba74') + ';font-weight:700">' + esc(getOrigL(tm)) + '</div>';
    h += '<div class="counts"><div><div style="font-size:13px;color:#fdba74">⏳ ' + pl.length + ' 待確認</div><div style="font-size:13px;color:#4ade80;margin-top:2px">🔴 ' + al.length + ' 已到 · ✅ ' + cl.length + ' 已確認</div></div><div style="text-align:right"><div class="seat-num' + (rem <= 0 ? ' zero' : '') + '">' + rem + '</div><div style="font-size:11px;color:#64748b">剩餘 / ' + quota + '</div></div></div>';
    if (pl.length > 0) {
      h += '<div style="background:#1c1917;border:2px solid #fb923c;border-radius:10px;padding:10px;margin-top:10px">';
      h += '<div style="font-size:13px;font-weight:700;color:#fdba74;margin-bottom:6px">🔔 待確認（' + pl.length + '）</div>';
      pl.forEach(function(b) {
        const bt = b.createdAt ? new Date(b.createdAt).toLocaleString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
        h += '<div class="pending-item"><div class="name">' + esc(b.passengerName) + (b.seats > 1 ? ' ×' + b.seats : '') + '</div>';
        h += '<div style="font-size:12px;color:#94a3b8;margin-top:2px">📞 ' + esc(b.passengerPhone) + '</div>';
        h += b.pickupLocation ? '<div class="pickup">📍 ' + esc(b.pickupLocation) + '</div>' : '<div class="pickup" style="color:#f87171">📍 未填</div>';
        h += bt ? '<div style="font-size:11px;color:#64748b;margin-top:4px">⏰ ' + bt + '</div>' : '';
        h += '<div class="actions"><button class="btn-confirm" onclick="driverConfirm(\'' + b.date + '\',\'' + b.id + '\',\'' + esc(driverData.plate || '') + '\')">✅ 確認</button><button class="btn-reject" onclick="driverReject(\'' + b.date + '\',\'' + b.id + '\')">❌ 拒絕</button></div></div>';
      });
      h += '</div>';
    }
    const confirmedAll = al.concat(cl);
    if (confirmedAll.length > 0) {
      h += '<div style="margin-top:10px">';
      confirmedAll.forEach(function(b) {
        const tr = currentPassengerTracking[b.id];
        let gpsLine = '';
        if (tr && tr.updatedAt && (nowMs() - tr.updatedAt < 120000)) {
          gpsLine = tr.arrived ? '<div style="font-size:12px;color:#4ade80;margin-top:4px;font-weight:600">🟢 已到站（' + Math.round(tr.distance) + ' 米）</div>' : '<div style="font-size:12px;color:#fbbf24;margin-top:4px;font-weight:600">🟡 前往中（' + Math.round(tr.distance) + ' 米）</div>';
        } else if (b.arrivedAuto || b.arrivedAt) {
          gpsLine = '<div style="font-size:12px;color:#4ade80;margin-top:4px;font-weight:600">🟢 已到站</div>';
        } else {
          gpsLine = '<div style="font-size:12px;color:#94a3b8;margin-top:4px;font-weight:600">⚪ 等待 GPS...</div>';
        }
        h += '<div style="background:#0f172a;border-radius:8px;padding:10px;margin-bottom:6px;border-left:3px solid #22c55e"><div class="name">' + esc(b.passengerName) + (b.seats > 1 ? ' ×' + b.seats : '') + '</div><div style="font-size:12px;color:#94a3b8;margin-top:2px">📞 ' + esc(b.passengerPhone) + '</div>' + (b.pickupLocation ? '<div class="pickup">📍 ' + esc(b.pickupLocation) + '</div>' : '') + gpsLine + '</div>';
      });
      h += '</div>';
    }
    h += '</div>';
  });
  if (!hasAny) h += '<div style="text-align:center;color:#64748b;padding:16px">暫無預約</div>';
  h += '<div class="card-title" style="margin-top:14px">🔄 循環線留位</div>';
  const lp = Object.keys(currentCachedLoop).map(function(k) { return currentCachedLoop[k]; }).filter(function(x) { return x && x.status === 'pending'; });
  const lr = Object.keys(currentCachedLoop).map(function(k) { return currentCachedLoop[k]; }).filter(function(x) { return x && x.status === 'reserved'; });
  if (lp.length === 0 && lr.length === 0) {
    h += '<div style="text-align:center;color:#64748b;padding:16px;font-size:14px">暫無循環線留位</div>';
  } else {
    if (lp.length > 0) {
      h += '<div style="background:#1c1917;border:2px solid #fb923c;border-radius:10px;padding:10px">';
      h += '<div style="font-size:13px;font-weight:700;color:#fdba74;margin-bottom:6px">🔔 待確認（' + lp.length + '）</div>';
      lp.forEach(function(x) {
        const bt = x.createdAt ? new Date(x.createdAt).toLocaleString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
        h += '<div class="pending-item"><div class="name">' + esc(x.name) + '</div><div style="font-size:12px;color:#94a3b8;margin-top:2px">📞 ' + esc(x.phone) + '</div>' + (x.pickupLocation ? '<div class="pickup">📍 ' + esc(x.pickupLocation) + '</div>' : '') + (bt ? '<div style="font-size:11px;color:#64748b;margin-top:4px">⏰ ' + bt + '</div>' : '') + '<div class="actions"><button class="btn-confirm" onclick="driverConfirmLoop(\'' + x.id + '\')">✅ 確認</button><button class="btn-reject" onclick="driverRejectLoop(\'' + x.id + '\')">❌ 拒絕</button></div></div>';
      });
      h += '</div>';
    }
    if (lr.length > 0) {
      h += '<div style="margin-top:10px">';
      lr.forEach(function(x) {
        h += '<div style="background:#0f172a;border-radius:8px;padding:10px;margin-bottom:6px;border-left:3px solid #22c55e"><div class="name">' + esc(x.name) + '</div><div style="font-size:12px;color:#94a3b8;margin-top:2px">📞 ' + esc(x.phone) + '</div>' + (x.pickupLocation ? '<div class="pickup">📍 ' + esc(x.pickupLocation) + '</div>' : '') + '</div>';
      });
      h += '</div>';
    }
  }
  c.innerHTML = h;
}

async function startDriverBookingListeners() {
  const t = getToday();
  if (driverBookingListener) { try { driverBookingListener.off(); } catch (e) {} }
  if (driverLoopListener) { try { driverLoopListener.off(); } catch (e) {} }
  const sc = await DataLayer.getAllSeatConfigs(t);
  currentCachedBookings._sc = sc;
  const init = await DataLayer.getBookings(t);
  Object.keys(init).forEach(function(k) { currentCachedBookings[k] = init[k]; driverKnownBookingIds.add(k); });
  const loopInit = await DataLayer.getLoopQueue(t);
  Object.keys(loopInit).forEach(function(k) { currentCachedLoop[k] = loopInit[k]; driverKnownLoopIds.add(k); });
  driverFirstLoad = false;
  loopFirstLoad = false;
  renderDriverBookingContent();
  const r = db.ref('booking/' + t);
  driverBookingListener = r.on('value', function(snap) {
    const ab = snap.val() || {};
    currentPassengerTracking = {};
    Object.keys(ab).forEach(function(k) {
      const b = ab[k];
      if (b && b.passengerLocation) currentPassengerTracking[k] = b.passengerLocation;
    });
    if (!driverFirstLoad) {
      let np = 0;
      Object.keys(ab).forEach(function(k) {
        if (!driverKnownBookingIds.has(k)) {
          const b = ab[k];
          if (b && b.status === 'pending') np++;
        }
      });
      if (np > 0) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.frequency.value = 880;
          g.gain.value = 0.3;
          o.connect(g);
          g.connect(ctx.destination);
          o.start();
          o.stop(ctx.currentTime + 0.15);
          setTimeout(function() {
            const o2 = ctx.createOscillator(), g2 = ctx.createGain();
            o2.frequency.value = 1320;
            g2.gain.value = 0.3;
            o2.connect(g2);
            g2.connect(ctx.destination);
            o2.start();
            o2.stop(ctx.currentTime + 0.15);
          }, 200);
        } catch (e) {}
        if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        showToast('🔔 有 ' + np + ' 個新預約！', 4000);
      }
    }
    driverKnownBookingIds = new Set(Object.keys(ab));
    driverFirstLoad = false;
    const sc2 = currentCachedBookings._sc;
    currentCachedBookings = Object.assign({}, ab, { _sc: sc2 });
    renderDriverBookingContent();
  });
  const rl = db.ref('booking_loop/' + t);
  driverLoopListener = rl.on('value', function(snap) {
    const all = snap.val() || {};
    currentCachedLoop = all;
    renderDriverBookingContent();
  });
}

async function driverConfirm(date, id, plate) {
  try {
    const bs = await DataLayer.getBookings(date);
    const b = bs[id];
    if (!b) { showToast('預約唔存在'); return; }
    await DataLayer.updateBooking(date, id, { status: 'reserved', confirmedAt: nowMs(), confirmedBy: plate });
    if (plate) {
      await db.ref('van/active_buses/' + plate + '/passengerCount').transaction(function(c) { return (c || 0) + (b.seats || 1); });
    }
    showToast('✅ 已確認留位', 2000);
  } catch (e) { showToast('❌ ' + e.message); }
}

async function driverReject(date, id) {
  const reason = prompt('拒絕原因（可留空）：', '') || '';
  try {
    await DataLayer.updateBooking(date, id, { status: 'rejected', rejectedAt: nowMs(), rejectReason: reason });
    await DataLayer.clearPassengerLocation(date, id);
    showToast('❌ 已拒絕', 2000);
  } catch (e) { showToast('❌ ' + e.message); }
}

async function driverConfirmLoop(id) {
  try {
    const t = getToday();
    await DataLayer.updateLoopQueue(t, id, { status: 'reserved', confirmedAt: nowMs() });
    showToast('✅ 已確認留位', 2000);
  } catch (e) { showToast('❌ ' + e.message); }
}

async function driverRejectLoop(id) {
  if (!confirm('確定拒絕？')) return;
  try {
    const t = getToday();
    await DataLayer.removeLoopQueue(t, id);
    showToast('❌ 已拒絕', 2000);
  } catch (e) { showToast('❌ ' + e.message); }
}

function renderPassRouteStrip(bus, routeArr) {
  const strip = document.getElementById('pass-route-strip');
  if (!strip) return;
  strip.innerHTML = '';
  const current = bus.stationIndex || 0;
  routeArr.forEach(function(name, idx) {
    const node = document.createElement('div');
    node.className = 'dot-node';
    if (idx < current) node.classList.add('passed');
    else if (idx === current) node.classList.add('current');
    else if (idx === current + 1) node.classList.add('next');
    const dot = document.createElement('div');
    dot.className = 'dot';
    const span = document.createElement('span');
    span.textContent = name;
    node.appendChild(dot);
    node.appendChild(span);
    strip.appendChild(node);
  });
  const currentDot = strip.querySelector('.dot-node.current');
  if (currentDot) {
    setTimeout(function() {
      currentDot.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }, 100);
  }
}

        h += '</div>';
      }
      h += '</div>';
    });
  }
  c.innerHTML = h;
}

async function paxConfirmBooking(d, t) {
  const btn = document.getElementById('pax-confirm-btn');
  if (btn) { btn.disabled = true; btn.textContent = '處理中...'; }
  const name = document.getElementById('pax-book-name').value.trim();
  const seats = parseInt(document.getElementById('pax-book-seats').value);
  const pickup = document.getElementById('pax-book-pickup').value.trim();
  if (!name || !pickup) { showToast('請填寫姓名同上車地點'); if (btn) { btn.disabled = false; btn.textContent = '送出預約'; } return; }
  try {
    await ensureAuth();
    const cfg = await DataLayer.getSeatConfig(d, t);
    if (!cfg || !cfg.seats) throw new Error('此班次未開放');
    const quota = cfg.quota || cfg.seats;
    const sid = getSid(d, t);
    const tb = await DataLayer.getBookings(d);
    const used = Object.keys(tb).map(function(k) { return tb[k]; }).filter(function(b) { return b.scheduleId === sid && ['pending', 'reserved', 'arrived', 'boarded'].indexOf(b.status) >= 0; }).reduce(function(s, b) { return s + (b.seats || 0); }, 0);
    if (used + seats > quota) throw new Error('剩餘留位額不足');
    const today = getToday();
    const cc = await DataLayer.getCancelCount(currentUser.identifier, today);
    if (cc >= MAX_CANCEL_PER_DAY) throw new Error('今日取消次數已達上限');
    const b = { scheduleId: sid, date: d, time: t, passengerName: name, passengerPhone: currentUser.identifier, seats: seats, pickupLocation: pickup, status: 'pending', direction: getDir(t) };
    await DataLayer.addBooking(d, b);
    showToast('✅ 已送出，等待司機確認', 3000);
    renderPassengerBookingPanel();
  } catch (e) {
    showToast('❌ ' + e.message, 5000);
    if (btn) { btn.disabled = false; btn.textContent = '送出預約'; }
  }
}

async function paxLoopJoin() {
  try {
    await ensureAuth();
    const t = getToday();
    const all = await DataLayer.getLoopQueue(t);
    const ex = Object.keys(all).map(function(k) { return all[k]; }).find(function(x) { return x.phone === currentUser.identifier && (x.status === 'pending' || x.status === 'reserved'); });
    if (ex) { showToast('⚠️ 你已經留咗位'); return; }
    const pickup = document.getElementById('pax-loop-pickup') ? document.getElementById('pax-loop-pickup').value.trim() : '';
    if (!pickup) { showToast('請輸入上車地點'); return; }
    const pd = (await DataLayer.getPassenger(currentUser.identifier)) || {};
    if ((pd.creditScore || 100) < 50) { showToast('⚠️ 信用分不足'); return; }
    await DataLayer.addLoopQueue(t, { phone: currentUser.identifier, name: pd.name || currentUser.identifier, seats: 1, status: 'pending', date: t, pickupLocation: pickup });
    showToast('✅ 已送出，等待司機確認', 3000);
    renderPassengerBookingPanel();
  } catch (e) { showToast('❌ ' + e.message); }
}

async function paxLoopCancel() {
  if (!confirm('確定取消留位？')) return;
  try {
    const t = getToday();
    const all = await DataLayer.getLoopQueue(t);
    const my = Object.keys(all).map(function(k) { return all[k]; }).find(function(x) { return x.phone === currentUser.identifier && (x.status === 'pending' || x.status === 'reserved'); });
    if (my) {
      await DataLayer.removeLoopQueue(t, my.id);
      await DataLayer.incrCancelCount(currentUser.identifier, t);
    }
    showToast('已取消留位');
    renderPassengerBookingPanel();
  } catch (e) { showToast('取消失敗：' + e.message); }
}

async function paxLoopBoarded() {
  if (!confirm('確定你已上車？')) return;
  try {
    const t = getToday();
    const all = await DataLayer.getLoopQueue(t);
    const my = Object.keys(all).map(function(k) { return all[k]; }).find(function(x) { return x.phone === currentUser.identifier && x.status === 'reserved'; });

    await DataLayer.updateLoopQueue(t, my.id, { status: 'boarded', boardedAt: nowMs() });

async function paxBoarded(id, d) {
  if (!confirm('確定你已上車？')) return;
  try {
    await DataLayer.updateBooking(d, id, { status: 'boarded', boardedAt: nowMs() });
    await DataLayer.clearPassengerLocation(d, id);
    showToast('✅ 已上車');
    renderPassengerBookingPanel();
  } catch (e) { showToast('失敗：' + e.message); }
}

async function paxCancelBooking(id, d) {
  if (!confirm('確定取消預約？')) return;
  try {
    const b = (await DataLayer.getBookings(d))[id];
    await DataLayer.updateBooking(d, id, { status: 'cancelled', cancelledAt: nowMs() });
    if (b && b.status === 'reserved') {
      const cfg = await DataLayer.getSeatConfig(d, b.time);
      if (cfg && cfg.plate) {
        await db.ref('van/active_buses/' + cfg.plate + '/passengerCount').transaction(function(c) { return Math.max(0, (c || 0) - (b.seats || 1)); });
      }
      await DataLayer.clearPassengerLocation(d, id);
    }
    await DataLayer.incrCancelCount(currentUser.identifier, d);
    showToast('已取消預約');
    renderPassengerBookingPanel();
  } catch (e) { showToast('取消失敗：' + e.message); }
}

async function loadAdminPanel() {
  try {
    if (adminBusesRef) { try { adminBusesRef.off(); } catch (e) {} }
    adminBusesRef = db.ref('van/active_buses');
    adminBusesRef.on('value', function(snap) {
      const d = snap.val() || {};
      let cnt = 0, tot = 0;
      const nw = nowMs();
      Object.keys(d).forEach(function(p) {
        if (nw - (d[p].lastUpdate || 0) < CONFIG.ACTIVE_BUS_TIMEOUT) { cnt++; tot += d[p].passengerCount || 0; }
      });
      const ac = document.getElementById('admin-active-count');
      if (ac) ac.textContent = cnt;
      const pc = document.getElementById('admin-passenger-count');
      if (pc) pc.textContent = tot;
    });
    if (adminMsgRef) { try { adminMsgRef.off(); } catch (e) {} }
    adminMsgRef = db.ref('van/messages').orderByChild('timestamp').limitToLast(CONFIG.MESSAGE_LIMIT);
    adminMsgRef.on('value', function(snap) {
      const mc = document.getElementById('admin-msg-count');
      if (mc) mc.textContent = snap.numChildren();
    });
    const t = getToday();
    const bs = await DataLayer.getBookings(t);
    const lq = await DataLayer.getLoopQueue(t);
    const statsEl = document.getElementById('admin-booking-stats');
    if (statsEl) {
      const bookingsArr = Object.keys(bs).map(function(k) { return bs[k]; });
      const loopArr = Object.keys(lq).map(function(k) { return lq[k]; });
      statsEl.innerHTML = '📋 固定班次預約：' + bookingsArr.length + ' 筆<br>🔄 循環線留位：' + loopArr.length + ' 筆<br>⏳ 待確認：' + bookingsArr.filter(function(b) { return b.status === 'pending'; }).length + ' 筆<br>✅ 已確認：' + bookingsArr.filter(function(b) { return b.status === 'reserved'; }).length + ' 筆';
    }
    loadAdminAnnounce();
  } catch (e) { console.error('載入後台失敗:', e); }
}

function loadAdminAnnounce() {
  try {
    if (adminAnnounceRef) { try { adminAnnounceRef.off(); } catch (e) {} }
    adminAnnounceRef = db.ref('van/announcements').orderByChild('timestamp').limitToLast(20);
    adminAnnounceRef.on('value', function(snap) {
      const container = document.getElementById('admin-announce-list');
      if (!container) return;
      let html = '';
      snap.forEach(function(ch) {
        const a = ch.val();
        html += '<div class="card" style="padding:8px 10px;margin-bottom:6px;border-left:3px solid #fc0"><div style="font-size:12px;color:#888">' + new Date(a.timestamp).toLocaleString('zh-HK') + '</div><div style="font-size:14px">' + (a.audio ? '🎤 語音公告' : esc(a.text || '')) + '</div></div>';
      });
      container.innerHTML = html || '<div style="color:#888;padding:8px">暫無公告</div>';
    });
  } catch (e) {}
}

document.getElementById('login-google').addEventListener('click', function() {
  if (isLoggingIn) { showToast('⏳ 登入處理中'); return; }
  isLoggingIn = true;
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(async function(result) {
    const user = result.user;
    const email = user.email;
    const role = await checkRole(email, user.uid);
    if (role !== 'admin') { showToast('此 Google 帳戶不是管理員'); auth.signOut(); isLoggingIn = false; return; }
    currentUser.uid = user.uid;
    currentUser.identifier = email;
    currentUser.role = role;
    currentUser.loginTime = nowMs();
    isSuperAdmin = isSuperAdminEmail(email);
    isAdmin = true;
    await db.ref('users/' + user.uid).set({ identifier: email, email: email, role: role, lastLogin: nowMs() });
    if (isSuperAdminEmail(email)) {
      await db.ref('admins/' + user.uid).update({ super: true, identifier: email, email: email, lastLogin: nowMs() });
    }
    document.getElementById('login-modal').classList.remove('active');
    document.getElementById('btn-admin-panel').style.display = 'block';
    document.getElementById('btn-logout').style.display = 'block';
    loadAdminPanel();
    showToast('管理員登入成功，歡迎 ' + email + (isSuperAdmin ? ' (超級管理員)' : ''));
    if (voiceEnabled) speakCantonese(VOICE_TEXTS.welcomeAdmin);
    showView('view-lobby');
    isLoggingIn = false;
  }).catch(function(e) {
    isLoggingIn = false;
    if (e.code === 'auth/popup-closed-by-user') showToast('登入視窗已關閉');
    else showToast('登入失敗：' + e.message);

/* ---------- 自動清理過期資料 ---------- */
async function autoCleanExpiredBookings() {
  try {
    const t = getToday();
    const bs = await DataLayer.getBookings(t);
    const keys = Object.keys(bs);
    for (let i = 0; i < keys.length; i++) {
      const id = keys[i];
      const b = bs[id];
      if (!b) continue;
      if (b.status !== 'reserved' && b.status !== 'pending') continue;
      const st = getShiftTime(b.date, b.time);
      if (nowMs() > st + 5 * 60 * 1000) {
        if (b.status === 'pending') {
          await DataLayer.updateBooking(b.date, id, { status: 'cancelled', cancelledAt: nowMs(), autoCancelled: 'pending_timeout' });
        } else if (b.status === 'reserved') {
          await DataLayer.updateBooking(b.date, id, { status: 'no-show', noShowAt: nowMs() });
          const cfg = await DataLayer.getSeatConfig(b.date, b.time);
          if (cfg && cfg.plate) {
            await db.ref('van/active_buses/' + cfg.plate + '/passengerCount').transaction(function(c) { return Math.max(0, (c || 0) - (b.seats || 1)); });
          }
          await DataLayer.clearPassengerLocation(b.date, id);
        }
      }
    }
    const lq = await DataLayer.getLoopQueue(t);
    const lkeys = Object.keys(lq);
    for (let j = 0; j < lkeys.length; j++) {
      const id = lkeys[j];
      const x = lq[id];
      if (!x) continue;
      if (x.status === 'pending' && nowMs() - (x.createdAt || 0) > LOOP_TIMEOUT) {
        await DataLayer.updateLoopQueue(t, id, { status: 'expired', expiredAt: nowMs() });
      } else if (x.status === 'expired' && nowMs() - (x.expiredAt || 0) > 2 * 60 * 60 * 1000) {
        await DataLayer.removeLoopQueue(t, id);
      }
    }
  } catch (e) { console.warn('自動清理失敗:', e); }
}

setInterval(autoCleanExpiredBookings, 60 * 1000);
setTimeout(autoCleanExpiredBookings, 5000);
