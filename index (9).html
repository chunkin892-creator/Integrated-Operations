function calcDistance(a,b,c,d){const R=6371000,dLat=(c-a)*Math.PI/180,dLon=(d-b)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function playBoostedAudio(base64,boost){if(!base64)return;const actualBoost=boost||CONFIG.VOICE_MSG_BOOST;try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const bytes=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));ctx.decodeAudioData(bytes.buffer,buf=>{const src=ctx.createBufferSource();src.buffer=buf;const gain=ctx.createGain();gain.gain.value=actualBoost;src.connect(gain);gain.connect(ctx.destination);src.start(0);},()=>{const a=new Audio('data:audio/webm;base64,'+base64);a.volume=1.0;a.play().catch(()=>{});});}catch(e){const a=new Audio('data:audio/webm;base64,'+base64);a.volume=1.0;a.play().catch(()=>{});}}

function speakCantonese(text){if(!voiceEnabled||!window.speechSynthesis)return Promise.resolve();return new Promise(r=>{if(_speakQueue.length>3)_speakQueue.shift();_speakQueue.push({text,resolve:r});_processSpeakQueue();});}
function _processSpeakQueue(){if(_speakBusy||_speakQueue.length===0)return;_speakBusy=true;const it=_speakQueue.shift();const{text,resolve}=it;if(!voiceEnabled||!window.speechSynthesis){_speakBusy=false;resolve();setTimeout(_processSpeakQueue,0);return;}const u=new SpeechSynthesisUtterance(text);u.lang='zh-HK';u.volume=1;u.rate=0.9;const vs=window.speechSynthesis.getVoices();if(vs.length>0){const v=vs.find(x=>x.lang==='zh-HK')||vs.find(x=>x.lang.startsWith('zh'));if(v)u.voice=v;}let rs=false;const done=()=>{if(!rs){rs=true;resolve();_speakBusy=false;setTimeout(_processSpeakQueue,0);}};const t=setTimeout(done,6000);u.onend=()=>{clearTimeout(t);done();};u.onerror=()=>{clearTimeout(t);done();};window.speechSynthesis.speak(u);}

const RecorderManager={instances:{},create(id,onSend){if(this.instances[id])return this.instances[id];const self=this;let mediaRecorder=null,mediaStream=null,chunks=[],timer=null,seconds=0,isRecording=false;const inst={start(){if(isRecording)return;isRecording=true;navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{mediaStream=stream;const opts={audioBitsPerSecond:CONFIG.VOICE_BITRATE,mimeType:'audio/webm;codecs=opus'};try{mediaRecorder=new MediaRecorder(stream,opts);}catch(e){mediaRecorder=new MediaRecorder(stream,{audioBitsPerSecond:CONFIG.VOICE_BITRATE});}chunks=[];mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}};mediaRecorder.start();seconds=0;const st=document.getElementById(id+'-status');if(st)st.style.display='flex';const tm=document.getElementById(id+'-time');if(tm)tm.textContent='0';timer=setInterval(()=>{seconds++;if(tm)tm.textContent=seconds;if(seconds>=CONFIG.RECORD_MAX_SECONDS){inst.stop();}},1000);}).catch(()=>{showToast('❌ 無法開啟咪高峰');isRecording=false;});},stop(){if(!isRecording)return;isRecording=false;if(timer){clearInterval(timer);timer=null;}if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.onstop=()=>{const blob=new Blob(chunks,{type:'audio/webm'});const reader=new FileReader();reader.onload=()=>{const base64=reader.result.split(',')[1];if(onSend)onSend(base64);if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}};reader.readAsDataURL(blob);};mediaRecorder.stop();}const st=document.getElementById(id+'-status');if(st)st.style.display='none';},cancel(){if(!isRecording)return;isRecording=false;if(timer){clearInterval(timer);timer=null;}if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.onstop=()=>{if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}};mediaRecorder.stop();}const st=document.getElementById(id+'-status');if(st)st.style.display='none';showToast('❌ 錄音已取消');},isRecording(){return isRecording;}};this.instances[id]=inst;return inst;},get(id){return this.instances[id];}};
function setupRecordUI(id,onSend){const btn=document.getElementById('btn-'+id+'-record')||document.getElementById(id+'-record');const controls=document.getElementById(id+'-record-controls');if(!btn)return;const rec=RecorderManager.create(id,onSend);btn.addEventListener('click',()=>{if(rec.isRecording())return;rec.start();controls.style.display='flex';btn.style.display='none';});const stopBtn=controls?controls.querySelector('.rec-stop'):null;const cancelBtn=controls?controls.querySelector('.rec-cancel'):null;if(stopBtn)stopBtn.addEventListener('click',()=>{if(rec.isRecording())rec.stop();controls.style.display='none';btn.style.display='block';});if(cancelBtn)cancelBtn.addEventListener('click',()=>{if(rec.isRecording())rec.cancel();controls.style.display='none';btn.style.display='block';});}

function renderDriverBookingContent(){
  const c=document.getElementById('driver-booking-content');
  if(!c)return;
  const t=getToday();
  const bookings=currentCachedBookings;
  const seatsConfig=currentCachedBookings._sc||{};
  let h='';
  h+='<div style="display:flex;gap:8px;margin-bottom:10px;"><button class="btn btn-outline" style="padding:10px;font-size:14px;flex:1;" onclick="renderDriverBookingContent()">🔄 重新整理</button></div>';
  h+='<div style="font-size:16px;font-weight:700;color:#38bdf8;margin-bottom:8px;">📋 固定班次</div>';
  const allS=[...SM,...SE];
  allS.forEach(tm=>{
    const sid=getSid(t,tm);
    const cfg=seatsConfig[tm.replace(':','')];
    const quota=(cfg&&(cfg.quota||cfg.seats))||16;
    const dir=getDir(tm);
    const sb=Object.values(bookings).filter(b=>b&&b.scheduleId===sid&&b.status!=='cancelled');
    const used=sb.filter(b=>['pending','reserved','arrived','boarded'].includes(b.status)).reduce((s,b)=>s+(b.seats||0),0);
    const rem=quota-used;
    const full=rem<=0;
    const pl=sb.filter(b=>b.status==='pending');
    const cl=sb.filter(b=>b.status==='reserved');
    const al=sb.filter(b=>b.status==='arrived'||b.status==='boarded');
    if(pl.length===0&&cl.length===0&&al.length===0)return;
    h+='<div class="booking-card'+(full?' full':'')+'">';
    h+='<div class="time">'+esc(tm)+'</div>';
    h+='<div class="origin" style="color:'+(dir==='morning'?'#4ade80':'#fdba74')+';">'+esc(getOrigL(tm))+'</div>';
    h+='<div class="counts"><div><div style="font-size:13px;color:#fdba74;">⏳ '+pl.length+' 待確認</div><div style="font-size:13px;color:#4ade80;margin-top:2px;">🔴 '+al.length+' 已到 · ✅ '+cl.length+' 已確認</div></div><div style="text-align:right;"><div class="seat-num'+(rem<=0?' zero':rem<=2?' low':'')+'">'+rem+'</div><div class="seat-label">剩餘 / '+quota+'</div></div></div>';
    if(pl.length>0){
      h+='<div class="pending-box"><div class="pending-title">🔔 待確認（'+pl.length+'）</div>';
      pl.forEach(b=>{
        const bt=b.createdAt?new Date(b.createdAt).toLocaleString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false}):'';
        h+='<div class="pending-item"><div class="name">'+esc(b.passengerName)+(b.seats>1?' ×'+b.seats:'')+'</div><div class="info">📞 '+esc(b.passengerPhone)+'</div>'+(b.pickupLocation?'<div class="pickup">📍 '+esc(b.pickupLocation)+'</div>':'<div class="pickup" style="color:#f87171;">📍 未填</div>')+(bt?'<div class="booktime">⏰ '+bt+'</div>':'')+'<div class="actions"><button class="btn-confirm" onclick="driverConfirm(\''+b.date+'\',\''+b.id+'\',\''+esc(driverData.plate||'')+'\')">✅ 確認</button><button class="btn-reject" onclick="driverReject(\''+b.date+'\',\''+b.id+'\')">❌ 拒絕</button></div></div>';
      });
      h+='</div>';
    }
    if(cl.length>0||al.length>0){
      const all=[...al,...cl];
      h+='<div style="margin-top:10px;">';
      all.forEach(b=>{
        const tr=currentPassengerTracking[b.id];
        let gps='';
        if(tr&&tr.updatedAt&&(nowMs()-tr.updatedAt<120000)){
          gps=tr.arrived?'<div class="gps-line arrived">🟢 已到站（'+Math.round(tr.distance)+' 米）</div>':'<div class="gps-line waiting">🟡 前往中（'+Math.round(tr.distance)+' 米）</div>';
        }else if(b.arrivedAuto||b.arrivedAt){
          gps='<div class="gps-line arrived">🟢 已到站</div>';
        }else{
          gps='<div class="gps-line nogps">⚪ 等待 GPS...</div>';
        }
        h+='<div class="confirmed-item"><div class="name">'+esc(b.passengerName)+(b.seats>1?' ×'+b.seats:'')+'</div><div class="info">📞 '+esc(b.passengerPhone)+'</div>'+(b.pickupLocation?'<div class="pickup">📍 '+esc(b.pickupLocation)+'</div>':'')+gps+'</div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  h+='<div style="font-size:16px;font-weight:700;color:#7dd3fc;margin:14px 0 8px;">🔄 循環線留位（07:00 - 18:00）</div>';
  const loopQueue=currentCachedLoop;

  }else{

    }
    driverKnownBookingIds=new Set(Object.keys(ab));

async function initDriverPanel(){
  const savedPlate=getSavedPlate(currentUser.identifier);
  if(savedPlate&&!driverData.plate){driverData.plate=savedPlate;document.getElementById('driver-plate-input').value=savedPlate;}
  if(driverMsgRef){try{driverMsgRef.off();}catch(e){}driverMsgRef=null;}
  if(driverBusRef){try{driverBusRef.off();}catch(e){}driverBusRef=null;}
  if(driverData.plate){
    driverBusRef=db.ref('van/active_buses/'+driverData.plate);

function initBookingNotify(){if(_bnInitialized)return;_bnInitialized=true;const today=_bnToday();if(_bnRef){try{_bnRef.off();}catch(e){}}_bnRef=db.ref('booking/'+today);_bnRef.on('value',snap=>{const all=snap.val()||{};const nid=new Set(Object.keys(all));if(_bnFirstLoad){Object.keys(all).forEach(id=>{const b=all[id];if(b&&b.status==='pending')_bnPending[id]=b;});_bnKnownIds=nid;_bnFirstLoad=false;renderBookingNotify();return;}let hasNew=false;nid.forEach(id=>{if(!_bnKnownIds.has(id)){const b=all[id];if(b&&b.status==='pending'){_bnPending[id]=b;hasNew=true;}}});Object.keys(_bnPending).forEach(id=>{if(!all[id]||all[id].status!=='pending')delete _bnPending[id];});_bnKnownIds=nid;if(hasNew){playBookingBeep();if(navigator.vibrate)navigator.vibrate([300,100,300]);showToast('🔔 有新固定班次留位！');}renderBookingNotify();});if(_bnLoopRef){try{_bnLoopRef.off();}catch(e){}}_bnLoopRef=db.ref('booking_loop/'+today);_bnLoopRef.on('value',snap=>{const all=snap.val()||{};const nid=new Set(Object.keys(all));if(_bnLoopFirstLoad){Object.keys(all).forEach(id=>{const x=all[id];if(x&&x.status==='pending')_bnLoopPending[id]=x;});_bnLoopKnownIds=nid;_bnLoopFirstLoad=false;renderBookingNotify();return;}let hasNew=false;nid.forEach(id=>{if(!_bnLoopKnownIds.has(id)){const x=all[id];if(x&&x.status==='pending'){_bnLoopPending[id]=x;hasNew=true;}}});Object.keys(_bnLoopPending).forEach(id=>{if(!all[id]||all[id].status!=='pending')delete _bnLoopPending[id];});_bnLoopKnownIds=nid;if(hasNew){playBookingBeep();if(navigator.vibrate)navigator.vibrate([300,100,300]);showToast('🔄 有循環線乘客留位！');}renderBookingNotify();});}
function stopBookingNotify(){_bnInitialized=false;if(_bnRef){try{_bnRef.off();}catch(e){}_bnRef=null;}if(_bnLoopRef){try{_bnLoopRef.off();}catch(e){}_bnLoopRef=null;}_bnPending={};_bnLoopPending={};_bnFirstLoad=true;_bnLoopFirstLoad=true;const bar=document.getElementById('booking-notify-bar');if(bar)bar.classList.remove('show');}
function renderBookingNotify(){const bar=document.getElementById('booking-notify-bar');const list=document.getElementById('bn-list');const count=document.getElementById('bn-count');if(!bar||!list||!count)return;const fixedItems=Object.keys(_bnPending).map(id=>Object.assign({id,_type:'fixed'},_bnPending[id]));const loopItems=Object.keys(_bnLoopPending).map(id=>Object.assign({id,_type:'loop'},_bnLoopPending[id]));const all=fixedItems.concat(loopItems);if(all.length===0){bar.classList.remove('show');return;}bar.classList.add('show');count.textContent=all.length;let h='';all.forEach(item=>{const bt=item.createdAt?new Date(item.createdAt).toLocaleString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false}):'';if(item._type==='fixed'){const dl=item.direction==='morning'?'🌅 黃泥墩開出':'🌆 元朗站開出';h+='<div class="bn-item"><div class="bn-name">🚐 '+esc(item.passengerName||'乘客')+(item.seats>1?' ×'+item.seats:'')+'</div><div class="bn-detail">📞 '+esc(item.passengerPhone||'')+' · 🕐 '+esc(item.time||'')+'</div><div class="bn-detail">📍 上車地點：<strong style="color:#4ade80;">'+esc(item.pickupLocation||'未填')+'</strong></div><div class="bn-detail">'+dl+(bt?' · ⏰ '+bt:'')+'</div><div class="bn-actions"><button class="bn-confirm" onclick="bnConfirmFixed(\''+item.id+'\')">✅ 確認</button><button class="bn-reject" onclick="bnRejectFixed(\''+item.id+'\')">❌ 拒絕</button></div></div>';}else{h+='<div class="bn-item"><div class="bn-name">🔄 '+esc(item.name||'乘客')+(item.seats>1?' ×'+item.seats:'')+'</div><div class="bn-detail">📞 '+esc(item.phone||'')+' · 循環線</div><div class="bn-detail">📍 上車地點：<strong style="color:#4ade80;">'+esc(item.pickupLocation||'未填')+'</strong></div>'+(bt?'<div class="bn-detail">⏰ 留位時間 '+bt+'</div>':'')+'<div class="bn-actions"><button class="bn-confirm" onclick="bnConfirmLoop(\''+item.id+'\')">✅ 確認</button><button class="bn-reject" onclick="bnRejectLoop(\''+item.id+'\')">❌ 拒絕</button></div></div>';}});list.innerHTML=h;}
async function bnConfirmFixed(id){try{const today=_bnToday();const b=_bnPending[id];if(!b)return;const plate=driverData.plate||'';await db.ref('booking/'+today+'/'+id).update({status:'reserved',confirmedAt:nowMs(),confirmedBy:plate||'driver'});if(plate){await db.ref('van/active_buses/'+plate+'/passengerCount').transaction(c=>(c||0)+(b.seats||1));}delete _bnPending[id];renderBookingNotify();showToast('✅ 已確認留位');}catch(e){showToast('❌ '+e.message);}}
async function bnRejectFixed(id){const reason=prompt('拒絕原因（可留空）：','')||'';try{const today=_bnToday();await db.ref('booking/'+today+'/'+id).update({status:'rejected',rejectedAt:nowMs(),rejectReason:reason});delete _bnPending[id];renderBookingNotify();showToast('❌ 已拒絕');}catch(e){showToast('❌ '+e.message);}}
async function bnConfirmLoop(id){try{const today=_bnToday();await db.ref('booking_loop/'+today+'/'+id).update({status:'reserved',confirmedAt:nowMs()});delete _bnLoopPending[id];renderBookingNotify();showToast('✅ 已確認循環線留位');}catch(e){showToast('❌ '+e.message);}}
async function bnRejectLoop(id){if(!confirm('確定拒絕？'))return;try{const today=_bnToday();await db.ref('booking_loop/'+today+'/'+id).remove();delete _bnLoopPending[id];renderBookingNotify();showToast('❌ 已拒絕');}catch(e){showToast('❌ '+e.message);}}
function hideBookingNotify(){const bar=document.getElementById('booking-notify-bar');if(bar)bar.classList.remove('show');setTimeout(()=>{const total=Object.keys(_bnPending).length+Object.keys(_bnLoopPending).length;if(total>0)renderBookingNotify();},5000);}
function playBookingBeep(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=880;g.gain.value=0.35;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.15);setTimeout(()=>{const o2=ctx.createOscillator(),g2=ctx.createGain();o2.type='sine';o2.frequency.value=1320;g2.gain.value=0.35;o2.connect(g2);g2.connect(ctx.destination);o2.start();o2.stop(ctx.currentTime+0.15);},200);}catch(e){}}
window.bnConfirmFixed=bnConfirmFixed;window.bnRejectFixed=bnRejectFixed;window.bnConfirmLoop=bnConfirmLoop;window.bnRejectLoop=bnRejectLoop;window.hideBookingNotify=hideBookingNotify;

function renderDriverBookingContent(){
  const c=document.getElementById('driver-booking-content');
  if(!c)return;
  const t=getToday();
  const bookings=currentCachedBookings;
  const seatsConfig=currentCachedBookings._sc||{};
  let h='';
  h+='<div style="display:flex;gap:8px;margin-bottom:10px;"><button class="btn btn-outline" style="padding:10px;font-size:14px;flex:1;" onclick="renderDriverBookingContent()">🔄 重新整理</button></div>';
  h+='<div style="font-size:16px;font-weight:700;color:#38bdf8;margin-bottom:8px;">📋 固定班次</div>';
  const allS=[...SM,...SE];
  allS.forEach(tm=>{
    const sid=getSid(t,tm);
    const cfg=seatsConfig[tm.replace(':','')];
    const quota=(cfg&&(cfg.quota||cfg.seats))||16;
    const dir=getDir(tm);
    const sb=Object.values(bookings).filter(b=>b&&b.scheduleId===sid&&b.status!=='cancelled');
    const used=sb.filter(b=>['pending','reserved','arrived','boarded'].includes(b.status)).reduce((s,b)=>s+(b.seats||0),0);
    const rem=quota-used;
    const full=rem<=0;
    const pl=sb.filter(b=>b.status==='pending');
    const cl=sb.filter(b=>b.status==='reserved');
    const al=sb.filter(b=>b.status==='arrived'||b.status==='boarded');
    if(pl.length===0&&cl.length===0&&al.length===0)return;
    h+='<div class="booking-card'+(full?' full':'')+'">';
    h+='<div class="time">'+esc(tm)+'</div>';
    h+='<div class="origin" style="color:'+(dir==='morning'?'#4ade80':'#fdba74')+';">'+esc(getOrigL(tm))+'</div>';
    h+='<div class="counts"><div><div style="font-size:13px;color:#fdba74;">⏳ '+pl.length+' 待確認</div><div style="font-size:13px;color:#4ade80;margin-top:2px;">🔴 '+al.length+' 已到 · ✅ '+cl.length+' 已確認</div></div><div style="text-align:right;"><div class="seat-num'+(rem<=0?' zero':rem<=2?' low':'')+'">'+rem+'</div><div class="seat-label">剩餘 / '+quota+'</div></div></div>';
    if(pl.length>0){
      h+='<div class="pending-box"><div class="pending-title">🔔 待確認（'+pl.length+'）</div>';
      pl.forEach(b=>{
        const bt=b.createdAt?new Date(b.createdAt).toLocaleString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false}):'';
        h+='<div class="pending-item"><div class="name">'+esc(b.passengerName)+(b.seats>1?' ×'+b.seats:'')+'</div><div class="info">📞 '+esc(b.passengerPhone)+'</div>'+(b.pickupLocation?'<div class="pickup">📍 '+esc(b.pickupLocation)+'</div>':'<div class="pickup" style="color:#f87171;">📍 未填</div>')+(bt?'<div class="booktime">⏰ '+bt+'</div>':'')+'<div class="actions"><button class="btn-confirm" onclick="driverConfirm(\''+b.date+'\',\''+b.id+'\',\''+esc(driverData.plate||'')+'\')">✅ 確認</button><button class="btn-reject" onclick="driverReject(\''+b.date+'\',\''+b.id+'\')">❌ 拒絕</button></div></div>';
      });
      h+='</div>';
    }
    if(cl.length>0||al.length>0){
      const all=[...al,...cl];
      h+='<div style="margin-top:10px;">';
      all.forEach(b=>{
        const tr=currentPassengerTracking[b.id];
        let gps='';
        if(tr&&tr.updatedAt&&(nowMs()-tr.updatedAt<120000)){
          gps=tr.arrived?'<div class="gps-line arrived">🟢 已到站（'+Math.round(tr.distance)+' 米）</div>':'<div class="gps-line waiting">🟡 前往中（'+Math.round(tr.distance)+' 米）</div>';
        }else if(b.arrivedAuto||b.arrivedAt){
          gps='<div class="gps-line arrived">🟢 已到站</div>';
        }else{
          gps='<div class="gps-line nogps">⚪ 等待 GPS...</div>';
        }
        h+='<div class="confirmed-item"><div class="name">'+esc(b.passengerName)+(b.seats>1?' ×'+b.seats:'')+'</div><div class="info">📞 '+esc(b.passengerPhone)+'</div>'+(b.pickupLocation?'<div class="pickup">📍 '+esc(b.pickupLocation)+'</div>':'')+gps+'</div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  h+='<div style="font-size:16px;font-weight:700;color:#7dd3fc;margin:14px 0 8px;">🔄 循環線留位（07:00 - 18:00）</div>';
  const loopQueue=currentCachedLoop;
  const lp=Object.values(loopQueue).filter(x=>x&&x.status==='pending');
  const lr=Object.values(loopQueue).filter(x=>x&&x.status==='reserved');
  if(lp.length===0&&lr.length===0){
    h+='<div style="text-align:center;color:#64748b;padding:16px;font-size:14px;">暫無循環線留位</div>';
  }else{
    if(lp.length>0){
      h+='<div class="pending-box"><div class="pending-title">🔔 待確認（'+lp.length+'）</div>';
      lp.forEach(x=>{
        const bt=x.createdAt?new Date(x.createdAt).toLocaleString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false}):'';
        h+='<div class="pending-item"><div class="name">'+esc(x.name)+'</div><div class="info">📞 '+esc(x.phone)+'</div>'+(x.pickupLocation?'<div class="pickup">📍 '+esc(x.pickupLocation)+'</div>':'')+(bt?'<div class="booktime">⏰ '+bt+'</div>':'')+'<div class="actions"><button class="btn-confirm" onclick="driverConfirmLoop(\''+x.id+'\')">✅ 確認</button><button class="btn-reject" onclick="driverRejectLoop(\''+x.id+'\')">❌ 拒絕</button></div></div>';
      });
      h+='</div>';
    }
    if(lr.length>0){
      h+='<div style="margin-top:10px;">';
      lr.forEach(x=>{
        h+='<div class="confirmed-item"><div class="name">'+esc(x.name)+'</div><div class="info">📞 '+esc(x.phone)+'</div>'+(x.pickupLocation?'<div class="pickup">📍 '+esc(x.pickupLocation)+'</div>':'')+'</div>';
      });
      h+='</div>';
    }
  }
  c.innerHTML=h;
}
function switchDriverTab(t){
  driverActiveTab=t;
  document.getElementById('driver-tab-btn-booking').className='btn '+(t==='booking'?'btn-primary':'btn-outline');
  document.getElementById('driver-tab-btn-walkie').className='btn '+(t==='walkie'?'btn-primary':'btn-outline');
  document.getElementById('driver-tab-btn-msg').className='btn '+(t==='msg'?'btn-primary':'btn-outline');
  document.getElementById('driver-panel-booking').style.display=t==='booking'?'block':'none';
  document.getElementById('driver-panel-walkie').style.display=t==='walkie'?'block':'none';
  document.getElementById('driver-panel-msg').style.display=t==='msg'?'block':'none';
  if(t==='booking')startDriverBookingListeners();

async function startDriverBookingListeners(){
  const t=getToday();
  if(driverBookingListener){try{driverBookingListener.off();}catch(e){}}
  if(driverLoopListener){try{driverLoopListener.off();}catch(e){}}
  if(driverTrackingRef){try{driverTrackingRef.off();}catch(e){}}
  const sc=await DataLayer.getAllSeatConfigs(t);
  currentCachedBookings._sc=sc;
  const init=await DataLayer.getBookings(t);
  Object.keys(init).forEach(k=>{if(k!=='_sc'){currentCachedBookings[k]=init[k];driverKnownBookingIds.add(k);}});
  const loopInit=await DataLayer.getLoopQueue(t);
  Object.keys(loopInit).forEach(k=>{currentCachedLoop[k]=loopInit[k];driverKnownLoopIds.add(k);});
  driverFirstLoad=false;loopFirstLoad=false;
  renderDriverBookingContent();
  const r=db.ref('booking/'+t);
  driverBookingListener=r.on('value',snap=>{
    const ab=snap.val()||{};
    currentPassengerTracking={};
    Object.entries(ab).forEach(([id,b])=>{if(b&&b.passengerLocation)currentPassengerTracking[id]=b.passengerLocation;});
    if(!driverFirstLoad){
      let np=0;
      Object.keys(ab).forEach(k=>{if(!driverKnownBookingIds.has(k)){const b=ab[k];if(b&&b.status==='pending')np++;}});
      if(np>0){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=0.3;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.15);setTimeout(()=>{const o2=ctx.createOscillator(),g2=ctx.createGain();o2.frequency.value=1320;g2.gain.value=0.3;o2.connect(g2);g2.connect(ctx.destination);o2.start();o2.stop(ctx.currentTime+0.15);},200);}catch(e){}if(navigator.vibrate)navigator.vibrate([300,100,300]);showToast('🔔 有 '+np+' 個新預約！',4000);}
    }
    driverKnownBookingIds=new Set(Object.keys(ab));
    driverFirstLoad=false;
    const _sc=currentCachedBookings._sc;
    currentCachedBookings={...ab,_sc};
    renderDriverBookingContent();
  });
  const rl=db.ref('booking_loop/'+t);
  driverLoopListener=rl.on('value',snap=>{
    const all=snap.val()||{};
    currentCachedLoop=all;
    renderDriverBookingContent();
  });
}
async function driverConfirm(d,id,p){
  try{
    const bs=await DataLayer.getBookings(d);
    const b=bs[id];
    if(!b){showToast('預約唔存在');return;}
    await DataLayer.updateBooking(d,id,{status:'reserved',confirmedAt:nowMs(),confirmedBy:p});
    if(p){await db.ref('van/active_buses/'+p+'/passengerCount').transaction(c=>(c||0)+(b.seats||1));}
    showToast('✅ 已確認留位',2000);
  }catch(e){showToast('❌ '+e.message);}
}
async function driverReject(d,id){
  const r=prompt('拒絕原因（可留空）：','')||'';
  try{
    await DataLayer.updateBooking(d,id,{status:'rejected',rejectedAt:nowMs(),rejectReason:r});
    await DataLayer.clearPassengerLocation(d,id);
    showToast('❌ 已拒絕',2000);
  }catch(e){showToast('❌ '+e.message);}
}
async function driverConfirmLoop(id){
  try{
    const t=getToday();
    await DataLayer.updateLoopQueue(t,id,{status:'reserved',confirmedAt:nowMs()});
    showToast('✅ 已確認留位',2000);
  }catch(e){showToast('❌ '+e.message);}
}
async function driverRejectLoop(id){
  if(!confirm('確定拒絕？'))return;
  try{
    const t=getToday();
    await DataLayer.removeLoopQueue(t,id);
    showToast('❌ 已拒絕',2000);
  }catch(e){showToast('❌ '+e.message);}
}

function renderPaxShiftCard(d,t,ab,sc){

async function paxConfirmBooking(d,t){
  const btn=document.getElementById('pax-confirm-btn');
  if(btn){btn.disabled=true;btn.textContent='處理中...';}
  const name=document.getElementById('pax-book-name').value.trim();
  const seats=parseInt(document.getElementById('pax-book-seats').value);
  const pickup=document.getElementById('pax-book-pickup').value.trim();
  if(!name||!pickup){showToast('請填寫姓名同上車地點');if(btn){btn.disabled=false;btn.textContent='送出預約';}return;}
  try{
    await ensureAuth();
    const cfg=await DataLayer.getSeatConfig(d,t);
    if(!cfg||!cfg.seats)throw new Error('此班次未開放');
    const quota=cfg.quota||cfg.seats;
    const sid=getSid(d,t);
    const tb=await DataLayer.getBookings(d);
    const used=Object.values(tb).filter(b=>b.scheduleId===sid&&['pending','reserved','arrived','boarded'].includes(b.status)).reduce((s,b)=>s+(b.seats||0),0);
    if(used+seats>quota)throw new Error('剩餘留位額不足');
    const b={scheduleId:sid,date:d,time:t,passengerName:name,passengerPhone:currentUser.identifier,seats,pickupLocation:pickup,status:'pending',direction:getDir(t)};
    await DataLayer.addBooking(d,b);
    showToast('✅ 已送出，等待司機確認',3000);
    renderPassengerBookingPanel();
  }catch(e){showToast('❌ '+e.message,5000);if(btn){btn.disabled=false;btn.textContent='送出預約';}}
}
async function paxLoopJoin(){
  try{
    await ensureAuth();
    const t=getToday();
    const all=await DataLayer.getLoopQueue(t);
    const ex=Object.values(all).find(x=>x.phone===currentUser.identifier&&(x.status==='pending'||x.status==='reserved'));
    if(ex){showToast('⚠️ 你已經留咗位');return;}
    const pickup=document.getElementById('pax-loop-pickup')?.value.trim();
    if(!pickup){showToast('請輸入上車地點');return;}
    const pd=await DataLayer.getPassenger(currentUser.identifier)||{};
    if((pd.creditScore||100)<50){showToast('⚠️ 信用分不足');return;}
    await DataLayer.addLoopQueue(t,{phone:currentUser.identifier,name:pd.name||currentUser.identifier,seats:1,status:'pending',date:t,pickupLocation:pickup});
    showToast('✅ 已送出，等待司機確認',3000);
    renderPassengerBookingPanel();
  }catch(e){showToast('❌ '+e.message);}
}
async function paxLoopCancel(){

    const t=getToday();
    const all=await DataLayer.getLoopQueue(t);
    const my=Object.values(all).find(x=>x.phone===currentUser.identifier&&(x.status==='pending'||x.status==='reserved'));

  try{

    await DataLayer.clearPassengerLocation(d,id);

    renderPassengerBookingPanel();

async function paxCancelBooking(id,d){
  if(!confirm('確定取消預約？'))return;
  try{
    const b=(await DataLayer.getBookings(d))[id];
    await DataLayer.updateBooking(d,id,{status:'cancelled',cancelledAt:nowMs()});
    if(b&&b.status==='reserved'){
      const cfg=await DataLayer.getSeatConfig(d,b.time);
      if(cfg&&cfg.plate){await db.ref('van/active_buses/'+cfg.plate+'/passengerCount').transaction(c=>Math.max(0,(c||0)-(b.seats||1)));}
      await DataLayer.clearPassengerLocation(d,id);
    }
    await DataLayer.incrCancelCount(currentUser.identifier,d);
    showToast('已取消預約');
    renderPassengerBookingPanel();
  }catch(e){showToast('取消失敗：'+e.message);}
}

document.getElementById('login-google').addEventListener('click',function(){if(isLoggingIn){showToast('⏳ 登入處理中');return;}isLoggingIn=true;const p=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(p).then(async r=>{const u=r.user,em=u.email;const role=await checkRole(em,u.uid);if(role!=='admin'){showToast('此 Google 帳戶不是管理員');auth.signOut();isLoggingIn=false;return;}currentUser.uid=u.uid;currentUser.identifier=em;currentUser.role=role;currentUser.loginTime=nowMs();isSuperAdmin=isSuperAdminEmail(em);isAdmin=true;await db.ref('users/'+u.uid).set({identifier:em,email:em,role,lastLogin:nowMs()});if(isSuperAdminEmail(em)){await db.ref('admins/'+u.uid).update({super:true,identifier:em,email:em,lastLogin:nowMs()});}try{const parser=new UAParser();const ua=parser.getResult();db.ref('login_logs').push({uid:u.uid,identifier:em,role,ip:'未能獲取',device:ua.device.model||ua.device.type||'未知',os:ua.os.name||'未知',browser:ua.browser.name||'未知',loginTime:nowMs()});}catch(e){}document.getElementById('login-modal').classList.remove('active');document.getElementById('btn-admin-panel').style.display='block';loadAdminPanel();initAdminWalkie();applyAdminPermissions();showToast('管理員登入成功，歡迎 '+em+(isSuperAdmin?' (超級管理員)':''));if(voiceEnabled)speakCantonese(VOICE_TEXTS.welcomeAdmin);showView('view-lobby');isLoggingIn=false;}).catch(e=>{isLoggingIn=false;if(e.code==='auth/popup-closed-by-user')showToast('登入視窗已關閉');else showToast('登入失敗：'+e.message);});});

document.getElementById('passenger-login-btn').addEventListener('click',async function(){const ph=document.getElementById('passenger-phone').value.trim();const nm=document.getElementById('passenger-name').value.trim();const er=document.getElementById('passenger-login-error');if(!ph||!/^\d{8,}$/.test(ph)){er.textContent='請輸入 8 位數字電話號碼';return;}if(!nm||nm.length>20){er.textContent='請輸入姓名（20字內）';return;}try{await auth.signInAnonymously();const _uid2=auth.currentUser.uid;const role=await checkRole(ph,_uid2);currentUser.uid=_uid2;currentUser.identifier=ph;currentUser.role=role;currentUser.loginTime=nowMs();await db.ref('users/'+currentUser.uid).set({identifier:ph,role,lastLogin:nowMs()});const ex=await DataLayer.getPassenger(ph)||{};if(ex.suspendedUntil&&ex.suspendedUntil>nowMs()){const r=Math.ceil((ex.suspendedUntil-nowMs())/(24*60*60*1000));er.textContent='預約資格暫停中，剩餘 '+r+' 日';return;}await DataLayer.savePassenger(ph,{name:nm,phone:ph,creditScore:ex.creditScore!=null?ex.creditScore:100,totalBookings:ex.totalBookings||0,totalNoShows:ex.totalNoShows||0,streakCount:ex.streakCount||0,lastLogin:nowMs()});document.getElementById('login-modal').classList.remove('active');if(role==='admin'){isAdmin=true;isSuperAdmin=isSuperAdminEmail(ph);document.getElementById('btn-admin-panel').style.display='block';loadAdminPanel();initAdminWalkie();applyAdminPermissions();}else{document.getElementById('btn-admin-panel').style.display='none';}showToast('乘客登入成功，歡迎 '+nm);if(voiceEnabled)speakCantonese(VOICE_TEXTS.welcomePassenger);showView('view-lobby');}catch(e){er.textContent='登入失敗：'+e.message;}});

/* 管理員後台（保留原版） */
function applyAdminPermissions(){const badge=document.getElementById('admin-role-badge');if(badge){if(isAdmin){badge.style.display=isSuperAdmin?'none':'inline-block';badge.textContent=isSuperAdmin?'':'👁️ 普通管理員';}else{badge.style.display='none';}}const tab=document.getElementById('tab-manage-admins');if(tab)tab.style.display=isSuperAdmin?'block':'none';const sec=document.getElementById('admin-section-manage-admins');if(sec)sec.style.display=isSuperAdmin?'block':'none';if(isSuperAdmin)loadAdminList();}
function loadAdminPanel(){try{if(adminBusesRef){try{adminBusesRef.off();}catch(e){}}adminBusesRef=db.ref('van/active_buses');adminBusesRef.on('value',snap=>{const d=snap.val()||{};let cnt=0,tot=0,nw=nowMs();for(const p in d){if(nw-d[p].lastUpdate<CONFIG.ACTIVE_BUS_TIMEOUT){cnt++;tot+=d[p].passengerCount||0;}}const ac=document.getElementById('admin-active-count');if(ac)ac.textContent=cnt;const pc=document.getElementById('admin-passenger-count');if(pc)pc.textContent=tot;updateOnlineLists(d);});if(adminMsgRef){try{adminMsgRef.off();}catch(e){}}adminMsgRef=db.ref('van/messages').orderByChild('timestamp').limitToLast(CONFIG.MESSAGE_LIMIT);adminMsgRef.on('value',snap=>{const c=document.getElementById('admin-msg-list');if(!c)return;c.innerHTML='';snap.forEach(ch=>{const m=ch.val();const div=document.createElement('div');div.className='admin-item';div.innerHTML='<div class="info">'+new Date(m.timestamp).toLocaleTimeString('zh-HK')+' | '+(m.senderIdentifier||'未知')+'</div><div style="font-size:15px;">'+(m.audio?'🎤 語音':esc(m.text||''))+'</div>';c.appendChild(div);});});loadDeviceList();loadBans();loadAdminAnnounce();}catch(e){console.error(e);}}
function updateOnlineLists(busesData){try{const isSuper=isSuperAdmin;const dc=document.getElementById('admin-online-drivers-ban');if(dc){let html='',found=false;for(const plate in busesData){const bus=busesData[plate];if(nowMs()-bus.lastUpdate<CONFIG.ACTIVE_BUS_TIMEOUT&&bus.driverIdentifier){found=true;const dId=bus.driverUid||bus.driverIdentifier||plate;const isTS=isSuperAdminEmail(dId);html+='<div class="admin-online-item"><div><span class="name">🚐 '+plate+'</span> <span class="info">'+(bus.driverIdentifier||'')+'</span></div>'+(isSuper?'<button class="action-btn ban" data-uid="'+dId+'" data-type="driver">封鎖</button>':(isTS?'<span style="color:#888;font-size:13px;">⭐ 超管</span>':'<button class="action-btn ban" data-uid="'+dId+'" data-type="driver">封鎖</button>'))+'</div>';}}if(!found)html='<div style="color:#888;text-align:center;padding:12px;font-size:14px;">沒有在線司機</div>';dc.innerHTML=html;dc.querySelectorAll('.action-btn.ban').forEach(btn=>{btn.addEventListener('click',function(){const uid=this.dataset.uid;if(!checkTargetNotSuperAdmin(uid))return;if(confirm('確定封鎖 '+uid+'？')){db.ref('bans/'+uid).set({identifier:uid,bannedAt:nowMs(),type:this.dataset.type}).then(()=>showToast('已封鎖 '+uid));}});});}const vc=document.getElementById('admin-online-vehicles-kick');if(vc){let html='',found=false;for(const plate in busesData){const bus=busesData[plate];if(nowMs()-bus.lastUpdate<CONFIG.ACTIVE_BUS_TIMEOUT){found=true;const dId=bus.driverUid||bus.driverIdentifier||plate;const isTS=isSuperAdminEmail(dId);html+='<div class="admin-online-item"><div><span class="name">🚐 '+plate+'</span> <span class="info">👥 '+(bus.passengerCount||0)+'人</span></div>'+(isSuper?'<button class="action-btn kick" data-plate="'+plate+'" data-uid="'+dId+'">踢出</button>':(isTS?'<span style="color:#888;font-size:13px;">⭐ 超管</span>':'<button class="action-btn kick" data-plate="'+plate+'" data-uid="'+dId+'">踢出</button>'))+'</div>';}}if(!found)html='<div style="color:#888;text-align:center;padding:12px;font-size:14px;">沒有在線車輛</div>';vc.innerHTML=html;vc.querySelectorAll('.action-btn.kick').forEach(btn=>{btn.addEventListener('click',function(){const plate=this.dataset.plate;const uid=this.dataset.uid;if(!checkTargetNotSuperAdmin(uid))return;if(confirm('確定踢走 '+plate+'？')){db.ref('van/active_buses/'+plate).remove().then(()=>showToast('已踢走 '+plate));}});});}}catch(e){}}
function loadDeviceList(){try{if(deviceLogsRef){try{deviceLogsRef.off();}catch(e){}}const container=document.getElementById('admin-device-list');if(!container)return;deviceLogsRef=db.ref('login_logs').orderByChild('loginTime').limitToLast(100);deviceLogsRef.on('value',snap=>{const data=snap.val()||{};let html='';const arr=[];for(const key in data){arr.push(data[key]);}arr.sort((a,b)=>(b.loginTime||0)-(a.loginTime||0));arr.slice(0,20).forEach(item=>{html+='<div class="admin-item" style="padding:10px;"><div class="title">📱 '+(item.device||'未知')+'</div><div class="info">識別: '+(item.identifier||'未知')+'<br>角色: '+(item.role||'未知')+'<br>時間: '+(item.loginTime?new Date(item.loginTime).toLocaleString('zh-HK'):'未知')+'</div></div>';});container.innerHTML=html||'<div style="color:#888;text-align:center;padding:12px;">暫無記錄</div>';});}catch(e){}}
function loadBans(){try{if(bansRef){try{bansRef.off();}catch(e){}}bansRef=db.ref('bans');bansRef.on('value',snap=>{const data=snap.val()||{};let html='<div style="margin-top:8px;"><span style="font-size:14px;color:#888;">已封鎖：</span>';for(const uid in data){html+='<span class="badge badge-red" style="font-size:15px;padding:6px 14px;margin:3px;">'+(data[uid].identifier||uid)+' <span onclick="if(confirm(\'解除？\')){db.ref(\'bans/'+uid+'\').remove().then(()=>showToast(\'已解除\'))}" style="cursor:pointer;">✕</span></span>';}html+='</div>';const el=document.getElementById('admin-banned-phones');if(el)el.innerHTML=html;});}catch(e){}}
function loadAdminAnnounce(){try{if(adminAnnounceRef){try{adminAnnounceRef.off();}catch(e){}}adminAnnounceRef=db.ref('van/announcements').orderByChild('timestamp').limitToLast(20);adminAnnounceRef.on('value',snap=>{const container=document.getElementById('admin-announce-list');if(!container)return;let html='';snap.forEach(ch=>{const a=ch.val();html+='<div class="admin-item" style="padding:8px 10px;"><div class="info">'+new Date(a.timestamp).toLocaleString('zh-HK')+'</div><div style="font-size:15px;">'+(a.audio?'🎤 語音':esc(a.text||''))+'</div></div>';});container.innerHTML=html||'<div style="color:#888;padding:8px;">暫無公告</div>';});}catch(e){}}
function initAdminWalkie(){if(!isAdmin)return;try{if(adminWalkieRef){try{adminWalkieRef.off();}catch(e){}}adminWalkieRef=db.ref('van/walkie_talkie').orderByChild('timestamp').limitToLast(50);adminWalkieRef.on('value',snap=>{const container=document.getElementById('admin-walkie-messages');if(!container)return;let html='';snap.forEach(ch=>{const m=ch.val();html+='<div style="padding:4px 0;border-bottom:1px solid #333;font-size:14px;">['+new Date(m.timestamp).toLocaleTimeString('zh-HK')+'] <strong>'+(m.senderPlate||'未知')+'</strong>: '+(m.audio?'[語音]':esc(m.text||''))+'</div>';});container.innerHTML=html||'<div style="color:#888;text-align:center;padding:12px;">暫無對講機訊息</div>';});}catch(e){}}
function loadAdminList(){if(!isSuperAdmin)return;const container=document.getElementById('admin-list-container');if(!container)return;db.ref('admins').once('value',snap=>{const data=snap.val()||{};let html='';for(const key in data){const a=data[key];const email=a.identifier||a.email||'未知';const isSuper=isSuperAdminEmail(email);html+='<div class="admin-item" style="padding:8px 10px;display:flex;justify-content:space-between;align-items:center;"><span>'+email+' '+(isSuper?'⭐ 超管':'👤 普通')+'</span>'+(!isSuper?'<button class="btn btn-red" style="width:auto;padding:4px 12px;font-size:14px;" onclick="removeAdmin(\''+key+'\',\''+email+'\')">移除</button>':'')+'</div>';}container.innerHTML=html||'<div style="color:#888;">暫無管理員</div>';});}
window.removeAdmin=function(key,email){if(!isSuperAdmin)return;if(!confirm('確定移除 '+email+'？'))return;db.ref('admins/'+key).remove().then(()=>{showToast('已移除');loadAdminList();});};
/* Admin tab 切換 */
document.querySelectorAll('.admin-tab').forEach(t=>{t.addEventListener('click',function(){document.querySelectorAll('.admin-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.admin-section').forEach(s=>s.classList.remove('active'));this.classList.add('active');const sec=document.getElementById('admin-section-'+this.dataset.tab);if(sec)sec.classList.add('active');if(this.dataset.tab==='devices')loadDeviceList();if(this.dataset.tab==='walkie'){initAdminWalkie();updateAdminWalkieTargets();}if(this.dataset.tab==='manage-admins')loadAdminList();});});
function updateAdminWalkieTargets(){const s=document.getElementById('admin-walkie-target');if(!s)return;db.ref('van/active_buses').once('value',snap=>{const d=snap.val()||{};let h='<option value="all">📢 全部</option>';for(const p in d){if(nowMs()-d[p].lastUpdate<CONFIG.ACTIVE_BUS_TIMEOUT)h+='<option value="'+esc(p)+'">🚐 '+esc(p)+'</option>';}s.innerHTML=h;});}
/* Admin 錄音按鈕 */
setupRecordUI('admin-walkie',base64=>{const target=document.getElementById('admin-walkie-target')?.value||'all';db.ref('van/walkie_talkie').push({senderUid:currentUser.uid,senderIdentifier:currentUser.identifier+' (👑管理員)',senderPlate:'👑 管理員',target,audio:base64,timestamp:nowMs(),type:'walkie_audio'}).then(()=>showToast('✅ 已發送'));});
setupRecordUI('admin-announce',base64=>{db.ref('van/announcements').push({audio:base64,publisher:currentUser.identifier,timestamp:nowMs()}).then(()=>showToast('✅ 語音公告已發佈'));});
setupRecordUI('admin-broadcast',base64=>{const target=document.getElementById('admin-broadcast-target')?.value.trim().toUpperCase()||'';db.ref('van/messages').push({busId:target||'廣播',senderUid:currentUser.uid,senderIdentifier:currentUser.identifier+' (👑廣播)',audio:base64,timestamp:nowMs(),type:'broadcast_audio'}).then(()=>{document.getElementById('admin-broadcast-status').textContent='✅ 語音廣播已發送';showToast('語音廣播已發送');});});
/* Admin 其他按鈕 */
safeClick(document.getElementById('btn-clear-all-msgs'),function(){if(!isAdmin){showToast('⛔ 權限不足');return;}if(!confirm('⚠️ 永久刪除所有訊息？'))return;db.ref('van/messages').remove().then(()=>showToast('✅ 已清除'));});
safeClick(document.getElementById('btn-restore-all-msgs'),function(){if(!confirm('確定還原？'))return;db.ref('van/messages').once('value',snap=>{const updates={};snap.forEach(child=>{if(child.val().hidden)updates[child.key+'/hidden']=false;});db.ref('van/messages').update(updates).then(()=>showToast('已還原'));});});
safeClick(document.getElementById('btn-publish-announce'),function(){const input=document.getElementById('admin-announce-text');const text=input?.value.trim();if(!text){showToast('請輸入公告');return;}db.ref('van/announcements').push({text,publisher:currentUser.identifier,timestamp:nowMs()}).then(()=>{input.value='';showToast('✅ 公告已發佈');});});
safeClick(document.getElementById('btn-clear-announce'),function(){if(!requireSuperAdmin())return;if(!confirm('確定清除所有公告？'))return;db.ref('van/announcements').remove().then(()=>showToast('已清除所有公告'));});
safeClick(document.getElementById('btn-broadcast-target-all'),function(){document.getElementById('admin-broadcast-target').value='';showToast('已設定為全部車輛');});
safeClick(document.getElementById('btn-admin-broadcast-send'),function(){const target=document.getElementById('admin-broadcast-target')?.value.trim().toUpperCase()||'';const input=document.getElementById('admin-broadcast-input');const text=input?.value.trim();if(!text){showToast('請輸入訊息');return;}db.ref('van/messages').push({busId:target||'廣播',senderUid:currentUser.uid,senderIdentifier:currentUser.identifier+' (👑廣播)',text,timestamp:nowMs(),type:'broadcast'}).then(()=>{input.value='';showToast('廣播已發送');});});
safeClick(document.getElementById('btn-add-driver'),function(){const input=document.getElementById('admin-add-driver-identifier');const id=input?.value.trim();if(!id){showToast('請輸入');return;}db.ref('drivers').push({identifier:id,addedBy:currentUser.identifier,createdAt:nowMs()}).then(()=>{input.value='';showToast('✅ 已新增');});});
safeClick(document.getElementById('btn-add-admin'),function(){if(!requireSuperAdmin())return;const input=document.getElementById('admin-add-admin-email');const email=input?.value.trim();if(!email||!email.includes('@')){showToast('請輸入有效電郵');return;}db.ref('admins').push({identifier:email,email,addedBy:currentUser.identifier,createdAt:nowMs()}).then(()=>{input.value='';showToast('✅ 已新增管理員');loadAdminList();});});
safeClick(document.getElementById('admin-walkie-refresh'),updateAdminWalkieTargets);
/* 全站其他 */
document.getElementById('fps-code').addEventListener('click',function(){const text='122891914';if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>showToast('✅ 已複製：'+text));}else{showToast('✅ 轉數快：'+text);}});
document.getElementById('global-voice-btn').addEventListener('click',function(){voiceEnabled=!voiceEnabled;this.textContent=voiceEnabled?'🔊':'🔇';this.classList.toggle('muted');showToast(voiceEnabled?'語音已開啟':'語音已關閉');localStorage.setItem('globalVoice',voiceEnabled?'on':'off');if(!voiceEnabled&&window.speechSynthesis)window.speechSynthesis.cancel();});
if(localStorage.getItem('globalVoice')==='off'){voiceEnabled=false;document.getElementById('global-voice-btn').textContent='🔇';document.getElementById('global-voice-btn').classList.add('muted');}
document.getElementById('notif-close').addEventListener('click',function(){document.getElementById('msg-notification').classList.remove('show');if(notificationTimer){clearTimeout(notificationTimer);notificationTimer=null;}});
document.getElementById('close-announce-overlay').addEventListener('click',function(){document.getElementById('announce-overlay').classList.remove('show');});
document.getElementById('announce-modal-close').addEventListener('click',function(){document.getElementById('announce-modal').classList.remove('active');});
safeClick(document.getElementById('floating-announce-btn'),function(){document.getElementById('announce-overlay').classList.add('show');loadAnnounceList();});
safeClick(document.getElementById('announce-bell'),function(){document.getElementById('announce-modal').classList.add('active');});
function loadAnnounceList(){const container=document.getElementById('announce-list-content');if(!container)return;db.ref('van/announcements').orderByChild('timestamp').limitToLast(20).once('value',snap=>{container.innerHTML='';snap.forEach(child=>{const a=child.val();const div=document.createElement('div');div.className='announce-item';div.innerHTML='<div class="time">'+new Date(a.timestamp).toLocaleString('zh-HK')+'</div><div class="text">'+(a.audio?'🎤 語音公告':esc(a.text||''))+'</div>';container.appendChild(div);});if(container.children.length===0)container.innerHTML='<div style="text-align:center;color:#888;padding:20px;">暫無公告</div>';});}
/* 連線狀態 */
db.ref('.info/connected').on('value',snap=>{const s=document.getElementById('connection-status');if(!s)return;if(snap.val()){s.textContent='🟢 已連線';s.className='connection-status online';setTimeout(()=>{s.style.display='none';},2500);}else{s.textContent='🔴 網絡中斷';s.className='connection-status offline';s.style.display='block';}});
/* Auth 監聽 */
auth.onAuthStateChanged(function(user){if(user){db.ref('users/'+user.uid).once('value').then(snap=>{const data=snap.val();if(!data)return;currentUser.uid=user.uid;currentUser.identifier=data.identifier||'';currentUser.role=data.role||'passenger';if(currentUser.role==='admin'){isAdmin=true;isSuperAdmin=isSuperAdminEmail(currentUser.identifier);document.getElementById('btn-admin-panel').style.display='block';loadAdminPanel();initAdminWalkie();applyAdminPermissions();}else{isAdmin=false;isSuperAdmin=false;}document.getElementById('login-modal').classList.remove('active');if(currentUser.role==='driver'||currentUser.role==='admin'){initBookingNotify();}});}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&driverData.isActive){if(!gpsWatchId||gpsRestartNeeded){gpsRestartNeeded=false;if(gpsWatchId){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}startGpsWatch();}}});
console.log('✅ 西鐵小巴系統 v3.8 已就緒');
</script>
</body>
</html>
