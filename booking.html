<script>
const firebaseConfig = {
  apiKey: "AIzaSyAX7Zy5br1ozGOGxHvDeFNY-Ldcjjw8Qgc",
  authDomain: "triple-login-version.firebaseapp.com",
  databaseURL: "https://triple-login-version-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "triple-login-version",

  messagingSenderId: "66459706459",
  appId: "1:66459706459:web:28f99a455652f393da0b7e"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const GPS_WONG = { lat: 22.416313, lng: 114.022155 };
const GPS_YUEN = { lat: 22.445758, lng: 114.037078 };
const SM = ['06:20','06:30','06:40','06:50'];
const SE = ['18:15','18:30','18:45','19:00','19:15','19:30','19:45','20:00','20:20'];
const GPS_R = 30;
const AT = 5 * 60 * 1000;
const LS = 7;
const LE = 18;
const LOOP_TIMEOUT = 30 * 60 * 1000;
const LOOP_NOSHOW = 1 * 60 * 60 * 1000;
const MAX_CANCEL_PER_DAY = 3;
const TRACK_INTERVAL = 5000;
const PENDING_TIMEOUT_MS = 5 * 60 * 1000;
const inflightActions = new Set();

function toast(m, d = 3000) {
  const e = document.getElementById('toast');
  if (!e) return;
  e.textContent = m;
  e.classList.add('show');
  clearTimeout(e._t);
  e._t = setTimeout(() => e.classList.remove('show'), d);
}
function now() { return Date.now(); }
function getToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isWeekday() { const d = new Date().getDay(); return d >= 1 && d <= 5; }
function dist(a, b, c, d) {
  const R = 6371000;
  const dl = (c - a) * Math.PI / 180;
  const dn = (d - b) * Math.PI / 180;
  const x = Math.sin(dl / 2) ** 2 + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(dn / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
function getShiftTime(d, t) {
  const [h, m] = t.split(':').map(Number);
  const x = new Date(d + 'T00:00:00');
  x.setHours(h, m, 0, 0);
  return x.getTime();
}
function getSid(d, t) { return d + '_' + t.replace(':', ''); }
function getDir(t) { return parseInt(t.split(':')[0]) < 12 ? 'morning' : 'evening'; }
function getGPS(t) { return getDir(t) === 'morning' ? GPS_WONG : GPS_YUEN; }
function getOrig(t) { return getDir(t) === 'morning' ? '大棠黃泥墩' : '元朗港鐵站 H 出口'; }
function getOrigL(t) { return getDir(t) === 'morning' ? '🌅 大棠黃泥墩開出' : '🌆 元朗港鐵站 H 出口開出'; }
function getDest(t) { return getDir(t) === 'morning' ? '元朗港鐵站 H 出口' : '大棠黃泥墩'; }
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function isLoopHour() {
  const h = new Date().getHours();
  return isWeekday() && h >= LS && h < LE;
}
function fmtBookTime(ts) {
  if (!ts) return '';
  try { return new Date(ts).toLocaleString('zh-HK', {hour:'2-digit',minute:'2-digit',hour12:false}); }
  catch (e) { return ''; }
}
async function withLock(key, fn) {
  if (inflightActions.has(key)) { toast('⏳ 處理中，請稍候...'); return; }
  inflightActions.add(key);
  try { return await fn(); }
  finally { inflightActions.delete(key); }
}

const DL = {
  async getActiveBuses() {
    const s = await db.ref('van/active_buses').once('value');
    const all = s.val() || {};
    const n = now();
    const r = [];
    Object.entries(all).forEach(([p, b]) => {
      if (b && b.isActive && (n - (b.lastUpdate || 0) < AT)) r.push({ plate: p, ...b });
    });
    return r;
  },
  async getBookings(d) {
    const s = await db.ref('booking/' + d).once('value');
    return s.val() || {};
  },
  async addBooking(d, b) {
    const r = db.ref('booking/' + d).push();
    b.id = r.key;
    b.createdAt = now();
    await r.set(b);
    return b;
  },
  async updateBooking(d, i, p) {
    return db.ref('booking/' + d + '/' + i).update(p);
  },
  async cancelBooking(d, i) {
    return DL.updateBooking(d, i, { status: 'cancelled', cancelledAt: now() });
  },
  async getPassenger(p) {
    const s = await db.ref('booking_passengers/' + p).once('value');
    return s.val();
  },
  async savePassenger(p, d) {
    return db.ref('booking_passengers/' + p).update(d);
  },
  async getSeatConfig(d, t) {
    const s = await db.ref('booking_seats/' + d + '/' + t.replace(':', '')).once('value');
    return s.val();
  },
  async getAllSeatConfigs(d) {
    const s = await db.ref('booking_seats/' + d).once('value');
    return s.val() || {};
  },
  async getLoopQueue(d) {
    const s = await db.ref('booking_loop/' + d).once('value');
    return s.val() || {};
  },
  async addLoopQueue(d, i) {
    const r = db.ref('booking_loop/' + d).push();
    i.id = r.key;
    i.createdAt = now();
    await r.set(i);
    return i;
  },
  async updateLoopQueue(d, i, p) {
    return db.ref('booking_loop/' + d + '/' + i).update(p);
  },
  async removeLoopQueue(d, i) {
    return db.ref('booking_loop/' + d + '/' + i).remove();
  },
  async updateCreditScore(phone, delta, extraPatch) {
    const pd = await DL.getPassenger(phone) || {};
    const cs = pd.creditScore != null ? pd.creditScore : 100;
    const ns = Math.max(0, Math.min(100, cs + delta));
    const patch = { creditScore: ns, lastCreditUpdate: now() };
    if (extraPatch) Object.assign(patch, extraPatch);
    if (ns < 30) patch.suspendedUntil = now() + 30 * 24 * 60 * 60 * 1000;
    else if (ns < 60) patch.suspendedUntil = now() + 7 * 24 * 60 * 60 * 1000;
    else patch.suspendedUntil = null;
    return DL.savePassenger(phone, patch);
  },
  async incrCancelCount(phone, date) {
    const cur = await DL.getCancelCount(phone, date);
    return db.ref('booking_passengers/' + phone + '/cancels/' + date).set(cur + 1);
  },
  async getCancelCount(phone, date) {
    const s = await db.ref('booking_passengers/' + phone + '/cancels/' + date).once('value');
    return s.val() || 0;
  },
  async writePassengerLocation(date, bookingId, data) {
    return db.ref('booking/' + date + '/' + bookingId + '/passengerLocation').update(data);
  },
  async clearPassengerLocation(date, bookingId) {
    return db.ref('booking/' + date + '/' + bookingId + '/passengerLocation').remove();
  },
  async adjustBusCount(plate, delta) {
    if (!plate) return null;
    const ref = db.ref('van/active_buses/' + plate + '/passengerCount');
    const result = await ref.transaction(c => {
      const cur = c || 0;
      return Math.max(0, cur + delta);
    });
    return result;
  },
  async resolvePlateForBooking(date, time) {
    try {
      const cfg = await DL.getSeatConfig(date, time);
      if (cfg && cfg.plate) return cfg.plate;
    } catch (e) {}
    return null;
  }
};

    }
  };
  r.on('value', h);
  loopPassengerRef = r;

async function loopJoin() {
  return withLock('loop_join', async () => {
    try {
      await ensureAuth();
      const t = getToday();
      const all = await DL.getLoopQueue(t);
      const ex = Object.values(all).find(x => x.phone === currentPassenger.phone && (x.status === 'pending' || x.status === 'reserved'));
      if (ex) { toast('⚠️ 你已經留咗位'); return; }
      const pickupLocation = document.getElementById('loop-pickup')?.value.trim();
      if (!pickupLocation) { toast('請輸入上車地點'); return; }
      const pd = await DL.getPassenger(currentPassenger.phone) || {};
      const cs = pd.creditScore != null ? pd.creditScore : 100;
      if (cs < 50) { toast('⚠️ 信用分不足'); return; }
      const cancelCount = await DL.getCancelCount(currentPassenger.phone, t);
      if (cancelCount >= MAX_CANCEL_PER_DAY) { toast('⚠️ 今日取消次數已達上限，請明日再試'); return; }
      await DL.addLoopQueue(t, { phone: currentPassenger.phone, name: pd.name || currentPassenger.name, seats: 1, status: 'pending', date: t, pickupLocation: pickupLocation });
      toast('✅ 已送出，等待司機確認', 3000);
    } catch (e) { toast('❌ 留位失敗：' + e.message); }
  });
}

async function loopReJoin() {
  try {
    const t = getToday();
    const all = await DL.getLoopQueue(t);
    const my = Object.values(all).find(x => x.phone === currentPassenger.phone && x.status === 'expired');
    if (my) await DL.removeLoopQueue(t, my.id);
    loadLoopSection();
  } catch (e) { toast('重試失敗：' + e.message); }
}

async function loopCancel() {
  if (!confirm('確定取消留位？')) return;
  return withLock('loop_cancel', async () => {
    try {
      const t = getToday();
      const all = await DL.getLoopQueue(t);
      const my = Object.values(all).find(x => x.phone === currentPassenger.phone && (x.status === 'pending' || x.status === 'reserved'));
      if (my) {
        await DL.removeLoopQueue(t, my.id);
        await DL.incrCancelCount(currentPassenger.phone, t);
      }
      toast('已取消留位');
    } catch (e) { toast('取消失敗：' + e.message); }
  });
}

async function loopBoarded() {
  if (!confirm('確定你已上車？')) return;
  return withLock('loop_boarded', async () => {
    try {
      const t = getToday();
      const all = await DL.getLoopQueue(t);
      const my = Object.values(all).find(x => x.phone === currentPassenger.phone && x.status === 'reserved');
      if (!my) { toast('搵唔到留位記錄'); return; }
      await DL.updateLoopQueue(t, my.id, { status: 'boarded', boardedAt: now() });
      const buses = await DL.getActiveBuses();
      let targetPlate = null;
      const saved = loadSelectedBus();
      if (saved && buses.find(b => b.plate === saved)) targetPlate = saved;
      else if (buses.length > 0) targetPlate = buses[0].plate;
      if (targetPlate) await DL.adjustBusCount(targetPlate, +1);
      toast('✅ 已上車，祝旅途愉快', 3000);
    } catch (e) { toast('❌ 失敗：' + e.message); }
  });
}

function renderShiftCard(d, t, ab, sc) {
  const sid = getSid(d, t);
  const cfg = sc[t.replace(':', '')];
  const dir = getDir(t);
  if (!cfg || !cfg.seats) {
    return '<div class="shift-card full" style="opacity:.4;"><div><div class="shift-time">' + esc(t) + '</div><div class="shift-info ' + (dir === 'morning' ? 'morning' : 'evening') + '">' + esc(getOrigL(t)) + '</div><div style="margin-top:6px;"><span class="badge badge-red">未開放</span></div></div><div class="shift-seats"><div class="num zero">—</div><div class="label">未開放</div></div></div>';
  }
  const quota = cfg.quota || cfg.seats;
  const used = Object.values(ab).filter(b => b.scheduleId === sid && ['pending', 'reserved', 'arrived', 'boarded'].includes(b.status)).reduce((s, b) => s + (b.seats || 0), 0);
  const rem = quota - used;
  const full = rem <= 0;
  const my = Object.values(ab).find(b => b.scheduleId === sid && b.passengerPhone === currentPassenger.phone && b.status !== 'cancelled' && b.status !== 'rejected');
  let bg = '';
  if (my) {
    if (my.status === 'pending') bg = '<span class="badge badge-orange">⏳ 等待司機確認</span>';
    else if (my.status === 'reserved') bg = '<span class="badge badge-yellow">✅ 已確認</span>';
    else if (my.status === 'arrived') bg = '<span class="badge badge-green">已到站</span>';
    else if (my.status === 'boarded') bg = '<span class="badge badge-blue">已上車</span>';
    else if (my.status === 'no-show') bg = '<span class="badge badge-red">未到站</span>';
  }
  const clk = !full || my;
  return '<div class="shift-card ' + (full && !my ? 'full' : '') + '" ' + (clk ? 'onclick="selectShift(\'' + d + '\',\'' + t + '\')"' : '') + '><div><div class="shift-time">' + esc(t) + '</div><div class="shift-info ' + (dir === 'morning' ? 'morning' : 'evening') + '">' + esc(getOrigL(t)) + '</div>' + (bg ? '<div style="margin-top:6px;">' + bg + '</div>' : '') + '<div style="font-size:10px;color:#64748b;margin-top:4px;">留位額：' + quota + ' 個</div></div><div class="shift-seats"><div class="num ' + (rem <= 0 ? 'zero' : rem <= 2 ? 'low' : '') + '">' + rem + '</div><div class="label">剩餘留位</div></div></div>';
}

function renderPassengerLogin(c) {

async function passengerLogin() {
  const btn = document.getElementById('passenger-login-btn');
  if (btn) { btn.disabled = true; btn.textContent = '處理中...'; }
  const phone = document.getElementById('login-phone').value.trim();
  const name = document.getElementById('login-name').value.trim();
  if (!/^\d{8}$/.test(phone)) { toast('請輸入 8 位數字'); if (btn) { btn.disabled = false; btn.textContent = '確認'; } return; }
  if (!name || name.length > 20) { toast('請輸入姓名（20 字內）'); if (btn) { btn.disabled = false; btn.textContent = '確認'; } return; }
  try {
    await ensureAuth();
    const ex = await DL.getPassenger(phone) || {};
    if (ex.suspendedUntil && ex.suspendedUntil > now()) {
      const r = Math.ceil((ex.suspendedUntil - now()) / (24 * 60 * 60 * 1000));
      toast('預約資格暫停中，剩餘 ' + r + ' 日');
      if (btn) { btn.disabled = false; btn.textContent = '確認'; }
      return;
    }
    await DL.savePassenger(phone, {
      name: name, phone: phone,
      creditScore: ex.creditScore != null ? ex.creditScore : 100,
      totalBookings: ex.totalBookings || 0,
      totalNoShows: ex.totalNoShows || 0,
      streakCount: ex.streakCount || 0,
      lastLogin: now()
    });
    currentPassenger = { phone: phone, name: name };
    savePassengerSession(currentPassenger);
    toast('✅ 登入成功');
    renderPassengerHome();
  } catch (e) {
    toast('❌ ' + e.message, 5000);
    if (btn) { btn.disabled = false; btn.textContent = '確認'; }
  }
}

function passengerLogout() {
  currentPassenger = null;
  clearPassengerSession();

  currentTrackingDate = null;

async function selectShift(d, t) {

    if (!cfg || !cfg.seats) { toast('此班次未開放預約'); return; }

    const rem = quota - used;
    const my = Object.values(tb).find(b => b.scheduleId === sid && b.passengerPhone === currentPassenger.phone && b.status !== 'cancelled' && b.status !== 'rejected');
    if (my) { toast('你已經預約咗呢個班次'); return; }

async function confirmBooking(d, t) {
  return withLock('confirm_booking_' + d + '_' + t, async () => {
    const btn = document.getElementById('confirm-booking-btn');
    if (btn) { btn.disabled = true; btn.textContent = '處理中...'; }
    const name = document.getElementById('book-name').value.trim();
    const seats = parseInt(document.getElementById('book-seats').value);
    const pickupLocation = document.getElementById('book-pickup').value.trim();
    if (!name || name.length > 20) { toast('請輸入姓名'); if (btn) { btn.disabled = false; btn.textContent = '送出預約'; } return; }
    if (!pickupLocation) { toast('請輸入上車地點'); if (btn) { btn.disabled = false; btn.textContent = '送出預約'; } return; }
    try {
      await ensureAuth();
      const cfg = await DL.getSeatConfig(d, t);
      if (!cfg || !cfg.seats) throw new Error('此班次未開放');
      const quota = cfg.quota || cfg.seats;
      const sid = getSid(d, t);
      const today = getToday();
      const cancelCount = await DL.getCancelCount(currentPassenger.phone, today);
      if (cancelCount >= MAX_CANCEL_PER_DAY) throw new Error('今日取消次數已達上限，請明日再試');
      const tb = await DL.getBookings(d);
      const used = Object.values(tb).filter(b => b.scheduleId === sid && ['pending', 'reserved', 'arrived', 'boarded'].includes(b.status)).reduce((s, b) => s + (b.seats || 0), 0);
      if (used + seats > quota) throw new Error('剩餘留位額不足');
      const b = {
        scheduleId: sid, date: d, time: t,
        passengerName: name, passengerPhone: currentPassenger.phone,
        seats: seats, status: 'pending', direction: getDir(t),
        pickupLocation: pickupLocation
      };
      const sv = await DL.addBooking(d, b);
      try {
        const pd = await DL.getPassenger(currentPassenger.phone) || {};
        await DL.savePassenger(currentPassenger.phone, { totalBookings: (pd.totalBookings || 0) + 1, lastBooking: now() });
      } catch (e) {}
      toast('✅ 已送出，等待司機確認', 3000);
      openWaitingRoom(sv.id, d, t);
    } catch (e) {
      toast('❌ ' + e.message, 5000);
      if (btn) { btn.disabled = false; btn.textContent = '送出預約'; }
    }
  });
}

function openWaitingRoom(id, d, t) { renderWaitingRoom(id, d, t); }

async function passengerBoardFixed(id, d) {
  if (!confirm('確定你已上車？')) return;
  return withLock('board_fixed_' + id, async () => {
    try {
      const tb = await DL.getBookings(d);
      const b = tb[id];
      if (!b) { toast('搵唔到預約'); return; }
      if (b.status !== 'reserved' && b.status !== 'arrived') { toast('狀態已變更'); return; }
      await DL.updateBooking(d, id, { status: 'boarded', boardedAt: now() });
      await DL.clearPassengerLocation(d, id);
      stopGPS();
      currentTrackingBookingId = null;
      currentTrackingDate = null;
      gpsMarkedBookingId = null;
      if (countdownTimerId) { clearTimeout(countdownTimerId); countdownTimerId = null; countdownBookingKey = null; }
      toast('✅ 已上車');
      renderPassengerHome();
    } catch (e) { toast('失敗：' + e.message); }
  });
}

function updateCountdown(d, t, id) {
  const key = id + '|' + d + '|' + t;
  if (countdownBookingKey !== key) {
    if (countdownTimerId) { clearTimeout(countdownTimerId); countdownTimerId = null; }
    countdownBookingKey = key;
  }
  const el = document.getElementById('countdown');
  if (!el) {
    if (countdownTimerId) { clearTimeout(countdownTimerId); countdownTimerId = null; }
    countdownBookingKey = null;
    return;
  }
  const diff = getShiftTime(d, t) - now();
  if (diff <= 0) { el.textContent = '班次已發車'; countdownTimerId = null; countdownBookingKey = null; return; }
  const m = Math.floor(diff / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  el.textContent = '距離發車：' + m + ':' + String(s).padStart(2, '0');
  countdownTimerId = setTimeout(() => updateCountdown(d, t, id), 1000);
}

async function cancelBooking(id, d) {
  if (!confirm('確定取消預約？')) return;
  return withLock('cancel_booking_' + id, async () => {
    try {
      const bookings = await DL.getBookings(d);
      const b = bookings[id];
      if (!b) { toast('預約唔存在'); return; }
      if (b.status === 'cancelled' || b.status === 'rejected') { toast('已取消'); return; }
      await DL.cancelBooking(d || getToday(), id);
      if (b.status === 'reserved' || b.status === 'arrived') {
        const plate = await DL.resolvePlateForBooking(d, b.time);
        if (plate) await DL.adjustBusCount(plate, -(b.seats || 1));
      }
      await DL.clearPassengerLocation(d, id);
      await DL.incrCancelCount(currentPassenger.phone, d || getToday());
      stopGPS();
      currentTrackingBookingId = null;
      currentTrackingDate = null;
      gpsMarkedBookingId = null;
      if (countdownTimerId) { clearTimeout(countdownTimerId); countdownTimerId = null; countdownBookingKey = null; }
      toast('已取消預約');
      if (waitingRoomListener) { try { waitingRoomListener.off(); } catch (e) {} waitingRoomListener = null; }
      renderPassengerHome();
    } catch (e) { toast('取消失敗：' + e.message); }
  });
}

function startGPS(id, d, t) {
  if (!navigator.geolocation) {
    const x = document.getElementById('gps-text');
    if (x) x.textContent = '⚠️ 手機不支援 GPS';
    const xs = document.getElementById('gps-sub');
    if (xs) xs.textContent = '請通知司機手動確認';
    return;
  }
  const g = getGPS(t);
  const gt = document.getElementById('gps-text');
  const gs = document.getElementById('gps-sub');
  if (gt) gt.textContent = '📡 GPS 定位中...';
  if (gs) gs.textContent = '目標：' + getOrig(t);
  stopGPS();
  gpsMarkedBookingId = null;
  gpsLastWrite = 0;
  gpsWatchId = navigator.geolocation.watchPosition(
    async (pos) => {
      const dd = dist(pos.coords.latitude, pos.coords.longitude, g.lat, g.lng);
      const box = document.getElementById('gps-box');
      const text = document.getElementById('gps-text');
      const sub = document.getElementById('gps-sub');
      const accuracy = Math.round(pos.coords.accuracy || 0);
      const n = now();
      if (n - gpsLastWrite > TRACK_INTERVAL) {
        gpsLastWrite = n;
        DL.writePassengerLocation(d, id, {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          distance: Math.round(dd),
          accuracy: accuracy,
          updatedAt: n,
          arrived: dd <= GPS_R,
          name: currentPassenger ? currentPassenger.name : '',
          phone: currentPassenger ? currentPassenger.phone : '',
          time: t
        }).catch(() => {});
      }
      if (!box || !text || !sub) return;
      if (dd <= GPS_R) {
        box.style.borderColor = '#22c55e';
        box.style.background = '#052e16';
        text.textContent = '✅ 已到站！';
        sub.textContent = '距離 ' + Math.round(dd) + ' 米 · 司機已收到通知';
        if (gpsMarkedBookingId !== id) {
          gpsMarkedBookingId = id;
          await markArrived(id, d, pos.coords.latitude, pos.coords.longitude, accuracy);
        }
      } else {
        text.textContent = '📡 前往站頭中...';
        sub.textContent = '距離 ' + Math.round(dd) + ' 米（需進入 ' + GPS_R + ' 米範圍）· 精確度 ' + accuracy + 'm';
      }
    },
    (err) => {
      const x = document.getElementById('gps-text');
      if (x) x.textContent = '⚠️ GPS 錯誤：' + err.message;
      const xs = document.getElementById('gps-sub');
      if (xs) xs.textContent = '請確保已開啟定位權限';
    },
    { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 }
  );
}
function stopGPS() {
  if (gpsWatchId !== null) {
    try { navigator.geolocation.clearWatch(gpsWatchId); } catch (e) {}
    gpsWatchId = null;
  }
}

async function markArrived(id, d, lat, lng, accuracy) {
  try {
    const b = (await DL.getBookings(d))[id];
    if (!b || b.status !== 'reserved') return;
    await DL.updateBooking(d, id, {
      status: 'arrived',
      arrivedAt: now(),
      arrivedLat: lat,
      arrivedLng: lng,
      arrivedAccuracy: accuracy,
      arrivedAuto: true
    });
    await DL.writePassengerLocation(d, id, { arrived: true, arrivedAt: now() });
    toast('✅ 已自動確認到站！', 3000);
  } catch (e) {}
}
/* ============ 司機端 ============ */
function clearDriverListeners() {
  driverListeners.forEach(({ ref, handler }) => { try { ref.off('value', handler); } catch (e) {} });
  driverListeners = [];
  if (fixedBookingsRef && fixedBookingsHandler) {
    try { fixedBookingsRef.off('value', fixedBookingsHandler); } catch (e) {}
    fixedBookingsRef = null; fixedBookingsHandler = null;
  }
  if (loopQueueRef && loopQueueHandler) {
    try { loopQueueRef.off('value', loopQueueHandler); } catch (e) {}
    loopQueueRef = null; loopQueueHandler = null;
  }
  if (driverBookingListener && driverListenerDate) {
    try { db.ref('booking/' + driverListenerDate).off('value', driverBookingListener); } catch (e) {}
    driverBookingListener = null;
  }
  if (driverLoopListener && driverListenerDate) {
    try { db.ref('booking_loop/' + driverListenerDate).off('value', driverLoopListener); } catch (e) {}
    driverLoopListener = null;
  }
  driverListenerDate = null;
}

async function renderDriverHome() {
  const c = document.getElementById('driver-content');
  clearDriverListeners();
  try {
    await ensureAuth();
    const ab = await DL.getActiveBuses();
    if (ab.length === 0) {
      clearSelectedBus(); currentDriver = null;
      c.innerHTML = '<div class="waiting-big"><div class="icon">🚐</div><h3>等待當值中...</h3><p>請先喺「西鐵小巴系統」開始當值。<br>開始當值後，呢個頁面會自動顯示你嘅車牌同預約名單。</p></div>';
      const r = db.ref('van/active_buses');
      const h = () => { if (currentScreen === 'driver') renderDriverHome(); };
      r.on('value', h);
      driverListeners.push({ ref: r, handler: h });
      return;
    }
    if (ab.length === 1) {
      currentDriver = { plate: ab[0].plate, carSeats: ab[0].carSeats || 16, passengerCount: ab[0].passengerCount || 0 };
      saveSelectedBus(currentDriver.plate);
      renderDriverDuty();
      return;
    }
    const sv = loadSelectedBus();
    if (sv && ab.find(b => b.plate === sv)) {

let passengerTrackingRef = null;
let passengerTrackingHandler = null;
let currentPassengerTracking = {};

function startPassengerTracking(t) {
  if (passengerTrackingRef && passengerTrackingHandler) {
    try { passengerTrackingRef.off('value', passengerTrackingHandler); } catch (e) {}
    passengerTrackingRef = null;
    passengerTrackingHandler = null;
  }
  passengerTrackingRef = db.ref('booking/' + t);
  passengerTrackingHandler = (snap) => {
    const all = snap.val() || {};
    currentPassengerTracking = {};
    Object.entries(all).forEach(([id, b]) => {
      if (b && b.passengerLocation) currentPassengerTracking[id] = b.passengerLocation;
    });
    const fixedTab = document.getElementById('driver-tab-fixed');
    if (fixedTab && fixedTab.style.display !== 'none') {
      const scJson = fixedTab.dataset ? fixedTab.dataset.sc : null;
      if (scJson && currentCachedBookings && Object.keys(currentCachedBookings).length > 0) {
        try {
          const scObj = JSON.parse(scJson);
          renderDriverFixedHTML(currentCachedBookings, scObj, t, [...SM, ...SE]);
        } catch (e) {}
      }
    }
    const loopTab = document.getElementById('driver-tab-loop');
    if (loopTab && loopTab.style.display !== 'none') {
      if (currentLoopCache) renderDriverLoopHTML(currentLoopCache);
    }
  };

async function renderDriverFixedList() {
  const c = document.getElementById('driver-tab-fixed');

function renderDriverFixedHTML(ab, sc, t, allS) {
  const c = document.getElementById('driver-tab-fixed'), a = document.getElementById('alert-area');
  if (!c) return;
  const bus = currentDriver;
  if (!bus) return;
  let mpt = 0;
  allS.forEach(tm => { const sid = getSid(t, tm); Object.values(ab).forEach(b => { if (b.scheduleId === sid && b.status === 'pending') mpt++; }); });
  if (a) {
    if (mpt > 0) { a.innerHTML = '<div class="alert-banner"><div class="icon">🔔</div><div class="text">有 ' + mpt + ' 個新固定班次預約！</div><div class="sub">請撳「✅ 確認」或「❌ 拒絕」</div></div>'; }
    else { a.innerHTML = ''; }
  }
  let h = '';
  allS.forEach(tm => {
    const sid = getSid(t, tm);
    const cfg = sc[tm.replace(':', '')];
    const quota = (cfg && cfg.quota) || (cfg && cfg.seats) || bus.carSeats || 16;
    const dir = getDir(tm);
    const sb = Object.values(ab).filter(b => b.scheduleId === sid && b.status !== 'cancelled');
    const used = sb.filter(b => ['pending', 'reserved', 'arrived', 'boarded'].includes(b.status)).reduce((s, b) => s + (b.seats || 0), 0);

    const pl = sb.filter(b => b.status === 'pending');

      const bookTime = fmtBookTime(b.createdAt);
      return '<div class="pending-item"><div class="name">' + esc(b.passengerName) + (b.seats > 1 ? ' ×' + b.seats : '') + '</div><div class="phone">📞 ' + esc(b.passengerPhone) + '</div>' + (b.pickupLocation ? '<div class="pickup">📍 ' + esc(b.pickupLocation) + '</div>' : '<div class="pickup" style="color:#f87171;">📍 未填上車地點</div>') + (bookTime ? '<div class="booktime">⏰ 留位時間 ' + bookTime + '</div>' : '') + '<div class="actions"><button class="btn-confirm" onclick="driverConfirm(\'' + b.date + '\',\'' + b.id + '\',\'' + esc(bus.plate) + '\')">✅ 確認</button><button class="btn-reject" onclick="driverReject(\'' + b.date + '\',\'' + b.id + '\',\'' + esc(bus.plate) + '\')">❌ 拒絕</button></div></div>';
    }).join('') + '</div>' : '') + (cl.length > 0 ? '<div style="margin-top:12px;"><div style="font-size:13px;color:#4ade80;font-weight:700;margin-bottom:6px;">✅ 已確認留位（' + cl.length + '）</div>' + cl.map(b => renderConfirmedPassenger(b)).join('') + '</div>' : '') + (al.length > 0 ? '<div style="margin-top:12px;"><div style="font-size:13px;color:#22c55e;font-weight:700;margin-bottom:6px;">🔴 已到站（' + al.length + '）</div>' + al.map(b => renderConfirmedPassenger(b)).join('') + '</div>' : '') + '</div>';
  });

}

function renderConfirmedPassenger(b) {
  const track = currentPassengerTracking[b.id];
  let gpsLine = '';
  if (track && track.updatedAt && (now() - track.updatedAt < 120000)) {
    if (track.arrived) {
      gpsLine = '<div class="pax-arrived">🟢 已到站（' + Math.round(track.distance) + ' 米 · ' + new Date(track.updatedAt).toLocaleTimeString('zh-HK', {hour:'2-digit',minute:'2-digit',hour12:false}) + '）</div>';
    } else {
      gpsLine = '<div class="pax-waiting">🟡 前往中（距離 ' + Math.round(track.distance) + ' 米 · 精確度 ' + (track.accuracy || '?') + 'm）</div>';
    }
  } else if (b.arrivedAuto || b.arrivedAt) {
    gpsLine = '<div class="pax-arrived">🟢 已到站（' + new Date(b.arrivedAt).toLocaleTimeString('zh-HK', {hour:'2-digit',minute:'2-digit',hour12:false}) + '）</div>';
  } else {
    gpsLine = '<div class="pax-nogps">⚪ 等待 GPS 訊號...</div>';
  }
  return '<div class="booking-item arrived"><div><div class="booking-name">' + esc(b.passengerName) + (b.seats > 1 ? ' ×' + b.seats : '') + '</div><div class="booking-phone">📞 ' + esc(b.passengerPhone) + '</div>' + (b.pickupLocation ? '<div style="font-size:12px;color:#4ade80;margin-top:2px;">📍 ' + esc(b.pickupLocation) + '</div>' : '') + gpsLine + '</div><div>' + (b.status === 'boarded' ? '<span class="badge badge-blue">已上車</span>' : b.status === 'arrived' ? '<span class="badge badge-green">已到站</span>' : '<span class="badge badge-yellow">已確認</span>') + '</div></div>';

async function driverConfirmLoop(id) {
  return withLock('driver_confirm_loop_' + id, async () => {
    try {
      const t = getToday();
      const all = await DL.getLoopQueue(t);
      const x = all[id];
      if (!x) { toast('找不到留位'); return; }
      if (x.status !== 'pending') { toast('狀態已變更'); return; }
      await DL.updateLoopQueue(t, id, { status: 'reserved', confirmedAt: now() });
      toast('✅ 已確認留位', 2000);
    } catch (e) { toast('失敗：' + e.message); }
  });
}

async function driverRejectLoop(id) {
  if (!confirm('確定拒絕呢位乘客？')) return;
  return withLock('driver_reject_loop_' + id, async () => {
    try {
      const t = getToday();
      const all = await DL.getLoopQueue(t);
      const x = all[id];
      if (!x) { toast('找不到留位'); return; }
      await DL.removeLoopQueue(t, id);
      toast('❌ 已拒絕', 2000);
    } catch (e) { toast('失敗：' + e.message); }
  });
}

async function driverConfirm(d, id, p) {
  return withLock('driver_confirm_' + id, async () => {
    try {
      const bs = await DL.getBookings(d);
      const b = bs[id];
      if (!b) { toast('預約唔存在'); return; }
      if (b.status !== 'pending') { toast('狀態已變更（' + b.status + '）'); return; }
      await DL.updateBooking(d, id, { status: 'reserved', confirmedAt: now(), confirmedBy: p });
      await DL.adjustBusCount(p, +(b.seats || 1));
      toast('✅ 已確認留位', 2000);
    } catch (e) { toast('確認失敗：' + e.message); }
  });
}

async function driverReject(d, id, p) {
  const r = prompt('拒絕原因（可以留空）：', '') || '';
  return withLock('driver_reject_' + id, async () => {
    try {
      const bs = await DL.getBookings(d);
      const b = bs[id];
      if (!b) { toast('預約唔存在'); return; }
      if (b.status === 'cancelled' || b.status === 'rejected') { toast('狀態已變更'); return; }
      const wasReserved = (b.status === 'reserved' || b.status === 'arrived');
      await DL.updateBooking(d, id, { status: 'rejected', rejectedAt: now(), rejectedBy: p, rejectReason: r });
      if (wasReserved) {
        const plate = (await DL.resolvePlateForBooking(d, b.time)) || p;
        await DL.adjustBusCount(plate, -(b.seats || 1));
      }
      await DL.clearPassengerLocation(d, id);
      toast('❌ 已拒絕', 2000);
    } catch (e) { toast('操作失敗：' + e.message); }
  });
}

    h += '<div class="card-title" style="margin:16px 0 10px;">🔄 循環線留位</div><div class="card" style="padding:14px;"><div style="display:flex;justify-content:space-between;"><div><div style="font-size:12px;color:#64748b;">待確認</div><div style="font-size:24px;font-weight:700;color:#fdba74;">' + wl + '</div></div><div><div style="font-size:12px;color:#64748b;">已確認</div><div style="font-size:24px;font-weight:700;color:#4ade80;">' + rl + '</div></div><div style="text-align:right;"><div style="font-size:12px;color:#64748b;">已上車</div><div style="font-size:24px;font-weight:700;color:#7dd3fc;">' + bl + '</div></div></div></div>';
  } catch (e) { h += '<div class="card" style="color:#f87171;">載入失敗：' + esc(e.message) + '</div>'; }
  c.innerHTML = h;
}

/* ============ 自動清理 ============ */
async function awardCreditForGoodBehavior() {
  try {
    const t = getToday();
    const bs = await DL.getBookings(t);
    for (const [id, b] of Object.entries(bs)) {
      if (b.status !== 'boarded' && b.status !== 'arrived') continue;
      if (b.creditAwarded) continue;
      const st = getShiftTime(b.date, b.time);
      if (now() < st + 30 * 60 * 1000) continue;
      const pd = await DL.getPassenger(b.passengerPhone) || {};
      const cs = pd.creditScore != null ? pd.creditScore : 100;
      const streak = (pd.streakCount || 0) + 1;
      if (streak >= 5) {
        if (cs < 100) {
          await DL.updateCreditScore(b.passengerPhone, +5, { streakCount: 0 });
        } else {
          await DL.savePassenger(b.passengerPhone, { streakCount: 0 });
        }
      } else {
        await DL.savePassenger(b.passengerPhone, { streakCount: streak });
      }
      await db.ref('booking/' + t + '/' + id).update({ creditAwarded: true });
    }
  } catch (e) {}
}

async function autoCleanExpiredBookings() {
  try {
    const t = getToday();
    const bs = await DL.getBookings(t);
    for (const [id, b] of Object.entries(bs)) {
      if (b.status !== 'reserved' && b.status !== 'pending') continue;
      const st = getShiftTime(b.date, b.time);
      if (now() > st + PENDING_TIMEOUT_MS) {
        if (b.status === 'pending') {
          await DL.updateBooking(b.date, id, { status: 'cancelled', cancelledAt: now(), autoCancelled: 'pending_timeout' });
        } else if (b.status === 'reserved') {
          await DL.updateBooking(b.date, id, { status: 'no-show', noShowAt: now() });
          const plate = await DL.resolvePlateForBooking(b.date, b.time);
          if (plate) await DL.adjustBusCount(plate, -(b.seats || 1));
          await DL.clearPassengerLocation(b.date, id);
          const pd = await DL.getPassenger(b.passengerPhone) || {};
          await DL.updateCreditScore(b.passengerPhone, -20, { totalNoShows: (pd.totalNoShows || 0) + 1, streakCount: 0 });
        }
      }
    }
    const l = await DL.getLoopQueue(t);
    for (const [id, x] of Object.entries(l)) {
      if (x.status === 'pending' && now() - (x.createdAt || 0) > LOOP_TIMEOUT) {
        await DL.updateLoopQueue(t, id, { status: 'expired', expiredAt: now() });
      } else if (x.status === 'reserved' && now() - (x.confirmedAt || 0) > LOOP_NOSHOW) {
        await DL.removeLoopQueue(t, id);
        const pd = await DL.getPassenger(x.phone) || {};
        await DL.updateCreditScore(x.phone, -10, { totalNoShows: (pd.totalNoShows || 0) + 1, streakCount: 0 });
      } else if (x.status === 'expired' && now() - (x.expiredAt || 0) > 2 * 60 * 60 * 1000) {
        await DL.removeLoopQueue(t, id);
      }
    }
    await awardCreditForGoodBehavior();
  } catch (e) {}
}

/* ============ 初始化 ============ */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  if (document.getElementById('login-phone')) passengerLogin();
});
window.addEventListener('popstate', function (e) {
  if (currentScreen !== 'home') { openModule('home'); history.pushState(null, '', location.href); }
});
db.ref('.info/connected').on('value', snap => {
  if (snap.val() === true) console.log('☁️ Firebase 已連線');
  else console.log('⚠️ Firebase 離線');
});

(async function init() {
  console.log('🚐 浚鍵管理有限公司 · 小巴留座系統 v8.3 啟動');
  currentPassenger = loadPassengerSession();
  try { await ensureAuth(); } catch (e) { console.warn(e); }
  updateHomeStats();
  setInterval(autoCleanExpiredBookings, 60 * 1000);
  setTimeout(autoCleanExpiredBookings, 5000);
  setInterval(() => { if (currentScreen === 'home') updateHomeStats(); }, 30 * 1000);
  setInterval(async () => {
    try {
      const t = getToday();
      const snap = await db.ref('booking/' + t).once('value');
      const all = snap.val() || {};
      const stale = {};
      Object.entries(all).forEach(([id, b]) => {
        if (b && b.passengerLocation && b.passengerLocation.updatedAt && now() - b.passengerLocation.updatedAt > 2 * 60 * 1000) {
          stale[id + '/passengerLocation'] = null;
        }
      });
      if (Object.keys(stale).length > 0) await db.ref('booking/' + t).update(stale);
    } catch (e) {}
  }, 30 * 1000);
  history.pushState(null, '', location.href);
})();
</script>
