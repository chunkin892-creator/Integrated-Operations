<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#0a0f1a;color:#e2e8f0;min-height:100vh;}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.header{background:linear-gradient(135deg,#0f172a,#1e293b);padding:18px 16px;text-align:center;border-bottom:1px solid #1e293b;}
.header h1{font-size:16px;font-weight:700;color:#38bdf8;}
.header .sub{font-size:11px;color:#64748b;margin-top:4px;}
.header .company{font-size:13px;color:#94a3b8;font-weight:600;}
.screen{display:none;flex:1;padding:16px;}
.screen.active{display:block;}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;}
.btn-primary{background:#0ea5e9;color:#fff;}
.btn-success{background:#22c55e;color:#fff;}
.btn-danger{background:#ef4444;color:#fff;}
.btn-outline{background:transparent;border:1px solid #334155;color:#94a3b8;}
.btn-sm{padding:10px 16px;font-size:14px;border-radius:8px;width:auto;display:inline-block;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.card{background:#1e293b;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #334155;}
.card-title{font-size:14px;font-weight:600;color:#94a3b8;margin-bottom:8px;}
.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.module-card{background:#1e293b;border-radius:16px;padding:20px 16px;border:1px solid #334155;text-align:center;cursor:pointer;}
.module-card:active{background:#334155;}
.module-card .icon{font-size:32px;margin-bottom:8px;}
.module-card .name{font-size:14px;font-weight:600;color:#f1f5f9;}
.module-card .desc{font-size:11px;color:#64748b;margin-top:4px;}
.shift-card{background:#1e293b;border-radius:14px;padding:16px;margin-bottom:10px;border:1px solid #334155;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.shift-card.full{opacity:.5;}
.shift-time{font-size:22px;font-weight:700;color:#f1f5f9;}
.shift-info{font-size:12px;color:#64748b;margin-top:4px;}
.shift-info.morning{color:#4ade80;font-weight:600;}
.shift-info.evening{color:#fdba74;font-weight:600;}
.shift-seats{text-align:right;}
.shift-seats .num{font-size:28px;font-weight:700;color:#22c55e;}
.shift-seats .num.low{color:#f59e0b;}
.shift-seats .num.zero{color:#ef4444;}
.shift-seats .label{font-size:11px;color:#64748b;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-green{background:#052e16;color:#4ade80;}
.badge-yellow{background:#422006;color:#fbbf24;}
.badge-red{background:#450a0a;color:#f87171;}
.badge-blue{background:#082f49;color:#38bdf8;}
.badge-orange{background:#431407;color:#fdba74;}
.input-group{margin-bottom:14px;}
.input-group label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:16px;outline:none;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1e293b;color:#f1f5f9;padding:12px 24px;border-radius:10px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;border:1px solid #334155;max-width:90%;text-align:center;}
.toast.show{opacity:1;}
.bottom-nav{display:flex;background:#1e293b;border-top:1px solid #334155;position:sticky;bottom:0;}
.nav-item{flex:1;padding:12px;text-align:center;font-size:11px;color:#64748b;cursor:pointer;border:none;background:none;}
.nav-item.active{color:#38bdf8;}
.nav-item .icon{font-size:20px;display:block;margin-bottom:2px;}
.booking-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:10px;margin-bottom:8px;background:#0f172a;border-left:4px solid #334155;}
.booking-item.arrived{border-left-color:#22c55e;}
.booking-item.not-arrived{border-left-color:#f59e0b;}
.booking-name{font-size:15px;font-weight:600;}
.booking-phone{font-size:12px;color:#64748b;}
.driver-top{background:linear-gradient(135deg,#052e16,#065f46);border:2px solid #22c55e;border-radius:14px;padding:18px;text-align:center;margin-bottom:16px;}
.driver-top .plate{font-size:42px;font-weight:900;color:#4ade80;letter-spacing:4px;line-height:1;}
.driver-top .seats{font-size:18px;color:#86efac;margin-top:8px;font-weight:700;}
.driver-top .status{font-size:14px;color:#86efac;margin-top:6px;}
.driver-info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
.driver-info-grid .cell{background:rgba(0,0,0,.3);border-radius:8px;padding:8px;text-align:center;}
.driver-info-grid .cell .num{font-size:24px;font-weight:900;}
.driver-info-grid .cell .lbl{font-size:10px;color:#86efac;margin-top:2px;}
.alert-banner{background:linear-gradient(135deg,#7c2d12,#c2410c);border:2px solid #fb923c;border-radius:14px;padding:16px;text-align:center;margin-bottom:16px;}
.alert-banner .icon{font-size:36px;margin-bottom:8px;}
.alert-banner .text{font-size:18px;font-weight:900;color:#fff;}
.alert-banner .sub{font-size:13px;color:#fed7aa;margin-top:4px;}
.big-shift{background:#1e293b;border-radius:16px;padding:18px;margin-bottom:14px;border:2px solid #334155;}
.big-shift .time{font-size:36px;font-weight:900;color:#38bdf8;line-height:1;}
.big-shift .origin{font-size:16px;color:#94a3b8;margin-top:6px;font-weight:600;}
.big-shift .counts{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.big-shift .seat-num{font-size:40px;font-weight:900;color:#22c55e;line-height:1;}
.big-shift .seat-num.low{color:#f59e0b;}
.big-shift .seat-num.zero{color:#ef4444;}
.big-shift .seat-label{font-size:12px;color:#64748b;text-align:right;}
.big-shift .arrived-count{font-size:16px;color:#22c55e;font-weight:700;}
.big-shift .pending-count{font-size:16px;color:#fdba74;font-weight:700;}
.big-shift.full{border-color:#ef4444;background:#450a0a;}
.big-shift.full .seat-num{color:#f87171;}
.big-shift.full .time{color:#f87171;}
.full-label{display:block;text-align:center;font-size:28px;font-weight:900;color:#f87171;margin-top:10px;letter-spacing:4px;}
.pending-box{background:#1c1917;border:2px solid #fb923c;border-radius:12px;padding:12px;margin-top:10px;}
.pending-box .pending-title{font-size:14px;font-weight:700;color:#fdba74;margin-bottom:8px;}
.pending-item{background:#0f172a;border-radius:10px;padding:12px;margin-bottom:8px;border-left:4px solid #fb923c;}
.pending-item .name{font-size:16px;font-weight:700;color:#fff;}
.pending-item .phone{font-size:12px;color:#94a3b8;margin-top:2px;}
.pending-item .actions{display:flex;gap:8px;margin-top:10px;}
.pending-item .actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
.pending-item .actions .btn-confirm{background:#22c55e;color:#fff;}
.pending-item .actions .btn-reject{background:#ef4444;color:#fff;}
.waiting-big{text-align:center;padding:48px 16px;background:#1e293b;border-radius:16px;border:2px dashed #475569;}
.waiting-big .icon{font-size:64px;margin-bottom:16px;}
.waiting-big h3{font-size:20px;color:#94a3b8;margin-bottom:8px;}
.waiting-big p{font-size:14px;color:#64748b;line-height:1.6;}
.bus-pick{background:#1e293b;border-radius:14px;padding:18px;margin-bottom:12px;border:2px solid #38bdf8;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.bus-pick .plate{font-size:26px;font-weight:900;color:#38bdf8;}
.bus-pick .info{font-size:13px;color:#94a3b8;margin-top:4px;}
.bus-pick .arrow{font-size:28px;color:#38bdf8;}
.loop-card{background:linear-gradient(135deg,#0c4a6e,#075985);border:2px solid #0ea5e9;border-radius:14px;padding:16px;margin-bottom:12px;}
.loop-card .title{font-size:16px;font-weight:900;color:#7dd3fc;}
.loop-card .sub{font-size:12px;color:#bae6fd;margin-top:4px;}
.loop-wait{background:#0f172a;border-radius:10px;padding:12px;margin-bottom:8px;border-left:4px solid #0ea5e9;}
.loop-wait .name{font-size:16px;font-weight:700;color:#fff;}
.loop-wait .phone{font-size:12px;color:#94a3b8;margin-top:2px;}
.loop-wait .actions{display:flex;gap:8px;margin-top:10px;}
.loop-wait .actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
.loop-wait .actions .btn-board{background:#22c55e;color:#fff;}
.loop-wait .actions .btn-cancel{background:#ef4444;color:#fff;}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="company">浚鍵管理有限公司</div>
<h1>小巴留座系統</h1>
<div class="sub">大棠黃泥墩 ↔ 元朗港鐵站 H 出口</div>
</div>
<div class="screen active" id="screen-home">
<div class="module-grid">
<div class="module-card" onclick="openModule('booking')"><div class="icon">🚐</div><div class="name">小巴留座</div><div class="desc">乘客預約</div></div>
<div class="module-card" onclick="openModule('driver')"><div class="icon">🧑‍✈️</div><div class="name">司機端</div><div class="desc">當值 · 確認</div></div>
<div class="module-card" onclick="openModule('admin')"><div class="icon">⚙️</div><div class="name">管理</div><div class="desc">當值 · 狀況</div></div>
<div class="module-card" onclick="openModule('info')"><div class="icon">ℹ️</div><div class="name">服務資訊</div><div class="desc">班次 · 時間</div></div>
</div>
<div class="card">
<div class="card-title">📊 今日概況</div>
<div style="display:flex;gap:8px;">
<div style="flex:1;text-align:center;padding:12px;background:#422006;border-radius:10px;border:1px solid #f59e0b;">
<div style="font-size:24px;font-weight:700;color:#fbbf24;" id="home-pending">0</div>
<div style="font-size:11px;color:#94a3b8;">待確認</div>
</div>
<div style="flex:1;text-align:center;padding:12px;background:#052e16;border-radius:10px;border:1px solid #22c55e;">

<div style="font-size:11px;color:#94a3b8;">已確認</div>
</div>
<div style="flex:1;text-align:center;padding:12px;background:#0c4a6e;border-radius:10px;border:1px solid #0ea5e9;">
<div style="font-size:24px;font-weight:700;color:#7dd3fc;" id="home-loop">0</div>
<div style="font-size:11px;color:#94a3b8;">循環候補</div>
</div>
</div>
</div>
</div>
<div class="screen" id="screen-booking"><div id="booking-content"></div></div>
<div class="screen" id="screen-driver"><div id="driver-content"></div></div>
<div class="screen" id="screen-admin"><div id="admin-content"></div></div>
<div class="screen" id="screen-info"><div id="info-content"></div></div>
<div class="bottom-nav" id="bottom-nav" style="display:none;">
<button class="nav-item active" onclick="navTo('home')"><span class="icon">🏠</span>首頁</button>
<button class="nav-item" onclick="navTo('booking')"><span class="icon">🚐</span>留座</button>
<button class="nav-item" onclick="navTo('driver')"><span class="icon">🧑‍✈️</span>司機</button>
</div>
<div class="toast" id="toast"></div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyAX7Zy5br1ozGOGxHvDeFNY-Ldcjjw8Qgc",authDomain:"triple-login-version.firebaseapp.com",databaseURL:"https://triple-login-version-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"triple-login-version",storageBucket:"triple-login-version.firebasestorage.app",messagingSenderId:"66459706459",appId:"1:66459706459:web:28f99a455652f393da0b7e"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database();
const GPS_WONG={lat:22.416280,lng:114.021977};
const GPS_YUEN={lat:22.445847,lng:114.037022};
const SM=['06:20','06:30','06:40','06:50'];
const SE=['18:15','18:30','18:45','19:00','19:15','19:30','19:45','20:00','20:20'];
const GPS_R=80,AW=15*60*1000,AT=5*60*1000,LS=7,LE=18;
function toast(m,d=3000){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),d);}
function now(){return Date.now();}
function getToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isWeekday(){const d=new Date().getDay();return d>=1&&d<=5;}
function dist(a,b,c,d){const R=6371000,dl=(c-a)*Math.PI/180,dn=(d-b)*Math.PI/180,x=Math.sin(dl/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dn/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function getShiftTime(d,t){const[h,m]=t.split(':').map(Number);const x=new Date(d+'T00:00:00');x.setHours(h,m,0,0);return x.getTime();}
function getSid(d,t){return d+'_'+t.replace(':','');}
function getDir(t){return parseInt(t.split(':')[0])<12?'morning':'evening';}
function getGPS(t){return getDir(t)==='morning'?GPS_WONG:GPS_YUEN;}
function getOrig(t){return getDir(t)==='morning'?'大棠黃泥墩':'元朗港鐵站 H 出口';}
function getOrigL(t){return getDir(t)==='morning'?'🌅 大棠黃泥墩開出':'🌆 元朗港鐵站 H 出口開出';}
function getDest(t){return getDir(t)==='morning'?'元朗港鐵站 H 出口':'大棠黃泥墩';}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function isLoopHour(){const h=new Date().getHours();return isWeekday()&&h>=LS&&h<LE;}
const DL={
async getDriver(id){const s=await db.ref('drivers').orderByChild('identifier').equalTo(id).once('value');if(!s.exists())return null;let d=null;s.forEach(c=>{d={key:c.key,...c.val()};});return d;},
async getActiveBuses(){const s=await db.ref('van/active_buses').once('value');const all=s.val()||{},n=now(),r=[];Object.entries(all).forEach(([p,b])=>{if(b&&b.isActive&&(n-(b.lastUpdate||0)<AT))r.push({plate:p,...b});});return r;},
async getBookings(d){const s=await db.ref('booking/'+d).once('value');return s.val()||{};},
async addBooking(d,b){const r=db.ref('booking/'+d).push();b.id=r.key;b.createdAt=now();await r.set(b);return b;},
async updateBooking(d,i,p){return db.ref('booking/'+d+'/'+i).update(p);},
async cancelBooking(d,i){return DL.updateBooking(d,i,{status:'cancelled',cancelledAt:now()});},
async getPassenger(p){const s=await db.ref('booking_passengers/'+p).once('value');return s.val();},
async savePassenger(p,d){return db.ref('booking_passengers/'+p).update(d);},
async getSeatConfig(d,t){const s=await db.ref('booking_seats/'+d+'/'+t.replace(':','')).once('value');return s.val();},
async getAllSeatConfigs(d){const s=await db.ref('booking_seats/'+d).once('value');return s.val()||{};},
async getLoopQueue(d){const s=await db.ref('booking_loop/'+d).once('value');return s.val()||{};},
async addLoopQueue(d,i){const r=db.ref('booking_loop/'+d).push();i.id=r.key;i.createdAt=now();await r.set(i);return i;},
async updateLoopQueue(d,i,p){return db.ref('booking_loop/'+d+'/'+i).update(p);},
async removeLoopQueue(d,i){return db.ref('booking_loop/'+d+'/'+i).remove();}
};
let currentDriver=null,currentPassenger=null,currentScreen='home';
let driverListeners=[];
let driverBookingListener=null,driverLoopListener=null,driverListenerDate=null;
let currentCachedBookings={},driverKnownBookingIds=new Set(),driverKnownLoopIds=new Set();
let driverFirstLoad=true,loopFirstLoad=true,waitingRoomListener=null,gpsWatchId=null,gpsMarkedBookingId=null;
let loopPassengerRef=null,loopPassengerHandler=null;
function saveDriverSession(d){try{localStorage.setItem('booking_driver',JSON.stringify(d));}catch(e){}}
function loadDriverSession(){try{const r=localStorage.getItem('booking_driver');return r?JSON.parse(r):null;}catch(e){return null;}}
function clearDriverSession(){try{localStorage.removeItem('booking_driver');}catch(e){}}
function savePassengerSession(p){try{localStorage.setItem('booking_passenger',JSON.stringify(p));}catch(e){}}
function loadPassengerSession(){try{const r=localStorage.getItem('booking_passenger');return r?JSON.parse(r):null;}catch(e){return null;}}
function clearPassengerSession(){try{localStorage.removeItem('booking_passenger');}catch(e){}}
function saveSelectedBus(p){try{localStorage.setItem('booking_selected_bus',p);}catch(e){}}
function loadSelectedBus(){try{return localStorage.getItem('booking_selected_bus');}catch(e){return null;}}
function clearSelectedBus(){try{localStorage.removeItem('booking_selected_bus');}catch(e){}}
async function ensureAuth(){if(auth.currentUser)return auth.currentUser;const r=await auth.signInAnonymously();return r.user;}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');currentScreen=id.replace('screen-','');}
function navTo(m){document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));event.target.closest('.nav-item').classList.add('active');openModule(m);}
function openModule(m){document.getElementById('bottom-nav').style.display='flex';if(m==='home'){showScreen('screen-home');updateHomeStats();}else if(m==='booking'){showScreen('screen-booking');renderPassengerHome();}else if(m==='driver'){showScreen('screen-driver');renderDriverHome();}else if(m==='admin'){showScreen('screen-admin');renderAdmin();}else if(m==='info'){showScreen('screen-info');renderInfo();}}
async function updateHomeStats(){try{const t=getToday(),b=await DL.getBookings(t);let p=0,c=0;Object.values(b).forEach(x=>{if(x.status==='pending')p++;if(x.status==='reserved'||x.status==='arrived'||x.status==='boarded')c++;});const l=await DL.getLoopQueue(t);let lc=0;Object.values(l).forEach(x=>{if(x.status==='waiting')lc++;});document.getElementById('home-pending').textContent=p;document.getElementById('home-confirmed').textContent=c;document.getElementById('home-loop').textContent=lc;}catch(e){}}
async function renderPassengerHome(){const c=document.getElementById('booking-content');if(waitingRoomListener){try{waitingRoomListener.off();}catch(e){}waitingRoomListener=null;}if(!currentPassenger)currentPassenger=loadPassengerSession();if(!currentPassenger){renderPassengerLogin(c);return;}try{const pd=await DL.getPassenger(currentPassenger.phone)||{};const cs=pd.creditScore!=null?pd.creditScore:100;const su=pd.suspendedUntil||0;const t=getToday();if(!isWeekday()){c.innerHTML='<div class="card"><div class="card-title">📅 今日不設留座</div><div style="font-size:13px;color:#64748b;line-height:1.8;">星期六、日及公眾假期採循環線運作，不設留座。</div></div><button class="btn btn-outline" onclick="passengerLogout()">登出</button>';return;}if(su>now()){const r=Math.ceil((su-now())/(24*60*60*1000));c.innerHTML='<div class="card" style="border-color:#ef4444;background:#450a0a;"><div style="font-size:14px;font-weight:600;color:#f87171;">⛔ 預約資格已暫停</div><div style="font-size:12px;color:#fca5a5;margin-top:6px;">剩餘 '+r+' 日。</div></div><button class="btn btn-outline" onclick="passengerLogout()">登出</button>';return;}let h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:15px;font-weight:600;">👤 '+esc(pd.name||currentPassenger.name)+'</div><div style="font-size:12px;color:#64748b;margin-top:2px;">'+esc(currentPassenger.phone)+'</div></div><div style="text-align:right;"><div style="font-size:20px;font-weight:700;color:'+(cs>=80?'#22c55e':cs>=50?'#f59e0b':'#ef4444')+';">'+cs+'</div><div style="font-size:10px;color:#64748b;">信用分</div></div></div></div>';const tb=await DL.getBookings(t);const sc=await DL.getAllSeatConfigs(t);h+='<div class="card-title" style="margin-bottom:10px;">🌅 早上固定班次 · 大棠黃泥墩開出</div>';for(const tm of SM)h+=renderShiftCard(t,tm,tb,sc);if(isLoopHour()){h+='<div class="loop-card"><div class="title">🔄 循環線候補（即時排隊）</div><div class="sub">而家係循環線時段（07:00 - 18:00）<br>冇固定班次，留名後到站排隊，有位就上</div></div><div id="loop-section"></div>';}h+='<div class="card-title" style="margin:16px 0 10px;">🌆 傍晚固定班次 · 元朗港鐵站 H 出口開出</div>';for(const tm of SE)h+=renderShiftCard(t,tm,tb,sc);const mb=Object.values(tb).filter(b=>b.passengerPhone===currentPassenger.phone&&b.status!=='cancelled'&&b.status!=='rejected');if(mb.length>0){h+='<div class="card-title" style="margin:16px 0 10px;">🎫 我的固定班次預約</div>';mb.sort((a,b)=>a.time.localeCompare(b.time));mb.forEach(b=>{const m={'pending':{text:'⏳ 等待司機確認',color:'#fdba74',border:'#fb923c'},'reserved':{text:'✅ 已確認留位',color:'#4ade80',border:'#22c55e'},'arrived':{text:'✅ 已到站',color:'#4ade80',border:'#22c55e'},'boarded':{text:'🚐 已上車',color:'#7dd3fc',border:'#38bdf8'},'no-show':{text:'❌ 未到站',color:'#f87171',border:'#ef4444'}};const s=m[b.status]||{text:b.status,color:'#94a3b8',border:'#334155'};h+='<div class="card" style="padding:12px;border-color:'+s.border+';cursor:pointer;" onclick="openWaitingRoom(\''+b.id+'\',\''+b.date+'\',\''+b.time+'\')"><div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:15px;font-weight:600;">'+esc(b.time)+' 班次</div><div style="font-size:12px;color:#64748b;">'+esc(getOrig(b.time))+' · '+b.seats+' 人</div></div><div style="font-size:13px;color:'+s.color+';font-weight:700;">'+s.text+'</div></div></div>';});}h+='<button class="btn btn-outline" style="margin-top:20px;" onclick="passengerLogout()">登出</button>';c.innerHTML=h;if(isLoopHour())loadLoopSection();}catch(e){c.innerHTML='<div class="card" style="border-color:#ef4444;"><div style="color:#f87171;">⚠️ '+esc(e.message)+'</div></div><button class="btn btn-primary" onclick="renderPassengerHome()">🔄 重試</button>';}}
async function loadLoopSection(){const s=document.getElementById('loop-section');if(!s)return;s.innerHTML='<div class="card" style="text-align:center;color:#64748b;padding:20px;">🔄 載入中...</div>';const t=getToday();if(loopPassengerRef&&loopPassengerHandler){try{loopPassengerRef.off('value',loopPassengerHandler);}catch(e){}loopPassengerRef=null;loopPassengerHandler=null;}const r=db.ref('booking_loop/'+t);const h=(snap)=>{const all=snap.val()||{};const my=Object.values(all).find(x=>x.phone===currentPassenger.phone&&x.status==='waiting');const wc=Object.values(all).filter(x=>x.status==='waiting').length;const el=document.getElementById('loop-section');if(!el)return;if(my){const pos=Object.values(all).filter(x=>x.status==='waiting').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).findIndex(x=>x.id===my.id)+1;el.innerHTML='<div class="loop-card" style="background:linear-gradient(135deg,#052e16,#065f46);border-color:#22c55e;"><div class="title" style="color:#4ade80;">✅ 已排隊，等待上車</div><div class="sub" style="color:#86efac;">你嘅排隊位置：第 <strong style="font-size:24px;color:#4ade80;">'+pos+'</strong> 位<br>前面仲有 '+(pos-1)+' 位乘客<br>到站後司機叫名上車</div><button class="btn btn-danger" style="margin-top:12px;" onclick="loopCancel()">取消排隊</button></div>';}else{el.innerHTML='<div class="loop-card"><div class="title" style="color:#7dd3fc;">🔄 立即排隊留名</div><div class="sub" style="color:#bae6fd;">而家候補人數：<strong>'+wc+'</strong> 人<br>撳下面按鈕排隊，到站後司機叫名上車</div><button class="btn btn-primary" style="margin-top:12px;" onclick="loopJoin()">✅ 立即排隊</button></div>';}};r.on('value',h);loopPassengerRef=r;loopPassengerHandler=h;}
async function loopJoin(){try{await ensureAuth();const t=getToday();const all=await DL.getLoopQueue(t);const ex=Object.values(all).find(x=>x.phone===currentPassenger.phone&&x.status==='waiting');if(ex){toast('⚠️ 你已經排咗隊');return;}const pd=await DL.getPassenger(currentPassenger.phone)||{};const cs=pd.creditScore!=null?pd.creditScore:100;if(cs<50){toast('⚠️ 信用分不足');return;}await DL.addLoopQueue(t,{phone:currentPassenger.phone,name:pd.name||currentPassenger.name,seats:1,status:'waiting',date:t});toast('✅ 已排隊，等待上車',3000);}catch(e){toast('❌ 排隊失敗：'+e.message);}}
async function loopCancel(){if(!confirm('確定取消排隊？'))return;try{const t=getToday();const all=await DL.getLoopQueue(t);const my=Object.values(all).find(x=>x.phone===currentPassenger.phone&&x.status==='waiting');if(my)await DL.removeLoopQueue(t,my.id);toast('已取消排隊');}catch(e){toast('取消失敗：'+e.message);}}
function renderShiftCard(d,t,ab,sc){const sid=getSid(d,t);const cfg=sc[t.replace(':','')];const dir=getDir(t);if(!cfg||!cfg.seats){return '<div class="shift-card full" style="opacity:.4;"><div><div class="shift-time">'+esc(t)+'</div><div class="shift-info '+(dir==='morning'?'morning':'evening')+'">'+esc(getOrigL(t))+'</div><div style="margin-top:6px;"><span class="badge badge-red">未開放</span></div></div><div class="shift-seats"><div class="num zero">—</div><div class="label">未開放</div></div></div>';}const quota=cfg.quota||cfg.seats;const used=Object.values(ab).filter(b=>b.scheduleId===sid&&['pending','reserved','arrived','boarded'].includes(b.status)).reduce((s,b)=>s+(b.seats||0),0);const rem=quota-used;const full=rem<=0;const my=Object.values(ab).find(b=>b.scheduleId===sid&&b.passengerPhone===currentPassenger.phone&&b.status!=='cancelled'&&b.status!=='rejected'&&b.status!=='no-show');let bg='';if(my){if(my.status==='pending')bg='<span class="badge badge-orange">⏳ 等待司機確認</span>';else if(my.status==='reserved')bg='<span class="badge badge-yellow">✅ 已確認</span>';else if(my.status==='arrived')bg='<span class="badge badge-green">已到站</span>';else if(my.status==='boarded')bg='<span class="badge badge-blue">已上車</span>';}const clk=!full||my;return '<div class="shift-card '+(full&&!my?'full':'')+'" '+(clk?'onclick="selectShift(\''+d+'\',\''+t+'\')"':'')+'><div><div class="shift-time">'+esc(t)+'</div><div class="shift-info '+(dir==='morning'?'morning':'evening')+'">'+esc(getOrigL(t))+'</div>'+(bg?'<div style="margin-top:6px;">'+bg+'</div>':'')+'<div style="font-size:10px;color:#64748b;margin-top:4px;">留位額：'+quota+' 個</div></div><div class="shift-seats"><div class="num '+(rem<=0?'zero':rem<=2?'low':'')+'">'+rem+'</div><div class="label">剩餘留位</div></div></div>';}
function renderPassengerLogin(c){c.innerHTML='<div class="card"><div class="card-title">📱 輸入電話號碼開始預約</div><div class="input-group"><label>電話號碼（8 位數字）</label><input type="tel" id="login-phone" placeholder="例如：91234567" maxlength="8" inputmode="numeric"></div><div class="input-group"><label>姓名</label><input type="text" id="login-name" placeholder="例如：陳先生" maxlength="20"></div><button class="btn btn-primary" id="passenger-login-btn" onclick="passengerLogin()">確認</button></div>';}
async function passengerLogin(){const btn=document.getElementById('passenger-login-btn');if(btn){btn.disabled=true;btn.textContent='處理中...';}const phone=document.getElementById('login-phone').value.trim();const name=document.getElementById('login-name').value.trim();if(!/^\d{8}$/.test(phone)){toast('請輸入 8 位數字');if(btn){btn.disabled=false;btn.textContent='確認';}return;}if(!name||name.length>20){toast('請輸入姓名（20 字內）');if(btn){btn.disabled=false;btn.textContent='確認';}return;}try{await ensureAuth();const ex=await DL.getPassenger(phone)||{};if(ex.suspendedUntil&&ex.suspendedUntil>now()){const r=Math.ceil((ex.suspendedUntil-now())/(24*60*60*1000));toast('預約資格暫停中，剩餘 '+r+' 日');if(btn){btn.disabled=false;btn.textContent='確認';}return;}await DL.savePassenger(phone,{name,phone,creditScore:ex.creditScore!=null?ex.creditScore:100,totalBookings:ex.totalBookings||0,totalNoShows:ex.totalNoShows||0,lastLogin:now()});currentPassenger={phone,name};savePassengerSession(currentPassenger);toast('✅ 登入成功');renderPassengerHome();}catch(e){toast('❌ '+e.message,5000);if(btn){btn.disabled=false;btn.textContent='確認';}}}
function passengerLogout(){currentPassenger=null;clearPassengerSession();stopGPS();if(waitingRoomListener){try{waitingRoomListener.off();}catch(e){}waitingRoomListener=null;}if(loopPassengerRef&&loopPassengerHandler){try{loopPassengerRef.off('value',loopPassengerHandler);}catch(e){}loopPassengerRef=null;loopPassengerHandler=null;}renderPassengerHome();}
async function selectShift(d,t){const c=document.getElementById('booking-content');try{const cfg=await DL.getSeatConfig(d,t);if(!cfg||!cfg.seats){toast('此班次未開放預約');return;}const quota=cfg.quota||cfg.seats;const tb=await DL.getBookings(d);const sid=getSid(d,t);const used=Object.values(tb).filter(b=>b.scheduleId===sid&&['pending','reserved','arrived','boarded'].includes(b.status)).reduce((s,b)=>s+(b.seats||0),0);const rem=quota-used;const my=Object.values(tb).find(b=>b.scheduleId===sid&&b.passengerPhone===currentPassenger.phone&&b.status!=='cancelled'&&b.status!=='rejected'&&b.status!=='no-show');if(my){toast('你已經預約咗呢個班次');return;}const pd=await DL.getPassenger(currentPassenger.phone)||{};c.innerHTML='<div style="display:flex;align-items:center;margin-bottom:16px;"><button class="btn btn-outline btn-sm" onclick="renderPassengerHome()">← 返回</button></div><div class="card"><div class="card-title">🚐 預約班次</div><div style="font-size:28px;font-weight:700;color:#38bdf8;">'+esc(t)+'</div><div style="font-size:13px;color:#64748b;margin-top:4px;">'+esc(d)+'</div><div style="font-size:13px;margin-top:6px;font-weight:600;color:'+(getDir(t)==='morning'?'#4ade80':'#fdba74')+';">'+esc(getOrigL(t))+'</div><div style="font-size:13px;color:#94a3b8;margin-top:4px;">→ '+esc(getDest(t))+'</div><div style="font-size:13px;color:#22c55e;margin-top:8px;">剩餘留位額：'+rem+' 個（總共 '+quota+'）</div></div><div class="card"><div class="input-group"><label>姓名</label><input type="text" id="book-name" value="'+esc(pd.name||currentPassenger.name)+'" maxlength="20"></div><div class="input-group"><label>人數</label><select id="book-seats"><option value="1">1 人</option><option value="2">2 人</option></select></div><button class="btn btn-primary" id="confirm-booking-btn" onclick="confirmBooking(\''+d+'\',\''+t+'\')">送出預約（待司機確認）</button><div style="font-size:12px;color:#94a3b8;margin-top:10px;text-align:center;line-height:1.6;">⚠️ 送出後需要司機確認<br>司機確認後才作實留位</div></div>';}catch(e){toast('載入失敗：'+e.message);}}
async function confirmBooking(d,t){const btn=document.getElementById('confirm-booking-btn');if(btn){btn.disabled=true;btn.textContent='處理中...';}const name=document.getElementById('book-name').value.trim();const seats=parseInt(document.getElementById('book-seats').value);if(!name||name.length>20){toast('請輸入姓名');if(btn){btn.disabled=false;btn.textContent='送出預約';}return;}try{await ensureAuth();const cfg=await DL.getSeatConfig(d,t);if(!cfg||!cfg.seats)throw new Error('此班次未開放');const quota=cfg.quota||cfg.seats;const tb=await DL.getBookings(d);const sid=getSid(d,t);const used=Object.values(tb).filter(b=>b.scheduleId===sid&&['pending','reserved','arrived','boarded'].includes(b.status)).reduce((s,b)=>s+(b.seats||0),0);if(used+seats>quota)throw new Error('剩餘留位額不足');const b={scheduleId:sid,date:d,time:t,passengerName:name,passengerPhone:currentPassenger.phone,seats,status:'pending',direction:getDir(t)};const sv=await DL.addBooking(d,b);try{const pd=await DL.getPassenger(currentPassenger.phone)||{};await DL.savePassenger(currentPassenger.phone,{totalBookings:(pd.totalBookings||0)+1,lastBooking:now()});}catch(e){}toast('✅ 已送出，等待司機確認',3000);openWaitingRoom(sv.id,d,t);}catch(e){toast('❌ '+e.message,5000);if(btn){btn.disabled=false;btn.textContent='送出預約';}}}
function openWaitingRoom(id,d,t){renderWaitingRoom(id,d,t);}
async function renderWaitingRoom(id,d,t){if(waitingRoomListener){try{waitingRoomListener.off();}catch(e){}waitingRoomListener=null;}const r=db.ref('booking/'+d+'/'+id);const h=(snap)=>{const b=snap.val();if(!b){renderPassengerHome();return;}renderWaitingRoomUI(b,d,id);};r.on('value',h);waitingRoomListener=r;const s=await r.once('value');const b=s.val();if(!b){renderPassengerHome();return;}renderWaitingRoomUI(b,d,id);}
function renderWaitingRoomUI(b,d,id){const c=document.getElementById('booking-content');const st=getShiftTime(b.date,b.time);const tu=st-now();let sb='';if(b.status==='pending'){sb='<div class="card" style="border-color:#fb923c;background:#431407;text-align:center;padding:24px;"><div style="font-size:60px;">⏳</div><h2 style="color:#fdba74;font-size:22px;margin:12px 0 8px;">等待司機確認</h2><p style="font-size:14px;color:#fdba74;">你嘅預約已送出<br>司機確認後會即時通知你</p></div>';}else if(b.status==='reserved'){sb='<div class="card" style="border-color:#22c55e;background:#052e16;text-align:center;padding:24px;"><div style="font-size:60px;">✅</div><h2 style="color:#22c55e;font-size:22px;margin:12px 0 8px;">已確認留位！</h2><p style="font-size:14px;color:#86efac;">司機已確認你嘅預約</p></div>';}else if(b.status==='rejected'){sb='<div class="card" style="border-color:#ef4444;background:#450a0a;text-align:center;padding:24px;"><div style="font-size:60px;">❌</div><h2 style="color:#f87171;font-size:22px;margin:12px 0 8px;">預約已被拒絕</h2><p style="font-size:14px;color:#fca5a5;">'+esc(b.rejectReason?'原因：'+b.rejectReason:'司機未能確認')+'</p></div>';}else if(b.status==='arrived'){sb='<div class="card" style="border-color:#22c55e;background:#052e16;text-align:center;padding:24px;"><div style="font-size:60px;">✅</div><h2 style="color:#22c55e;font-size:22px;margin:12px 0 8px;">已確認到站</h2><p style="font-size:14px;color:#86efac;">請在總站等候上車</p></div>';}else if(b.status==='boarded'){sb='<div class="card" style="text-align:center;padding:24px;"><div style="font-size:60px;">🚐</div><h2 style="color:#7dd3fc;font-size:22px;margin:12px 0 8px;">已上車</h2></div>';}else if(b.status==='cancelled'){sb='<div class="card" style="text-align:center;color:#94a3b8;">已取消</div>';}else if(b.status==='no-show'){sb='<div class="card" style="text-align:center;border-color:#ef4444;background:#450a0a;"><div style="color:#f87171;font-weight:600;">❌ 未到站</div></div>';}let h='<div style="display:flex;align-items:center;margin-bottom:16px;"><button class="btn btn-outline btn-sm" onclick="renderPassengerHome()">← 返回</button></div>'+sb+'<div class="card" style="text-align:center;"><div style="font-size:14px;color:#64748b;">預約編號</div><div style="font-size:20px;font-weight:700;color:#38bdf8;letter-spacing:2px;margin:8px 0;">'+esc(b.id.substring(0,8).toUpperCase())+'</div><div style="font-size:13px;color:#94a3b8;">'+esc(b.time)+' 班次 · '+b.seats+' 人</div><div style="font-size:13px;margin-top:6px;font-weight:600;color:'+(getDir(b.time)==='morning'?'#4ade80':'#fdba74')+';">'+esc(getOrigL(b.time))+'</div><div style="font-size:12px;color:#64748b;margin-top:4px;">乘客：'+esc(b.passengerName)+'</div></div>';if(b.status==='reserved'){h+='<div class="card" style="text-align:center;padding:16px;border:2px dashed #f59e0b;background:#422006;" id="gps-box"><div style="font-size:40px;">📍</div><div style="font-size:14px;font-weight:600;" id="gps-text">等待開始定位...</div><div style="font-size:12px;color:#94a3b8;margin-top:4px;" id="gps-sub">發車前 15 分鐘開始追蹤</div></div><div class="card" style="text-align:center;"><div style="font-size:13px;color:#f59e0b;font-weight:600;" id="countdown">距離發車：--:--</div></div>';}if(b.status==='pending'||b.status==='reserved'){h+='<button class="btn btn-outline" onclick="cancelBooking(\''+b.id+'\',\''+b.date+'\')">取消預約</button>';if(b.status==='reserved')h+='<button class="btn btn-primary" style="margin-top:10px;" onclick="renderPassengerHome()">返回主頁</button>';}c.innerHTML=h;if(b.status==='reserved'){updateCountdown(b.date,b.time);if(tu<AW&&tu>-5*60*1000)startGPS(b.id,b.date,b.time);else if(tu>0){const dl=tu-AW;if(dl<24*60*60*1000)setTimeout(()=>{if(document.getElementById('countdown'))checkAndStartGPS(b.id,b.date,b.time);},dl);}}}
async function checkAndStartGPS(id,d,t){try{const b=await DL.getBookings(d);const x=b[id];if(x&&x.status==='reserved')startGPS(id,d,t);}catch(e){}}
function updateCountdown(d,t){const el=document.getElementById('countdown');if(!el)return;const diff=getShiftTime(d,t)-now();if(diff<=0){el.textContent='班次已發車';return;}const m=Math.floor(diff/60000),s=Math.floor((diff%60000)/1000);el.textContent='距離發車：'+m+':'+String(s).padStart(2,'0');setTimeout(()=>{if(document.getElementById('countdown'))updateCountdown(d,t);},1000);}
async function cancelBooking(id,d){if(!confirm('確定取消預約？'))return;try{const b=(await DL.getBookings(d))[id];await DL.cancelBooking(d||getToday(),id);if(b&&b.status==='reserved'){const p=await getPlateForBooking(b);if(p){await db.ref('van/active_buses/'+p+'/passengerCount').transaction(c=>Math.max(0,(c||0)-(b.seats||1)));}}stopGPS();toast('已取消預約');if(waitingRoomListener){try{waitingRoomListener.off();}catch(e){}waitingRoomListener=null;}renderPassengerHome();}catch(e){toast('取消失敗：'+e.message);}}
async function getPlateForBooking(b){try{const c=await DL.getSeatConfig(b.date,b.time);return c&&c.plate?c.plate:null;}catch(e){return null;}}
function startGPS(id,d,t){if(!navigator.geolocation){const x=document.getElementById('gps-text');if(x)x.textContent='不支援 GPS';return;}const g=getGPS(t);const gt=document.getElementById('gps-text'),gs=document.getElementById('gps-sub');if(gt)gt.textContent='正在定位...';if(gs)gs.textContent='目標：'+getOrig(t);stopGPS();gpsWatchId=navigator.geolocation.watchPosition(async(pos)=>{const dd=dist(pos.coords.latitude,pos.coords.longitude,g.lat,g.lng);const box=document.getElementById('gps-box'),text=document.getElementById('gps-text'),sub=document.getElementById('gps-sub');if(!box||!text||!sub)return;if(dd<=GPS_R){box.style.borderColor='#22c55e';box.style.background='#052e16';text.textContent='✅ 已到站！';sub.textContent='距離 '+Math.round(dd)+' 米';if(gpsMarkedBookingId!==id){gpsMarkedBookingId=id;await markArrived(id,d);}}else{text.textContent='⏳ 未到站';sub.textContent='距離 '+Math.round(dd)+' 米（需進入 '+GPS_R+' 米範圍）';}},(err)=>{const x=document.getElementById('gps-text');if(x)x.textContent='GPS 錯誤：'+err.message;},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});}
function stopGPS(){if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}}
async function markArrived(id,d){try{const b=await DL.getBookings(d);const x=b[id];if(!x||x.status!=='reserved')return;await DL.updateBooking(d,id,{status:'arrived',arrivedAt:now()});stopGPS();toast('✅ 已確認到站！');}catch(e){}}

function clearDriverListeners(){driverListeners.forEach(({ref,handler})=>{try{ref.off('value',handler);}catch(e){}});driverListeners=[];if(driverBookingListener&&driverListenerDate){try{db.ref('booking/'+driverListenerDate).off('value',driverBookingListener);}catch(e){}driverBookingListener=null;}if(driverLoopListener&&driverListenerDate){try{db.ref('booking_loop/'+driverListenerDate).off('value',driverLoopListener);}catch(e){}driverLoopListener=null;}driverListenerDate=null;}
async function renderDriverHome(){const c=document.getElementById('driver-content');clearDriverListeners();try{await ensureAuth();const ab=await DL.getActiveBuses();if(ab.length===0){clearSelectedBus();currentDriver=null;c.innerHTML='<div class="waiting-big"><div class="icon">🚐</div><h3>等待當值中...</h3><p>請先喺「西鐵小巴系統」開始當值。<br>開始當值後，呢個頁面會自動顯示你嘅車牌同預約名單。</p></div>';const r=db.ref('van/active_buses');const h=()=>{if(currentScreen==='driver')renderDriverHome();};r.on('value',h);driverListeners.push({ref:r,handler:h});return;}if(ab.length===1){currentDriver={plate:ab[0].plate,carSeats:ab[0].carSeats||16};saveSelectedBus(currentDriver.plate);renderDriverDuty();return;}const sv=loadSelectedBus();if(sv&&ab.find(b=>b.plate===sv)){const bus=ab.find(b=>b.plate===sv);currentDriver={plate:bus.plate,carSeats:bus.carSeats||16};renderDriverDuty();return;}let h='<div class="card"><div class="card-title">🚐 而家有 '+ab.length+' 部車當值中</div><div style="font-size:13px;color:#94a3b8;">請揀你揸緊嗰部車：</div></div>';ab.forEach(bus=>{h+='<div class="bus-pick" onclick="pickBus(\''+esc(bus.plate)+'\')"><div><div class="plate">'+esc(bus.plate)+'</div><div class="info">'+(bus.carSeats||16)+' 座 · '+esc(bus.currentStation||'未知位置')+'</div></div><div class="arrow">›</div></div>';});c.innerHTML=h;}catch(e){c.innerHTML='<div class="card" style="border-color:#ef4444;"><div style="color:#f87171;">⚠️ '+esc(e.message)+'</div></div><button class="btn btn-primary" onclick="renderDriverHome()">🔄 重試</button>';}}
function pickBus(p){saveSelectedBus(p);renderDriverHome();}
async function renderDriverDuty(){const c=document.getElementById('driver-content');const bus=currentDriver;if(!bus){renderDriverHome();return;}const t=getToday();c.innerHTML='<div class="driver-top" id="driver-top-card"><div class="plate">'+esc(bus.plate)+'</div><div class="seats">'+(bus.carSeats||16)+' 座</div><div class="status">🟢 當值中 · 實時同步</div><div class="driver-info-grid" id="driver-info-grid"></div></div><div id="alert-area"></div><div style="display:flex;gap:8px;margin-bottom:12px;"><button class="btn btn-primary" id="tab-btn-fixed" onclick="switchDriverTab(\'fixed\')" style="padding:12px;font-size:14px;">📋 固定班次</button><button class="btn btn-outline" id="tab-btn-loop" onclick="switchDriverTab(\'loop\')" style="padding:12px;font-size:14px;">🔄 循環線</button></div><div id="driver-tab-fixed"></div><div id="driver-tab-loop" style="display:none;"></div>';const br=db.ref('van/active_buses/'+bus.plate);const brH=(snap)=>{const d=snap.val();if(!d||!d.isActive){toast('🔴 西鐵小巴已停止當值');clearSelectedBus();currentDriver=null;renderDriverHome();return;}if(d.carSeats)currentDriver.carSeats=d.carSeats;updateDriverInfoGrid(d);};br.on('value',brH);driverListeners.push({ref:br,handler:brH});switchDriverTab('fixed');}
function updateDriverInfoGrid(d){const g=document.getElementById('driver-info-grid');if(!g)return;const p=d.passengerCount||0;const s=d.carSeats||16;const f=p>=s;const o=p>s;const col=o?'#ef4444':f?'#f59e0b':'#22c55e';g.innerHTML='<div class="cell"><div class="num" style="color:'+col+';">'+p+'</div><div class="lbl">目前乘客</div></div><div class="cell"><div class="num" style="color:#22c55e;">'+(s-p)+'</div><div class="lbl">剩餘座位</div></div><div class="cell"><div class="num" style="color:#fdba74;">'+s+'</div><div class="lbl">總座位</div></div>';}
function switchDriverTab(t){const bf=document.getElementById('tab-btn-fixed'),bl=document.getElementById('tab-btn-loop'),df=document.getElementById('driver-tab-fixed'),dl=document.getElementById('driver-tab-loop');if(!bf||!bl)return;if(t==='fixed'){bf.className='btn btn-primary';bl.className='btn btn-outline';df.style.display='block';dl.style.display='none';renderDriverFixedList();}else{bf.className='btn btn-outline';bl.className='btn btn-primary';df.style.display='none';dl.style.display='block';renderDriverLoopList();}}
async function renderDriverFixedList(){const c=document.getElementById('driver-tab-fixed');if(!c)return;c.innerHTML='<div style="text-align:center;color:#64748b;padding:20px;">🔄 載入中...</div>';const t=getToday();const allS=[...SM,...SE];const sc=await DL.getAllSeatConfigs(t);const init=await DL.getBookings(t);currentCachedBookings=init;Object.keys(init).forEach(i=>driverKnownBookingIds.add(i));driverFirstLoad=false;renderDriverFixedHTML(init,sc,t,allS);const r=db.ref('booking/'+t);driverListenerDate=t;driverBookingListener=(snap)=>{const ab=snap.val()||{};const nid=new Set(Object.keys(ab));let np=0;if(!driverFirstLoad){nid.forEach(i=>{if(!driverKnownBookingIds.has(i)){const b=ab[i];if(b&&b.status==='pending')np++;}});if(np>0){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.3;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.15);setTimeout(()=>{const o2=ctx.createOscillator(),g2=ctx.createGain();o2.frequency.value=1320;g2.gain.value=.3;o2.connect(g2);g2.connect(ctx.destination);o2.start();o2.stop(ctx.currentTime+.15);},200);}catch(e){}if(navigator.vibrate)navigator.vibrate([300,100,300]);toast('🔔 有 '+np+' 個新預約！',4000);}}driverKnownBookingIds=nid;driverFirstLoad=false;currentCachedBookings=ab;renderDriverFixedHTML(ab,sc,t,allS);};r.on('value',driverBookingListener);}
function renderDriverFixedHTML(ab,sc,t,allS){const c=document.getElementById('driver-tab-fixed'),a=document.getElementById('alert-area');if(!c)return;const bus=currentDriver;if(!bus)return;let mpt=0;allS.forEach(tm=>{const sid=getSid(t,tm);Object.values(ab).forEach(b=>{if(b.scheduleId===sid&&b.status==='pending')mpt++;});});if(a){if(mpt>0){a.innerHTML='<div class="alert-banner"><div class="icon">🔔</div><div class="text">有 '+mpt+' 個新預約！</div><div class="sub">請撳「✅ 確認」或「❌ 拒絕」</div></div>';}else{a.innerHTML='';}}let h='';allS.forEach(tm=>{const sid=getSid(t,tm);const cfg=sc[tm.replace(':','')];const quota=(cfg&&cfg.quota)||(cfg&&cfg.seats)||bus.carSeats||16;const dir=getDir(tm);const sb=Object.values(ab).filter(b=>b.scheduleId===sid&&b.status!=='cancelled');const used=sb.filter(b=>['pending','reserved','arrived','boarded'].includes(b.status)).reduce((s,b)=>s+(b.seats||0),0);const rem=quota-used;const full=rem<=0;const pl=sb.filter(b=>b.status==='pending');const cl=sb.filter(b=>b.status==='reserved');const al=sb.filter(b=>b.status==='arrived'||b.status==='boarded');h+='<div class="big-shift '+(full?'full':'')+'"><div class="time">'+esc(tm)+'</div><div class="origin" style="color:'+(dir==='morning'?'#4ade80':'#fdba74')+';font-weight:700;">'+esc(getOrigL(tm))+'</div><div class="counts"><div><div class="pending-count">⏳ '+pl.length+' 待確認</div><div class="arrived-count" style="margin-top:4px;">🔴 '+al.length+' 已到 · ✅ '+cl.length+' 已確認</div></div><div style="text-align:right;"><div class="seat-num '+(rem<=0?'zero':rem<=2?'low':'')+'">'+rem+'</div><div class="seat-label">剩餘留位額 / '+quota+'</div></div></div>'+(full?'<span class="full-label">🔴 滿座</span>':'')+(pl.length>0?'<div class="pending-box"><div class="pending-title">🔔 待你確認（'+pl.length+'）</div>'+pl.map(b=>'<div class="pending-item"><div class="name">'+esc(b.passengerName)+(b.seats>1?' ×'+b.seats:'')+'</div><div class="phone">'+esc(b.passengerPhone)+'</div><div class="actions"><button class="btn-confirm" onclick="driverConfirm(\''+b.date+'\',\''+b.id+'\',\''+esc(bus.plate)+'\')">✅ 確認</button><button class="btn-reject" onclick="driverReject(\''+b.date+'\',\''+b.id+'\',\''+esc(bus.plate)+'\')">❌ 拒絕</button></div></div>').join('')+'</div>':'')+(cl.length>0?'<div style="margin-top:12px;"><div style="font-size:13px;color:#4ade80;font-weight:700;margin-bottom:6px;">✅ 已確認留位（'+cl.length+'）</div>'+cl.map(b=>'<div class="booking-item arrived"><div><div class="booking-name">'+esc(b.passengerName)+(b.seats>1?' ×'+b.seats:'')+'</div><div class="booking-phone">'+esc(b.passengerPhone)+'</div></div><div style="font-size:12px;color:#4ade80;">已確認</div></div>').join('')+'</div>':'')+(al.length>0?'<div style="margin-top:12px;"><div style="font-size:13px;color:#22c55e;font-weight:700;margin-bottom:6px;">🔴 已到站（'+al.length+'）</div>'+al.map(b=>'<div class="booking-item arrived"><div><div class="booking-name">'+esc(b.passengerName)+(b.seats>1?' ×'+b.seats:'')+'</div><div class="booking-phone">'+esc(b.passengerPhone)+'</div></div><div>'+(b.status==='boarded'?'<span class="badge badge-blue">已上車</span>':'<button class="btn btn-success btn-sm" onclick="markBoarded(\''+b.date+'\',\''+b.id+'\')">上車</button>')+'</div></div>').join('')+'</div>':'')+'</div>';});c.innerHTML=h;}
async function renderDriverLoopList(){const c=document.getElementById('driver-tab-loop');if(!c)return;c.innerHTML='<div style="text-align:center;color:#64748b;padding:20px;">🔄 載入中...</div>';const t=getToday();if(driverLoopListener&&driverListenerDate){try{db.ref('booking_loop/'+driverListenerDate).off('value',driverLoopListener);}catch(e){}}const init=await DL.getLoopQueue(t);Object.keys(init).forEach(i=>driverKnownLoopIds.add(i));loopFirstLoad=false;renderDriverLoopHTML(init);const r=db.ref('booking_loop/'+t);driverLoopListener=(snap)=>{const all=snap.val()||{};const nid=new Set(Object.keys(all));let nw=0;if(!loopFirstLoad){nid.forEach(i=>{if(!driverKnownLoopIds.has(i)){const x=all[i];if(x&&x.status==='waiting')nw++;}});if(nw>0){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=660;g.gain.value=.3;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.2);}catch(e){}if(navigator.vibrate)navigator.vibrate([300,100,300]);toast('🔄 有 '+nw+' 位循環線乘客！',4000);}}driverKnownLoopIds=nid;loopFirstLoad=false;renderDriverLoopHTML(all);};r.on('value',driverLoopListener);}
function renderDriverLoopHTML(all){const c=document.getElementById('driver-tab-loop');if(!c)return;const bus=currentDriver;if(!bus)return;const wl=Object.values(all).filter(x=>x.status==='waiting').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));const bl=Object.values(all).filter(x=>x.status==='boarded').sort((a,b)=>(b.boardedAt||0)-(a.boardedAt||0)).slice(0,10);let h='<div class="loop-card"><div class="title">🔄 循環線候補名單</div><div class="sub">而家候補人數：<strong style="font-size:20px;color:#7dd3fc;">'+wl.length+'</strong> 人<br>到站後按「已上車」</div></div>';if(wl.length===0){h+='<div class="waiting-big"><div class="icon">🔄</div><h3>暫時冇乘客候補</h3><p>循環線時段（07:00 - 18:00）<br>乘客排隊後會即時顯示</p></div>';}else{h+='<div class="card-title" style="margin-bottom:8px;">📋 候補名單（按排隊次序）</div>';wl.forEach((x,i)=>{h+='<div class="loop-wait"><div style="display:flex;justify-content:space-between;align-items:center;"><div><div class="name">#'+(i+1)+' '+esc(x.name)+'</div><div class="phone">'+esc(x.phone)+'</div></div></div><div class="actions"><button class="btn-board" onclick="driverBoardLoop(\''+x.id+'\')">✅ 已上車</button><button class="btn-cancel" onclick="driverCancelLoop(\''+x.id+'\')">❌ 取消</button></div></div>';});}if(bl.length>0){h+='<div class="card-title" style="margin:16px 0 8px;">✅ 最近已上車（'+bl.length+'）</div>';bl.forEach(x=>{h+='<div class="booking-item arrived"><div><div class="booking-name">'+esc(x.name)+'</div><div class="booking-phone">'+esc(x.phone)+'</div></div><div style="font-size:12px;color:#4ade80;">已上車</div></div>';});}c.innerHTML=h;}
async function driverBoardLoop(id){try{const t=getToday();await DL.updateLoopQueue(t,id,{status:'boarded',boardedAt:now()});toast('✅ 已標記上車',2000);}catch(e){toast('操作失敗：'+e.message);}}
async function driverCancelLoop(id){if(!confirm('確定取消呢位乘客嘅候補？'))return;try{const t=getToday();await DL.removeLoopQueue(t,id);toast('❌ 已取消',2000);}catch(e){toast('操作失敗：'+e.message);}}
async function driverConfirm(d,id,p){try{const bs=await DL.getBookings(d);const b=bs[id];if(!b){toast('預約唔存在');return;}await DL.updateBooking(d,id,{status:'reserved',confirmedAt:now(),confirmedBy:p});await db.ref('van/active_buses/'+p+'/passengerCount').transaction(c=>(c||0)+(b.seats||1));toast('✅ 已確認留位',2000);}catch(e){toast('確認失敗：'+e.message);}}
async function driverReject(d,id,p){const r=prompt('拒絕原因（可以留空）：','')||'';try{await DL.updateBooking(d,id,{status:'rejected',rejectedAt:now(),rejectedBy:p,rejectReason:r});toast('❌ 已拒絕',2000);}catch(e){toast('操作失敗：'+e.message);}}
async function markBoarded(d,id){try{await DL.updateBooking(d,id,{status:'boarded',boardedAt:now()});toast('✅ 已確認上車');}catch(e){}}
async function renderAdmin(){const c=document.getElementById('admin-content');const t=getToday();let h='<div class="card"><div class="card-title">⚙️ 系統管理</div><div style="font-size:12px;color:#64748b;line-height:1.8;">留座系統同西鐵小巴自動同步。</div></div>';try{const ab=await DL.getActiveBuses();h+='<div class="card-title" style="margin:16px 0 10px;">🚐 當值中嘅車（'+ab.length+'）</div>';if(ab.length===0)h+='<div class="card" style="text-align:center;color:#64748b;padding:24px;">暫時冇車當值</div>';else ab.forEach(bus=>{const p=bus.passengerCount||0,s=bus.carSeats||16,o=p>s;h+='<div class="card" style="padding:12px;"><div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:18px;font-weight:700;color:#4ade80;">'+esc(bus.plate)+'</div><div style="font-size:12px;color:#64748b;">'+s+' 座 · '+esc(bus.currentStation||'未知')+'</div></div><div style="text-align:right;"><div style="font-size:24px;font-weight:900;color:'+(o?'#ef4444':'#22c55e')+';">'+p+'</div><div style="font-size:10px;color:#64748b;">目前乘客</div></div></div></div>';});const l=await DL.getLoopQueue(t);const wl=Object.values(l).filter(x=>x.status==='waiting').length;const bl=Object.values(l).filter(x=>x.status==='boarded').length;h+='<div class="card-title" style="margin:16px 0 10px;">🔄 循環線候補</div><div class="card" style="padding:14px;"><div style="display:flex;justify-content:space-between;"><div><div style="font-size:12px;color:#64748b;">候補中</div><div style="font-size:24px;font-weight:700;color:#7dd3fc;">'+wl+'</div></div><div style="text-align:right;"><div style="font-size:12px;color:#64748b;">已上車</div><div style="font-size:24px;font-weight:700;color:#4ade80;">'+bl+'</div></div></div></div>';}catch(e){h+='<div class="card" style="color:#f87171;">載入失敗：'+esc(e.message)+'</div>';}c.innerHTML=h;}
function renderInfo(){const c=document.getElementById('info-content');c.innerHTML='<div class="card"><div class="card-title">🚐 服務資訊</div><div style="font-size:13px;line-height:1.8;"><strong style="color:#38bdf8;">路線：</strong>大棠黃泥墩 ↔ 元朗港鐵站 H 出口（途經大棠路）</div></div><div class="card"><div class="card-title">🕐 星期一至五</div><div style="font-size:13px;line-height:1.9;"><strong style="color:#22c55e;">🌅 早上固定班次（大棠黃泥墩開出）：</strong><br>06:20 ｜ 06:30 ｜ 06:40 ｜ 06:50<br><br><strong style="color:#0ea5e9;">🔄 循環線時段（07:00 - 18:00）：</strong><br>無固定班次，可使用「循環線候補」留名排隊<br><br><strong style="color:#fdba74;">🌆 傍晚固定班次（元朗港鐵站 H 出口開出）：</strong><br>18:15 ｜ 18:30 ｜ 18:45 ｜ 19:00 ｜ 19:15<br>19:30 ｜ 19:45 ｜ 20:00 ｜ 20:20（尾班車）</div></div><div class="card"><div class="card-title">💡 留位額點運作？</div><div style="font-size:13px;line-height:1.9;">每班次有固定留位額（由司機當值時設定）<br>乘客確認留位後，留位額自動扣減<br>留位額用晒就唔可以再留位<br>剩餘座位仍然開放俾即場乘客</div></div><div class="card" style="text-align:center;font-size:12px;color:#64748b;">© 浚鍵管理有限公司<br>小巴留座系統 v5.1</div>';}
document.addEventListener('keydown',function(e){if(e.key!=='Enter')return;if(document.getElementById('login-phone'))passengerLogin();});
window.addEventListener('popstate',function(e){if(currentScreen!=='home'){openModule('home');history.pushState(null,'',location.href);}});
db.ref('.info/connected').on('value',snap=>{if(snap.val()===true)console.log('☁️ Firebase 已連線');else console.log('⚠️ Firebase 離線');});
async function autoCleanExpiredBookings(){if(!isWeekday())return;try{const t=getToday();const bs=await DL.getBookings(t);for(const[id,b]of Object.entries(bs)){if(b.status!=='reserved'&&b.status!=='pending')continue;const st=getShiftTime(b.date,b.time);if(now()>st+5*60*1000){await DL.updateBooking(b.date,id,{status:'no-show',noShowAt:now()});if(b.status==='reserved'){const p=await getPlateForBooking(b);if(p){await db.ref('van/active_buses/'+p+'/passengerCount').transaction(c=>Math.max(0,(c||0)-(b.seats||1)));}}const pd=await DL.getPassenger(b.passengerPhone)||{};const ns=Math.max(0,(pd.creditScore!=null?pd.creditScore:100)-20);const patch={creditScore:ns,totalNoShows:(pd.totalNoShows||0)+1};if(ns<30)patch.suspendedUntil=now()+30*24*60*60*1000;else if(ns<60)patch.suspendedUntil=now()+7*24*60*60*1000;await DL.savePassenger(b.passengerPhone,patch);}}const l=await DL.getLoopQueue(t);for(const[id,x]of Object.entries(l)){if(x.status==='waiting'&&now()-(x.createdAt||0)>4*60*60*1000){await DL.removeLoopQueue(t,id);}}}catch(e){}}
(async function init(){console.log('🚐 浚鍵管理有限公司 · 小巴留座系統 v5.1 啟動');currentPassenger=loadPassengerSession();try{await ensureAuth();}catch(e){console.warn(e);}updateHomeStats();setInterval(autoCleanExpiredBookings,60*1000);setTimeout(autoCleanExpiredBookings,5000);setInterval(()=>{if(currentScreen==='home')updateHomeStats();},30*1000);history.pushState(null,'',location.href);})();
</script>
