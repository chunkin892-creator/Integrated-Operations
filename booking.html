const SHIFTS_MORNING = ['06:20', '06:30', '06:40', '06:50'];
const SHIFTS_EVENING = ['18:15', '18:30', '18:45', '19:00', '19:15', '19:30', '19:45', '20:00', '20:20'];
const GPS_RADIUS = 80;
const ARRIVE_WINDOW = 15 * 60 * 1000;
const ACTIVE_BUS_TIMEOUT = 5 * 60 * 1000;
// 循環線時段（介乎早上同傍晚之間）
const LOOP_START_HOUR = 7;
const LOOP_END_HOUR = 18;

function toast(msg, duration = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._tm);
  el._tm = setTimeout(() => el.classList.remove('show'), duration);
}
function now() { return Date.now(); }
function getToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function isWeekday() { const day = new Date().getDay(); return day >= 1 && day <= 5; }
function distance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function getShiftTime(date, time) {
  const [h, m] = time.split(':').map(Number);
  const d = new Date(date + 'T00:00:00');
  d.setHours(h, m, 0, 0);
  return d.getTime();
}
function getScheduleId(date, time) { return date + '_' + time.replace(':', ''); }
function getShiftDirection(time) { const hour = parseInt(time.split(':')[0]); return hour < 12 ? 'morning' : 'evening'; }
function getShiftGPS(time) { return getShiftDirection(time) === 'morning' ? GPS_WONG : GPS_YUEN; }
function getShiftOrigin(time) { return getShiftDirection(time) === 'morning' ? '大棠黃泥墩' : '元朗港鐵站 H 出口'; }
function getShiftOriginLabel(time) { return getShiftDirection(time) === 'morning' ? '🌅 大棠黃泥墩開出' : '🌆 元朗港鐵站 H 出口開出'; }
function getShiftDestination(time) { return getShiftDirection(time) === 'morning' ? '元朗港鐵站 H 出口' : '大棠黃泥墩'; }
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function isLoopHour() {
  const h = new Date().getHours();
  return isWeekday() && h >= LOOP_START_HOUR && h < LOOP_END_HOUR;
}

const DataLayer = {
  async getDriverByIdentifier(id) {
    const snap = await db.ref('drivers').orderByChild('identifier').equalTo(id).once('value');
    if (!snap.exists()) return null;
    let d = null; snap.forEach(c => { d = { key: c.key, ...c.val() }; });
    return d;
  },
  async getActiveBus(plate) { const snap = await db.ref('van/active_buses/' + plate).once('value'); return snap.val(); },
  async getActiveBuses() {
    const snap = await db.ref('van/active_buses').once('value');
    const all = snap.val() || {};
    const nowTs = now();
    const result = [];
    Object.entries(all).forEach(([plate, b]) => {
      if (b && b.isActive && (nowTs - (b.lastUpdate || 0) < ACTIVE_BUS_TIMEOUT)) result.push({ plate, ...b });
    });
    return result;
  },
  async getBookings(date) { const snap = await db.ref('booking/' + date).once('value'); return snap.val() || {}; },
  async addBooking(date, b) {
    const ref = db.ref('booking/' + date).push();
    b.id = ref.key; b.createdAt = now();
    await ref.set(b); return b;
  },
  async updateBooking(date, id, patch) { return db.ref('booking/' + date + '/' + id).update(patch); },
  async cancelBooking(date, id) { return DataLayer.updateBooking(date, id, { status: 'cancelled', cancelledAt: now() }); },
  async getPassenger(phone) { const snap = await db.ref('booking_passengers/' + phone).once('value'); return snap.val(); },
  async savePassenger(phone, data) { return db.ref('booking_passengers/' + phone).update(data); },
  async getSeatConfig(date, time) { const snap = await db.ref('booking_seats/' + date + '/' + time.replace(':','')).once('value'); return snap.val(); },
  async getAllSeatConfigs(date) { const snap = await db.ref('booking_seats/' + date).once('value'); return snap.val() || {}; },
  // 循環線候補
  async getLoopQueue(date) { const snap = await db.ref('booking_loop/' + date).once('value'); return snap.val() || {}; },
  async addLoopQueue(date, item) {
    const ref = db.ref('booking_loop/' + date).push();
    item.id = ref.key; item.createdAt = now();
    await ref.set(item); return item;
  },
  async updateLoopQueue(date, id, patch) { return db.ref('booking_loop/' + date + '/' + id).update(patch); },
  async removeLoopQueue(date, id) { return db.ref('booking_loop/' + date + '/' + id).remove(); }
};

function saveDriverPlate(id, p) { try { localStorage.setItem('booking_driver_plate_' + id, p); } catch(e) {} }

async function ensureAuth() {
  if (auth.currentUser) return auth.currentUser;
  const r = await auth.signInAnonymously();
  return r.user;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  currentScreen = id.replace('screen-', '');
}
function navTo(m) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event.target.closest('.nav-item').classList.add('active');
  openModule(m);
}
function openModule(m) {
  document.getElementById('bottom-nav').style.display = 'flex';
  if (m === 'home') { showScreen('screen-home'); updateHomeStats(); }
  else if (m === 'booking') { showScreen('screen-booking'); renderPassengerHome(); }
  else if (m === 'driver') { showScreen('screen-driver'); renderDriverHome(); }
  else if (m === 'admin') { showScreen('screen-admin'); renderAdmin(); }
  else if (m === 'info') { showScreen('screen-info'); renderInfo(); }
}

async function updateHomeStats() {
  try {
    const today = getToday();
    const bookings = await DataLayer.getBookings(today);
    let pending = 0, confirmed = 0;
    Object.values(bookings).forEach(b => {
      if (b.status === 'pending') pending++;
      if (b.status === 'reserved' || b.status === 'arrived' || b.status === 'boarded') confirmed++;
    });
    const loop = await DataLayer.getLoopQueue(today);
    let loopCount = 0;
    Object.values(loop).forEach(item => {
      if (item.status === 'waiting') loopCount++;
    });
    document.getElementById('home-pending').textContent = pending;
    document.getElementById('home-confirmed').textContent = confirmed;
    document.getElementById('home-loop').textContent = loopCount;
  } catch(e) {}
}

async function renderPassengerHome() {
  const content = document.getElementById('booking-content');
  if (waitingRoomListener) { try { waitingRoomListener.off(); } catch(e) {} waitingRoomListener = null; }
  if (!currentPassenger) currentPassenger = loadPassengerSession();
  if (!currentPassenger) { renderPassengerLogin(content); return; }

  try {
    const pd = await DataLayer.getPassenger(currentPassenger.phone) || {};
    const creditScore = pd.creditScore != null ? pd.creditScore : 100;
    const suspendedUntil = pd.suspendedUntil || 0;
    const today = getToday();

    if (!isWeekday()) {
      content.innerHTML = `
        <div class="card"><div class="card-title">📅 今日不設留座</div>
        <div style="font-size:13px;color:#64748b;line-height:1.8;">星期六、日及公眾假期採循環線運作，不設留座。乘客可即場上車。</div></div>
        <button class="btn btn-outline" onclick="passengerLogout()">登出</button>`;
      return;
    }

    if (suspendedUntil > now()) {
      const remaining = Math.ceil((suspendedUntil - now()) / (24*60*60*1000));
      content.innerHTML = `
        <div class="card" style="border-color:#ef4444;background:#450a0a;">
          <div style="font-size:14px;font-weight:600;color:#f87171;">⛔ 預約資格已暫停</div>
          <div style="font-size:12px;color:#fca5a5;margin-top:6px;">剩餘 ${remaining} 日。</div>
        </div>
        <button class="btn btn-outline" onclick="passengerLogout()">登出</button>`;
      return;
    }

    let html = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-size:15px;font-weight:600;">👤 ${esc(pd.name || currentPassenger.name)}</div>
            <div style="font-size:12px;color:#64748b;margin-top:2px;">${esc(currentPassenger.phone)}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:20px;font-weight:700;color:${creditScore >= 80 ? '#22c55e' : creditScore >= 50 ? '#f59e0b' : '#ef4444'};">${creditScore}</div>
            <div style="font-size:10px;color:#64748b;">信用分</div>
          </div>
        </div>
      </div>`;

    // 固定班次
    const todayBookings = await DataLayer.getBookings(today);
    const seatConfigs = await DataLayer.getAllSeatConfigs(today);

    html += `<div class="card-title" style="margin-bottom:10px;">🌅 早上固定班次 · 大棠黃泥墩開出</div>`;
    for (const time of SHIFTS_MORNING) html += renderShiftCard(today, time, todayBookings, seatConfigs);

    // 循環線時段
    if (isLoopHour()) {
      html += `
        <div class="loop-card">
          <div class="title">🔄 循環線候補（即時排隊）</div>
          <div class="sub">而家係循環線時段（07:00 - 18:00）<br>冇固定班次，留名後到站排隊，有位就上</div>
        </div>
        <div id="loop-section"></div>
      `;
    }

    html += `<div class="card-title" style="margin:16px 0 10px;">🌆 傍晚固定班次 · 元朗港鐵站 H 出口開出</div>`;
    for (const time of SHIFTS_EVENING) html += renderShiftCard(today, time, todayBookings, seatConfigs);

    // 我的預約（固定班次）
    const myBookings = Object.values(todayBookings).filter(b =>
      b.passengerPhone === currentPassenger.phone && b.status !== 'cancelled' && b.status !== 'rejected'
    );

    if (myBookings.length > 0) {
      html += `<div class="card-title" style="margin:16px 0 10px;">🎫 我的固定班次預約</div>`;
      myBookings.sort((a,b) => a.time.localeCompare(b.time));
      myBookings.forEach(b => {
        const map = {
          'pending': { text: '⏳ 等待司機確認', color: '#fdba74', border: '#fb923c' },
          'reserved': { text: '✅ 已確認留位', color: '#4ade80', border: '#22c55e' },
          'arrived': { text: '✅ 已到站', color: '#4ade80', border: '#22c55e' },
          'boarded': { text: '🚐 已上車', color: '#7dd3fc', border: '#38bdf8' },
          'no-show': { text: '❌ 未到站', color: '#f87171', border: '#ef4444' }
        };
        const s = map[b.status] || { text: b.status, color: '#94a3b8', border: '#334155' };
        html += `
          <div class="card" style="padding:12px;border-color:${s.border};cursor:pointer;" onclick="openWaitingRoom('${b.id}','${b.date}','${b.time}')">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div style="font-size:15px;font-weight:600;">${esc(b.time)} 班次</div>
                <div style="font-size:12px;color:#64748b;">${esc(getShiftOrigin(b.time))} · ${b.seats} 人</div>
              </div>
              <div style="font-size:13px;color:${s.color};font-weight:700;">${s.text}</div>
            </div>
          </div>`;
      });
    }

    html += `<button class="btn btn-outline" style="margin-top:20px;" onclick="passengerLogout()">登出</button>`;
    content.innerHTML = html;

    // 載入循環線候補區
    if (isLoopHour()) loadLoopSection();

  } catch(e) {
    content.innerHTML = `<div class="card" style="border-color:#ef4444;"><div style="color:#f87171;">⚠️ ${esc(e.message)}</div></div>
      <button class="btn btn-primary" onclick="renderPassengerHome()">🔄 重試</button>`;
  }
}

// 循環線候補：乘客端
let loopPassengerRef = null, loopPassengerHandler = null;

async function loadLoopSection() {
  const section = document.getElementById('loop-section');
  if (!section) return;
  section.innerHTML = `<div class="card" style="text-align:center;color:#64748b;padding:20px;">🔄 載入中...</div>`;
  const today = getToday();

  if (loopPassengerRef && loopPassengerHandler) {
    try { loopPassengerRef.off('value', loopPassengerHandler); } catch(e) {}
    loopPassengerRef = null; loopPassengerHandler = null;
  }

  const ref = db.ref('booking_loop/' + today);
  const handler = (snap) => {
    const all = snap.val() || {};
    const myItem = Object.values(all).find(item => item.phone === currentPassenger.phone && item.status === 'waiting');
    const waitingCount = Object.values(all).filter(item => item.status === 'waiting').length;

    const el = document.getElementById('loop-section');
    if (!el) return;

    if (myItem) {
      // 已排隊
      const myPos = Object.values(all)
        .filter(item => item.status === 'waiting')
        .sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0))
        .findIndex(item => item.id === myItem.id) + 1;

      el.innerHTML = `
        <div class="loop-card" style="background:linear-gradient(135deg,#052e16,#065f46);border-color:#22c55e;">
          <div class="title" style="color:#4ade80;">✅ 已排隊，等待上車</div>
          <div class="sub" style="color:#86efac;">
            你嘅排隊位置：第 <strong style="font-size:24px;color:#4ade80;">${myPos}</strong> 位<br>
            前面仲有 ${myPos - 1} 位乘客<br>
            到站後司機叫名上車
          </div>
          <button class="btn btn-danger" style="margin-top:12px;" onclick="loopCancel()">取消排隊</button>
        </div>
      `;
    } else {
      // 未排隊
      el.innerHTML = `
        <div class="loop-card">
          <div class="title" style="color:#7dd3fc;">🔄 立即排隊留名</div>
          <div class="sub" style="color:#bae6fd;">
            而家候補人數：<strong>${waitingCount}</strong> 人<br>
            撳下面按鈕排隊，到站後司機叫名上車
          </div>
          <button class="btn btn-primary" style="margin-top:12px;" onclick="loopJoin()">✅ 立即排隊</button>
        </div>
      `;
    }
  };
  ref.on('value', handler);
  loopPassengerRef = ref;
  loopPassengerHandler = handler;
}

async function loopJoin() {
  try {
    await ensureAuth();
    const today = getToday();
    const all = await DataLayer.getLoopQueue(today);

    // 檢查係咪已經排咗隊
    const existing = Object.values(all).find(item => item.phone === currentPassenger.phone && item.status === 'waiting');
    if (existing) { toast('⚠️ 你已經排咗隊'); return; }

    // 檢查信用分
    const pd = await DataLayer.getPassenger(currentPassenger.phone) || {};
    const creditScore = pd.creditScore != null ? pd.creditScore : 100;
    if (creditScore < 50) {
      toast('⚠️ 信用分不足，暫時唔可以使用循環線候補');
      return;
    }

    await DataLayer.addLoopQueue(today, {
      phone: currentPassenger.phone,
      name: pd.name || currentPassenger.name,
      seats: 1,
      status: 'waiting',
      date: today
    });
    toast('✅ 已排隊，等待上車', 3000);
  } catch(e) {
    console.error('排隊失敗：', e);
    toast('❌ 排隊失敗：' + e.message);
  }
}

async function loopCancel() {
  if (!confirm('確定取消排隊？')) return;
  try {
    const today = getToday();
    const all = await DataLayer.getLoopQueue(today);
    const myItem = Object.values(all).find(item => item.phone === currentPassenger.phone && item.status === 'waiting');
    if (myItem) await DataLayer.removeLoopQueue(today, myItem.id);
    toast('已取消排隊');
  } catch(e) {
    toast('取消失敗：' + e.message);
  }
}

function renderShiftCard(date, time, allBookings, seatConfigs) {
  const scheduleId = getScheduleId(date, time);
  const cfg = seatConfigs[time.replace(':','')];
  const dir = getShiftDirection(time);

  if (!cfg || !cfg.seats) {
    return `
      <div class="shift-card full" style="opacity:0.4;">
        <div>
          <div class="shift-time">${esc(time)}</div>
          <div class="shift-info ${dir === 'morning' ? 'morning' : 'evening'}">${esc(getShiftOriginLabel(time))}</div>
          <div style="margin-top:6px;"><span class="badge badge-red">未開放</span></div>
        </div>
        <div class="shift-seats"><div class="num zero">—</div><div class="label">未開放</div></div>
      </div>`;
  }

  const totalSeats = cfg.seats;
  const bookedSeats = Object.values(allBookings)
    .filter(b => b.scheduleId === scheduleId && ['pending','reserved','arrived','boarded'].includes(b.status))
    .reduce((sum, b) => sum + (b.seats || 0), 0);
  const remaining = totalSeats - bookedSeats;
  const isFull = remaining <= 0;

  const myBooking = Object.values(allBookings).find(b =>
    b.scheduleId === scheduleId && b.passengerPhone === currentPassenger.phone &&
    b.status !== 'cancelled' && b.status !== 'rejected' && b.status !== 'no-show'
  );

  let badge = '';
  if (myBooking) {
    if (myBooking.status === 'pending') badge = '<span class="badge badge-orange">⏳ 等待司機確認</span>';
    else if (myBooking.status === 'reserved') badge = '<span class="badge badge-yellow">✅ 已確認</span>';
    else if (myBooking.status === 'arrived') badge = '<span class="badge badge-green">已到站</span>';
    else if (myBooking.status === 'boarded') badge = '<span class="badge badge-blue">已上車</span>';
  }

  const clickable = (!isFull || myBooking);

  return `
    <div class="shift-card ${isFull && !myBooking ? 'full' : ''}" ${clickable ? `onclick="selectShift('${date}','${time}')"` : ''}>
      <div>
        <div class="shift-time">${esc(time)}</div>
        <div class="shift-info ${dir === 'morning' ? 'morning' : 'evening'}">${esc(getShiftOriginLabel(time))}</div>
        ${badge ? '<div style="margin-top:6px;">' + badge + '</div>' : ''}
      </div>
      <div class="shift-seats">
        <div class="num ${remaining <= 0 ? 'zero' : remaining <= 4 ? 'low' : ''}">${remaining}</div>
        <div class="label">剩餘座位</div>
      </div>
    </div>`;
}

function renderPassengerLogin(content) {
  content.innerHTML = `
    <div class="card">
      <div class="card-title">📱 輸入電話號碼開始預約</div>
      <div class="input-group">
        <label>電話號碼（8 位數字）</label>
        <input type="tel" id="login-phone" placeholder="例如：91234567" maxlength="8" inputmode="numeric">
      </div>
      <div class="input-group">
        <label>姓名</label>
        <input type="text" id="login-name" placeholder="例如：陳先生" maxlength="20">
      </div>
      <button class="btn btn-primary" id="passenger-login-btn" onclick="passengerLogin()">確認</button>
    </div>`;
}

async function passengerLogin() {
  const btn = document.getElementById('passenger-login-btn');
  if (btn) { btn.disabled = true; btn.textContent = '處理中...'; }
  const phone = document.getElementById('login-phone').value.trim();
  const name = document.getElementById('login-name').value.trim();

  if (!/^\d{8}$/.test(phone)) { toast('請輸入 8 位數字電話號碼'); if (btn) { btn.disabled = false; btn.textContent = '確認'; } return; }
  if (!name || name.length > 20) { toast('請輸入姓名（20 字內）'); if (btn) { btn.disabled = false; btn.textContent = '確認'; } return; }

  try {
    await ensureAuth();
    const existing = await DataLayer.getPassenger(phone) || {};
    if (existing.suspendedUntil && existing.suspendedUntil > now()) {
      const remaining = Math.ceil((existing.suspendedUntil - now()) / (24*60*60*1000));
      toast(`預約資格暫停中，剩餘 ${remaining} 日`);
      if (btn) { btn.disabled = false; btn.textContent = '確認'; }
      return;
    }
    await DataLayer.savePassenger(phone, {
      name, phone,
      creditScore: existing.creditScore != null ? existing.creditScore : 100,
      totalBookings: existing.totalBookings || 0,
      totalNoShows: existing.totalNoShows || 0,
      lastLogin: now()
    });
    currentPassenger = { phone, name };
    savePassengerSession(currentPassenger);
    toast('✅ 登入成功');
    renderPassengerHome();
  } catch(e) {
    toast('❌ ' + e.message, 5000);
    if (btn) { btn.disabled = false; btn.textContent = '確認'; }
  }
}

function passengerLogout() {
  currentPassenger = null;
  clearPassengerSession();
  stopGPS();
  if (waitingRoomListener) { try { waitingRoomListener.off(); } catch(e) {} waitingRoomListener = null; }
  if (loopPassengerRef && loopPassengerHandler) { try { loopPassengerRef.off('value', loopPassengerHandler); } catch(e) {} loopPassengerRef = null; loopPassengerHandler = null; }
  renderPassengerHome();
}

async function selectShift(date, time) {
  const content = document.getElementById('booking-content');
  try {
    const cfg = await DataLayer.getSeatConfig(date, time);
    if (!cfg || !cfg.seats) { toast('此班次未開放預約'); return; }
    const todayBookings = await DataLayer.getBookings(date);
    const scheduleId = getScheduleId(date, time);
    const bookedSeats = Object.values(todayBookings)
      .filter(b => b.scheduleId === scheduleId && ['pending','reserved','arrived','boarded'].includes(b.status))
      .reduce((sum, b) => sum + (b.seats || 0), 0);
    const remaining = cfg.seats - bookedSeats;

    const myBooking = Object.values(todayBookings).find(b =>
      b.scheduleId === scheduleId && b.passengerPhone === currentPassenger.phone &&
      b.status !== 'cancelled' && b.status !== 'rejected' && b.status !== 'no-show'
    );
    if (myBooking) { toast('你已經預約咗呢個班次'); return; }

    const pd = await DataLayer.getPassenger(currentPassenger.phone) || {};

    content.innerHTML = `
      <div style="display:flex;align-items:center;margin-bottom:16px;">
        <button class="btn btn-outline btn-sm" onclick="renderPassengerHome()">← 返回</button>
      </div>
      <div class="card">
        <div class="card-title">🚐 預約班次</div>
        <div style="font-size:28px;font-weight:700;color:#38bdf8;">${esc(time)}</div>
        <div style="font-size:13px;color:#64748b;margin-top:4px;">${esc(date)}</div>
        <div style="font-size:13px;margin-top:6px;font-weight:600;color:${getShiftDirection(time) === 'morning' ? '#4ade80' : '#fdba74'};">${esc(getShiftOriginLabel(time))}</div>
        <div style="font-size:13px;color:#94a3b8;margin-top:4px;">→ ${esc(getShiftDestination(time))}</div>
        <div style="font-size:13px;color:#22c55e;margin-top:8px;">剩餘 ${remaining} 個座位</div>
      </div>
      <div class="card">
        <div class="input-group"><label>姓名</label>
          <input type="text" id="book-name" value="${esc(pd.name || currentPassenger.name)}" maxlength="20"></div>
        <div class="input-group"><label>人數</label>
          <select id="book-seats"><option value="1">1 人</option><option value="2">2 人</option></select></div>
        <button class="btn btn-primary" id="confirm-booking-btn" onclick="confirmBooking('${date}','${time}')">送出預約（待司機確認）</button>
        <div style="font-size:12px;color:#94a3b8;margin-top:10px;text-align:center;line-height:1.6;">
          ⚠️ 送出後需要司機確認<br>司機確認後才作實留位
        </div>
      </div>`;
  } catch(e) { toast('載入失敗：' + e.message); }
}

async function confirmBooking(date, time) {
  const btn = document.getElementById('confirm-booking-btn');
  if (btn) { btn.disabled = true; btn.textContent = '處理中...'; }
  const name = document.getElementById('book-name').value.trim();
  const seats = parseInt(document.getElementById('book-seats').value);
  if (!name || name.length > 20) { toast('請輸入姓名'); if (btn) { btn.disabled = false; btn.textContent = '送出預約（待司機確認）'; } return; }

  try {
    await ensureAuth();
    const cfg = await DataLayer.getSeatConfig(date, time);
    if (!cfg || !cfg.seats) throw new Error('此班次未開放');
    const todayBookings = await DataLayer.getBookings(date);
    const scheduleId = getScheduleId(date, time);
    const bookedSeats = Object.values(todayBookings)
      .filter(b => b.scheduleId === scheduleId && ['pending','reserved','arrived','boarded'].includes(b.status))
      .reduce((sum, b) => sum + (b.seats || 0), 0);
    if (bookedSeats + seats > cfg.seats) throw new Error('座位不足');

    const booking = {
      scheduleId, date, time,
      passengerName: name, passengerPhone: currentPassenger.phone,
      seats, status: 'pending', direction: getShiftDirection(time)
    };
    const saved = await DataLayer.addBooking(date, booking);
    try {
      const pd = await DataLayer.getPassenger(currentPassenger.phone) || {};
      await DataLayer.savePassenger(currentPassenger.phone, { totalBookings: (pd.totalBookings || 0) + 1, lastBooking: now() });
    } catch(e) {}
    toast('✅ 已送出，等待司機確認', 3000);
    openWaitingRoom(saved.id, date, time);
  } catch(e) {
    toast('❌ ' + e.message, 5000);
    if (btn) { btn.disabled = false; btn.textContent = '送出預約（待司機確認）'; }
  }
}

function openWaitingRoom(bookingId, date, time) { renderWaitingRoom(bookingId, date, time); }

async function renderWaitingRoom(bookingId, date, time) {
  if (waitingRoomListener) { try { waitingRoomListener.off(); } catch(e) {} waitingRoomListener = null; }
  const ref = db.ref('booking/' + date + '/' + bookingId);
  const handler = (snap) => {
    const b = snap.val();
    if (!b) { renderPassengerHome(); return; }
    renderWaitingRoomUI(b, date, bookingId);
  };
  ref.on('value', handler);
  waitingRoomListener = ref;
  const snap = await ref.once('value');
  const b = snap.val();
  if (!b) { renderPassengerHome(); return; }
  renderWaitingRoomUI(b, date, bookingId);
}

function renderWaitingRoomUI(b, date, bookingId) {
  const content = document.getElementById('booking-content');
  const shiftTime = getShiftTime(b.date, b.time);
  const timeUntil = shiftTime - now();

  let statusBlock = '';
  if (b.status === 'pending') {
    statusBlock = `<div class="card" style="border-color:#fb923c;background:#431407;text-align:center;padding:24px;">
      <div style="font-size:60px;">⏳</div>
      <h2 style="color:#fdba74;font-size:22px;margin:12px 0 8px;">等待司機確認</h2>
      <p style="font-size:14px;color:#fdba74;">你嘅預約已送出<br>司機確認後會即時通知你</p>
    </div>`;
  } else if (b.status === 'reserved') {
    statusBlock = `<div class="card" style="border-color:#22c55e;background:#052e16;text-align:center;padding:24px;">
      <div style="font-size:60px;">✅</div>
      <h2 style="color:#22c55e;font-size:22px;margin:12px 0 8px;">已確認留位！</h2>
      <p style="font-size:14px;color:#86efac;">司機已確認你嘅預約</p>
    </div>`;
  } else if (b.status === 'rejected') {
    statusBlock = `<div class="card" style="border-color:#ef4444;background:#450a0a;text-align:center;padding:24px;">
      <div style="font-size:60px;">❌</div>
      <h2 style="color:#f87171;font-size:22px;margin:12px 0 8px;">預約已被拒絕</h2>
      <p style="font-size:14px;color:#fca5a5;">${esc(b.rejectReason ? '原因：' + b.rejectReason : '司機未能確認你嘅預約')}</p>
    </div>`;
  } else if (b.status === 'arrived') {
    statusBlock = `<div class="card" style="border-color:#22c55e;background:#052e16;text-align:center;padding:24px;">
      <div style="font-size:60px;">✅</div><h2 style="color:#22c55e;font-size:22px;margin:12px 0 8px;">已確認到站</h2>
      <p style="font-size:14px;color:#86efac;">請在總站等候上車</p></div>`;
  } else if (b.status === 'boarded') {
    statusBlock = `<div class="card" style="text-align:center;padding:24px;"><div style="font-size:60px;">🚐</div><h2 style="color:#7dd3fc;font-size:22px;margin:12px 0 8px;">已上車</h2></div>`;
  } else if (b.status === 'cancelled') {
    statusBlock = `<div class="card" style="text-align:center;color:#94a3b8;">已取消</div>`;
  } else if (b.status === 'no-show') {
    statusBlock = `<div class="card" style="text-align:center;border-color:#ef4444;background:#450a0a;"><div style="color:#f87171;font-weight:600;">❌ 未到站</div></div>`;
  }

  let html = `
    <div style="display:flex;align-items:center;margin-bottom:16px;">
      <button class="btn btn-outline btn-sm" onclick="renderPassengerHome()">← 返回</button>
    </div>
    ${statusBlock}
    <div class="card" style="text-align:center;">
      <div style="font-size:14px;color:#64748b;">預約編號</div>
      <div style="font-size:20px;font-weight:700;color:#38bdf8;letter-spacing:2px;margin:8px 0;">${esc(b.id.substring(0,8).toUpperCase())}</div>
      <div style="font-size:13px;color:#94a3b8;">${esc(b.time)} 班次 · ${b.seats} 人</div>
      <div style="font-size:13px;margin-top:6px;font-weight:600;color:${getShiftDirection(b.time) === 'morning' ? '#4ade80' : '#fdba74'};">${esc(getShiftOriginLabel(b.time))}</div>
      <div style="font-size:12px;color:#64748b;margin-top:4px;">乘客：${esc(b.passengerName)}</div>
    </div>`;

  if (b.status === 'reserved') {
    html += `
      <div class="card" style="text-align:center;padding:16px;border:2px dashed #f59e0b;background:#422006;" id="gps-box">
        <div style="font-size:40px;">📍</div>
        <div style="font-size:14px;font-weight:600;" id="gps-text">等待開始定位...</div>
        <div style="font-size:12px;color:#94a3b8;margin-top:4px;" id="gps-sub">發車前 15 分鐘開始追蹤</div>
      </div>
      <div class="card" style="text-align:center;"><div style="font-size:13px;color:#f59e0b;font-weight:600;" id="countdown">距離發車：--:--</div></div>`;
  }

  if (b.status === 'pending' || b.status === 'reserved') {
    html += `<button class="btn btn-outline" onclick="cancelBooking('${b.id}','${b.date}')">取消預約</button>`;
    if (b.status === 'reserved') html += `<button class="btn btn-primary" style="margin-top:10px;" onclick="renderPassengerHome()">返回主頁</button>`;
  }

  content.innerHTML = html;

  if (b.status === 'reserved') {
    updateCountdown(b.date, b.time);
    if (timeUntil < ARRIVE_WINDOW && timeUntil > -5 * 60 * 1000) startGPS(b.id, b.date, b.time);
    else if (timeUntil > 0) {
      const delay = timeUntil - ARRIVE_WINDOW;
      if (delay < 24 * 60 * 60 * 1000) setTimeout(() => {
        if (document.getElementById('countdown')) checkAndStartGPS(b.id, b.date, b.time);
      }, delay);
    }
  }
}

async function checkAndStartGPS(bookingId, date, time) {
  try {
    const bookings = await DataLayer.getBookings(date);
    const b = bookings[bookingId];
    if (b && b.status === 'reserved') startGPS(bookingId, date, time);
  } catch(e) {}
}

function updateCountdown(date, time) {
  const el = document.getElementById('countdown');
  if (!el) return;
  const diff = getShiftTime(date, time) - now();
  if (diff <= 0) { el.textContent = '班次已發車'; return; }
  const mins = Math.floor(diff / 60000);
  const secs = Math.floor((diff % 60000) / 1000);
  el.textContent = `距離發車：${mins}:${String(secs).padStart(2,'0')}`;
  setTimeout(() => { if (document.getElementById('countdown')) updateCountdown(date, time); }, 1000);
}

async function cancelBooking(bookingId, date) {
  if (!confirm('確定取消預約？')) return;
  try {
    await DataLayer.cancelBooking(date || getToday(), bookingId);
    stopGPS();
    toast('已取消預約');
    if (waitingRoomListener) { try { waitingRoomListener.off(); } catch(e) {} waitingRoomListener = null; }
    renderPassengerHome();
  } catch(e) { toast('取消失敗：' + e.message); }
}

function startGPS(bookingId, date, time) {
  if (!navigator.geolocation) { const t = document.getElementById('gps-text'); if (t) t.textContent = '不支援 GPS'; return; }
  const gps = getShiftGPS(time);
  const gpsText = document.getElementById('gps-text');
  const gpsSub = document.getElementById('gps-sub');
  if (gpsText) gpsText.textContent = '正在定位...';
  if (gpsSub) gpsSub.textContent = `目標：${getShiftOrigin(time)}`;
  stopGPS();
  gpsWatchId = navigator.geolocation.watchPosition(
    async (pos) => {
      const d = distance(pos.coords.latitude, pos.coords.longitude, gps.lat, gps.lng);
      const box = document.getElementById('gps-box');
      const text = document.getElementById('gps-text');
      const sub = document.getElementById('gps-sub');
      if (!box || !text || !sub) return;
      if (d <= GPS_RADIUS) {
        box.className = 'gps-box arrived';
        box.style.borderColor = '#22c55e';
        box.style.background = '#052e16';
        text.textContent = '✅ 已到站！';
        sub.textContent = `距離 ${Math.round(d)} 米`;
        if (gpsMarkedBookingId !== bookingId) { gpsMarkedBookingId = bookingId; await markArrived(bookingId, date); }
      } else {
        text.textContent = '⏳ 未到站';
        sub.textContent = `距離 ${Math.round(d)} 米（需進入 ${GPS_RADIUS} 米範圍）`;
      }
    },
    (err) => { const t = document.getElementById('gps-text'); if (t) t.textContent = 'GPS 錯誤：' + err.message; },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
}
function stopGPS() { if (gpsWatchId !== null) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; } }

async function markArrived(bookingId, date) {
  try {
    const bookings = await DataLayer.getBookings(date);
    const b = bookings[bookingId];
    if (!b || b.status !== 'reserved') return;
    await DataLayer.updateBooking(date, bookingId, { status: 'arrived', arrivedAt: now() });
    stopGPS();
    toast('✅ 已確認到站！');
  } catch(e) {}
}

function clearDriverListeners() {
  if (driverBookingListener && driverListenerDate) { try { db.ref('booking/' + driverListenerDate).off('value', driverBookingListener); } catch(e) {} driverBookingListener = null; }
  if (driverLoopListener && driverListenerDate) { try { db.ref('booking_loop/' + driverListenerDate).off('value', driverLoopListener); } catch(e) {} driverLoopListener = null; }
  driverListenerDate = null;
}

async function renderDriverHome() {
  const content = document.getElementById('driver-content');
  clearDriverListeners();
  try {
    await ensureAuth();
    const activeBuses = await DataLayer.getActiveBuses();

    if (activeBuses.length === 0) {
      clearSelectedBus(); currentDriver = null;
      content.innerHTML = `
        <div class="waiting-big">
          <div class="icon">🚐</div>
          <h3>等待當值中...</h3>
          <p>請先喺「西鐵小巴系統」開始當值。<br>開始當值後，呢個頁面會自動顯示你嘅車牌同預約名單。</p>
        </div>`;
      const ref = db.ref('van/active_buses');
      const handler = () => { if (currentScreen === 'driver') renderDriverHome(); };
      ref.on('value', handler);
      return;
    }

    if (activeBuses.length === 1) {
      currentDriver = { plate: activeBuses[0].plate, carSeats: activeBuses[0].carSeats || 16 };
      saveSelectedBus(currentDriver.plate);
      renderDriverDuty();
      return;
    }

    const saved = loadSelectedBus();
    if (saved && activeBuses.find(b => b.plate === saved)) {
      const bus = activeBuses.find(b => b.plate === saved);
      currentDriver = { plate: bus.plate, carSeats: bus.carSeats || 16 };
      renderDriverDuty();
      return;
    }

    let html = `<div class="card"><div class="card-title">🚐 而家有 ${activeBuses.length} 部車當值中</div>
      <div style="font-size:13px;color:#94a3b8;">請揀你揸緊嗰部車：</div></div>`;
    activeBuses.forEach(bus => {
      html += `<div class="bus-pick" onclick="pickBus('${esc(bus.plate)}')">
        <div><div class="plate">${esc(bus.plate)}</div>
        <div class="info">${bus.carSeats || 16} 座 · ${esc(bus.currentStation || '未知位置')}</div></div>
        <div class="arrow">›</div></div>`;
    });
    content.innerHTML = html;
  } catch(e) {
    content.innerHTML = `<div class="card" style="border-color:#ef4444;"><div style="color:#f87171;">⚠️ ${esc(e.message)}</div></div>
      <button class="btn btn-primary" onclick="renderDriverHome()">🔄 重試</button>`;
  }
}

function pickBus(plate) { saveSelectedBus(plate); renderDriverHome(); }

async function renderDriverDuty() {
  const content = document.getElementById('driver-content');
  const bus = currentDriver;
  if (!bus) { renderDriverHome(); return; }
  const today = getToday();

  content.innerHTML = `
    <div class="driver-top">
      <div class="plate">${esc(bus.plate)}</div>
      <div class="seats">${bus.carSeats || 16} 座</div>
      <div class="status">🟢 當值中 · 實時同步</div>
    </div>
    <div id="alert-area"></div>
    <div class="card" style="padding:0;border:none;background:none;margin-bottom:12px;">
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" id="tab-btn-fixed" onclick="switchDriverTab('fixed')" style="padding:12px;font-size:14px;">📋 固定班次</button>
        <button class="btn btn-outline" id="tab-btn-loop" onclick="switchDriverTab('loop')" style="padding:12px;font-size:14px;">🔄 循環線候補</button>
      </div>
    </div>
    <div id="driver-tab-fixed"></div>
    <div id="driver-tab-loop" style="display:none;"></div>
  `;

  // 監聽當值狀態變化
  const busRef = db.ref('van/active_buses/' + bus.plate);
  busRef.on('value', (snap) => {
    const data = snap.val();
    if (!data || !data.isActive) {
      toast('🔴 西鐵小巴已停止當值');
      clearSelectedBus(); currentDriver = null;
      renderDriverHome();
      return;
    }
    if (data.carSeats && data.carSeats !== currentDriver.carSeats) {
      currentDriver.carSeats = data.carSeats;
    }
  });

  // 預設顯示固定班次
  switchDriverTab('fixed');
}

function switchDriverTab(tab) {
  const btnFixed = document.getElementById('tab-btn-fixed');
  const btnLoop = document.getElementById('tab-btn-loop');
  const divFixed = document.getElementById('driver-tab-fixed');
  const divLoop = document.getElementById('driver-tab-loop');
  if (!btnFixed || !btnLoop) return;

  if (tab === 'fixed') {
    btnFixed.className = 'btn btn-primary';
    btnLoop.className = 'btn btn-outline';
    divFixed.style.display = 'block';
    divLoop.style.display = 'none';
    renderDriverFixedList();
  } else {
    btnFixed.className = 'btn btn-outline';
    btnLoop.className = 'btn btn-primary';
    divFixed.style.display = 'none';
    divLoop.style.display = 'block';
    renderDriverLoopList();
  }
}

async function renderDriverFixedList() {
  const container = document.getElementById('driver-tab-fixed');
  if (!container) return;
  container.innerHTML = `<div style="text-align:center;color:#64748b;padding:20px;">🔄 載入中...</div>`;
  const today = getToday();
  const allShifts = [...SHIFTS_MORNING, ...SHIFTS_EVENING];
  const seatConfigs = await DataLayer.getAllSeatConfigs(today);

  // 初次載入
  const initialBookings = await DataLayer.getBookings(today);
  currentCachedBookings = initialBookings;
  Object.keys(initialBookings).forEach(id => driverKnownBookingIds.add(id));
  driverFirstLoad = false;
  renderDriverFixedHTML(initialBookings, seatConfigs, today, allShifts);

  // 實時監聽
  const ref = db.ref('booking/' + today);
  driverListenerDate = today;
  driverBookingListener = (snap) => {
    const allBookings = snap.val() || {};
    const newIds = new Set(Object.keys(allBookings));
    let newPending = 0;
    if (!driverFirstLoad) {
      newIds.forEach(id => {
        if (!driverKnownBookingIds.has(id)) {
          const b = allBookings[id];
          if (b && b.status === 'pending') newPending++;
        }
      });
      if (newPending > 0) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator(); const g = ctx.createGain();
          osc.frequency.value = 880; g.gain.value = 0.3;
          osc.connect(g); g.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.15);
          setTimeout(() => {
            const osc2 = ctx.createOscillator(); const g2 = ctx.createGain();
            osc2.frequency.value = 1320; g2.gain.value = 0.3;
            osc2.connect(g2); g2.connect(ctx.destination); osc2.start(); osc2.stop(ctx.currentTime + 0.15);
          }, 200);
        } catch(e) {}
        if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        toast(`🔔 有 ${newPending} 個新固定班次預約！`, 4000);
      }
    }
    driverKnownBookingIds = newIds;
    driverFirstLoad = false;
    currentCachedBookings = allBookings;
    renderDriverFixedHTML(allBookings, seatConfigs, today, allShifts);
  };
  ref.on('value', driverBookingListener);
}

function renderDriverFixedHTML(allBookings, seatConfigs, today, allShifts) {
  const container = document.getElementById('driver-tab-fixed');
  const alertEl = document.getElementById('alert-area');
  if (!container) return;
  const bus = currentDriver;
  if (!bus) return;

  let myPendingTotal = 0;
  allShifts.forEach(time => {
    const scheduleId = getScheduleId(today, time);
    Object.values(allBookings).forEach(b => {
      if (b.scheduleId === scheduleId && b.status === 'pending') myPendingTotal++;
    });
  });

  if (alertEl) {
    if (myPendingTotal > 0) {
      alertEl.innerHTML = `
        <div class="alert-banner">
          <div class="icon">🔔</div>
          <div class="text">有 ${myPendingTotal} 個新預約！</div>
          <div class="sub">請撳「✅ 確認」或「❌ 拒絕」回覆乘客</div>
        </div>`;
    } else {
      alertEl.innerHTML = '';
    }
  }

  let html = '';
  allShifts.forEach(time => {
    const scheduleId = getScheduleId(today, time);
    const cfg = seatConfigs[time.replace(':','')];
    const totalSeats = (cfg && cfg.seats) || bus.carSeats || 16;
    const dir = getShiftDirection(time);

    const shiftBookings = Object.values(allBookings).filter(b => b.scheduleId === scheduleId && b.status !== 'cancelled');
    const bookedSeats = shiftBookings
      .filter(b => ['pending','reserved','arrived','boarded'].includes(b.status))
      .reduce((s,b) => s + (b.seats||0), 0);
    const remaining = totalSeats - bookedSeats;
    const isFull = remaining <= 0;

    const pendingList = shiftBookings.filter(b => b.status === 'pending');
    const confirmedList = shiftBookings.filter(b => b.status === 'reserved');
    const arrivedList = shiftBookings.filter(b => b.status === 'arrived' || b.status === 'boarded');

    html += `
      <div class="big-shift ${isFull ? 'full' : ''}">
        <div class="time">${esc(time)}</div>
        <div class="origin ${dir === 'morning' ? 'origin-morning' : 'origin-evening'}" style="color:${dir === 'morning' ? '#4ade80' : '#fdba74'};font-weight:700;">${esc(getShiftOriginLabel(time))}</div>
        <div class="counts">
          <div>
            <div class="pending-count">⏳ ${pendingList.length} 待確認</div>
            <div class="arrived-count" style="margin-top:4px;">🔴 ${arrivedList.length} 已到 · ✅ ${confirmedList.length} 已確認</div>
          </div>
          <div style="text-align:right;">
            <div class="seat-num ${remaining <= 0 ? 'zero' : remaining <= 4 ? 'low' : ''}">${remaining}</div>
            <div class="seat-label">剩餘座位</div>
          </div>
        </div>
        ${isFull ? '<span class="full-label">🔴 滿座</span>' : ''}
        ${pendingList.length > 0 ? `
          <div class="pending-box">
            <div class="pending-title">🔔 待你確認（${pendingList.length}）</div>
            ${pendingList.map(b => `
              <div class="pending-item">
                <div class="name">${esc(b.passengerName)}${b.seats > 1 ? ' ×'+b.seats : ''}</div>
                <div class="phone">${esc(b.passengerPhone)}</div>
                <div class="actions">
                  <button class="btn-confirm" onclick="driverConfirm('${b.date}','${b.id}','${esc(bus.plate)}')">✅ 確認</button>
                  <button class="btn-reject" onclick="driverReject('${b.date}','${b.id}','${esc(bus.plate)}')">❌ 拒絕</button>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        ${confirmedList.length > 0 ? `
          <div style="margin-top:12px;">
            <div style="font-size:13px;color:#4ade80;font-weight:700;margin-bottom:6px;">✅ 已確認留位（${confirmedList.length}）</div>
            ${confirmedList.map(b => `
              <div class="booking-item arrived">
                <div>
                  <div class="booking-name">${esc(b.passengerName)}${b.seats > 1 ? ' ×'+b.seats : ''}</div>
                  <div class="booking-phone">${esc(b.passengerPhone)}</div>
                </div>
                <div style="font-size:12px;color:#4ade80;">已確認</div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        ${arrivedList.length > 0 ? `
          <div style="margin-top:12px;">
            <div style="font-size:13px;color:#22c55e;font-weight:700;margin-bottom:6px;">🔴 已到站（${arrivedList.length}）</div>
            ${arrivedList.map(b => `
              <div class="booking-item arrived">
                <div>
                  <div class="booking-name">${esc(b.passengerName)}${b.seats > 1 ? ' ×'+b.seats : ''}</div>
                  <div class="booking-phone">${esc(b.passengerPhone)}</div>
                </div>
                <div>
                  ${b.status === 'boarded' ? '<span class="badge badge-blue">已上車</span>' :
                    `<button class="btn btn-success btn-sm" onclick="markBoarded('${b.date}','${b.id}')">上車</button>`}
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>`;
  });
  container.innerHTML = html;
}

// ========== 循環線候補（司機端） ==========
async function renderDriverLoopList() {
  const container = document.getElementById('driver-tab-loop');
  if (!container) return;
  container.innerHTML = `<div style="text-align:center;color:#64748b;padding:20px;">🔄 載入中...</div>`;
  const today = getToday();

  if (driverLoopListener && driverListenerDate) {
    try { db.ref('booking_loop/' + driverListenerDate).off('value', driverLoopListener); } catch(e) {}
  }

  const initial = await DataLayer.getLoopQueue(today);
  currentCachedLoop = initial;
  Object.keys(initial).forEach(id => driverKnownLoopIds.add(id));
  loopFirstLoad = false;
  renderDriverLoopHTML(initial);

  const ref = db.ref('booking_loop/' + today);
  driverLoopListener = (snap) => {
    const all = snap.val() || {};
    const newIds = new Set(Object.keys(all));
    let newWaiting = 0;
    if (!loopFirstLoad) {
      newIds.forEach(id => {
        if (!driverKnownLoopIds.has(id)) {
          const item = all[id];
          if (item && item.status === 'waiting') newWaiting++;
        }
      });
      if (newWaiting > 0) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator(); const g = ctx.createGain();
          osc.frequency.value = 660; g.gain.value = 0.3;
          osc.connect(g); g.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.2);
        } catch(e) {}
        if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        toast(`🔄 有 ${newWaiting} 位循環線乘客加入！`, 4000);
      }
    }
    driverKnownLoopIds = newIds;
    loopFirstLoad = false;
    currentCachedLoop = all;
    renderDriverLoopHTML(all);
  };
  ref.on('value', driverLoopListener);
}

function renderDriverLoopHTML(allLoop) {
  const container = document.getElementById('driver-tab-loop');
  if (!container) return;
  const bus = currentDriver;
  if (!bus) return;

  const waitingList = Object.values(allLoop)
    .filter(item => item.status === 'waiting')
    .sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));

  const boardedList = Object.values(allLoop)
    .filter(item => item.status === 'boarded')
    .sort((a,b) => (b.boardedAt || 0) - (a.boardedAt || 0))
    .slice(0, 10);

  let html = `
    <div class="loop-card">
      <div class="title">🔄 循環線候補名單</div>
      <div class="sub">
        而家候補人數：<strong style="font-size:20px;color:#7dd3fc;">${waitingList.length}</strong> 人<br>
        到站後按「叫名上車」，乘客上車後按「已上車」
      </div>
    </div>
  `;

  if (waitingList.length === 0) {
    html += `
      <div class="waiting-big">
        <div class="icon">🔄</div>
        <h3>暫時冇乘客候補</h3>
        <p>循環線時段（07:00 - 18:00）<br>乘客排隊後會即時顯示喺呢度</p>
      </div>
    `;
  } else {
    html += `<div class="card-title" style="margin-bottom:8px;">📋 候補名單（按排隊次序）</div>`;
    waitingList.forEach((item, idx) => {
      html += `
        <div class="loop-wait">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div class="name">#${idx + 1} ${esc(item.name)}</div>
              <div class="phone">${esc(item.phone)}</div>
              <div class="seats">👥 ${item.seats || 1} 人</div>
            </div>
            <div style="font-size:11px;color:#94a3b8;text-align:right;">
              ${item.createdAt ? new Date(item.createdAt).toLocaleTimeString('zh-HK', {hour:'2-digit',minute:'2-digit'}) : ''}
            </div>
          </div>
          <div class="actions">
            <button class="btn-board" onclick="driverBoardLoop('${item.id}')">✅ 已上車</button>
            <button class="btn-cancel" onclick="driverCancelLoop('${item.id}')">❌ 取消</button>
          </div>
        </div>
      `;
    });
  }

  if (boardedList.length > 0) {
    html += `
      <div class="card-title" style="margin:16px 0 8px;">✅ 最近已上車（${boardedList.length}）</div>
    `;
    boardedList.forEach(item => {
      html += `
        <div class="booking-item arrived">
          <div>
            <div class="booking-name">${esc(item.name)}</div>
            <div class="booking-phone">${esc(item.phone)} · ${item.seats || 1} 人</div>
          </div>
          <div style="font-size:12px;color:#4ade80;">已上車</div>
        </div>
      `;
    });
  }

  container.innerHTML = html;
}

async function driverBoardLoop(loopId) {
  try {
    const today = getToday();
    await DataLayer.updateLoopQueue(today, loopId, { status: 'boarded', boardedAt: now() });
    toast('✅ 已標記上車', 2000);
  } catch(e) { toast('操作失敗：' + e.message); }
}

async function driverCancelLoop(loopId) {
  if (!confirm('確定取消呢位乘客嘅候補？')) return;
  try {
    const today = getToday();
    await DataLayer.removeLoopQueue(today, loopId);
    toast('❌ 已取消', 2000);
  } catch(e) { toast('操作失敗：' + e.message); }
}

async function driverConfirm(date, bookingId, plate) {
  try {
    await DataLayer.updateBooking(date, bookingId, { status: 'reserved', confirmedAt: now(), confirmedBy: plate });
    toast('✅ 已確認留位', 2000);
  } catch(e) { toast('確認失敗：' + e.message); }
}

async function driverReject(date, bookingId, plate) {
  const reason = prompt('拒絕原因（可以留空）：', '') || '';
  try {
    await DataLayer.updateBooking(date, bookingId, { status: 'rejected', rejectedAt: now(), rejectedBy: plate, rejectReason: reason });
    toast('❌ 已拒絕', 2000);
  } catch(e) { toast('操作失敗：' + e.message); }
}

async function markBoarded(date, bookingId) {
  try {
    await DataLayer.updateBooking(date, bookingId, { status: 'boarded', boardedAt: now() });
    toast('✅ 已確認上車');
  } catch(e) {}
}

async function autoCleanExpiredBookings() {
  if (!isWeekday()) return;
  try {
    const today = getToday();
    const bookings = await DataLayer.getBookings(today);
    for (const [id, b] of Object.entries(bookings)) {
      if (b.status !== 'reserved' && b.status !== 'pending') continue;
      const shiftTime = getShiftTime(b.date, b.time);
      if (now() > shiftTime + 5 * 60 * 1000) {
        await DataLayer.updateBooking(b.date, id, { status: 'no-show', noShowAt: now() });
        const pd = await DataLayer.getPassenger(b.passengerPhone) || {};
        const newScore = Math.max(0, (pd.creditScore != null ? pd.creditScore : 100) - 20);
        const patch = { creditScore: newScore, totalNoShows: (pd.totalNoShows || 0) + 1 };
        if (newScore < 30) patch.suspendedUntil = now() + 30 * 24 * 60 * 60 * 1000;
        else if (newScore < 60) patch.suspendedUntil = now() + 7 * 24 * 60 * 60 * 1000;
        await DataLayer.savePassenger(b.passengerPhone, patch);
      }
    }
    // 清理過期候補（超過 4 小時）
    const loop = await DataLayer.getLoopQueue(today);
    for (const [id, item] of Object.entries(loop)) {
      if (item.status === 'waiting' && now() - (item.createdAt || 0) > 4 * 60 * 60 * 1000) {
        await DataLayer.removeLoopQueue(today, id);
      }
    }
  } catch(e) {}
}

  setTimeout(autoCleanExpiredBookings, 5000);
  setInterval(() => { if (currentScreen === 'home') updateHomeStats(); }, 30 * 1000);
  history.pushState(null, '', location.href);
})();
