<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>浚鍵管理有限公司 · 小巴留座系統</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; background: #0a0f1a; color: #e2e8f0; min-height: 100vh; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.header { background: linear-gradient(135deg, #0f172a, #1e293b); padding: 18px 16px; text-align: center; border-bottom: 1px solid #1e293b; }
.header h1 { font-size: 16px; font-weight: 700; color: #38bdf8; }
.header .sub { font-size: 11px; color: #64748b; margin-top: 4px; }
.header .company { font-size: 13px; color: #94a3b8; font-weight: 600; }
.screen { display: none; flex: 1; padding: 16px; }
.screen.active { display: block; }
.btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; }
.btn-primary { background: #0ea5e9; color: #fff; }
.btn-success { background: #22c55e; color: #fff; }
.btn-danger { background: #ef4444; color: #fff; }
.btn-outline { background: transparent; border: 1px solid #334155; color: #94a3b8; }
.btn-sm { padding: 10px 16px; font-size: 14px; border-radius: 8px; width: auto; display: inline-block; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; }
.card-title { font-size: 14px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
.module-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.module-card { background: #1e293b; border-radius: 16px; padding: 20px 16px; border: 1px solid #334155; text-align: center; cursor: pointer; }
.module-card:active { background: #334155; }
.module-card .icon { font-size: 32px; margin-bottom: 8px; }
.module-card .name { font-size: 14px; font-weight: 600; color: #f1f5f9; }
.module-card .desc { font-size: 11px; color: #64748b; margin-top: 4px; }
.shift-card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.shift-card.full { opacity: 0.5; }
.shift-time { font-size: 22px; font-weight: 700; color: #f1f5f9; }
.shift-info { font-size: 12px; color: #64748b; margin-top: 4px; }
.shift-info.morning { color: #4ade80; font-weight: 600; }
.shift-info.evening { color: #fdba74; font-weight: 600; }
.shift-seats { text-align: right; }
.shift-seats .num { font-size: 28px; font-weight: 700; color: #22c55e; }
.shift-seats .num.low { color: #f59e0b; }
.shift-seats .num.zero { color: #ef4444; }
.shift-seats .label { font-size: 11px; color: #64748b; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-green { background: #052e16; color: #4ade80; }
.badge-yellow { background: #422006; color: #fbbf24; }
.badge-red { background: #450a0a; color: #f87171; }
.badge-blue { background: #082f49; color: #38bdf8; }
.badge-orange { background: #431407; color: #fdba74; }
.input-group { margin-bottom: 14px; }
.input-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
.input-group input, .input-group select { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; font-size: 16px; outline: none; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #f1f5f9; padding: 12px 24px; border-radius: 10px; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s; border: 1px solid #334155; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }
.bottom-nav { display: flex; background: #1e293b; border-top: 1px solid #334155; position: sticky; bottom: 0; }
.nav-item { flex: 1; padding: 12px; text-align: center; font-size: 11px; color: #64748b; cursor: pointer; border: none; background: none; }
.nav-item.active { color: #38bdf8; }
.nav-item .icon { font-size: 20px; display: block; margin-bottom: 2px; }
.booking-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 10px; margin-bottom: 8px; background: #0f172a; border-left: 4px solid #334155; }
.booking-item.arrived { border-left-color: #22c55e; }
.booking-item.not-arrived { border-left-color: #f59e0b; }
.booking-name { font-size: 15px; font-weight: 600; }
.booking-phone { font-size: 12px; color: #64748b; }
.loop-card { background: linear-gradient(135deg, #0c4a6e, #075985); border: 2px solid #0ea5e9; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.loop-card .title { font-size: 16px; font-weight: 900; color: #7dd3fc; }
.loop-card .sub { font-size: 12px; color: #bae6fd; margin-top: 4px; }
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="company">浚鍵管理有限公司</div>
<h1>小巴留座系統</h1>
<div class="sub">大棠黃泥墩 ↔ 元朗港鐵站 H 出口</div>
</div>
<div class="screen active" id="screen-home">
<div class="module-grid">
<div class="module-card" onclick="openModule('booking')"><div class="icon">🚐</div><div class="name">小巴留座</div><div class="desc">乘客預約</div></div>
<div class="module-card" onclick="openModule('driver')"><div class="icon">🧑‍✈️</div><div class="name">司機端</div><div class="desc">當值 · 確認</div></div>
<div class="module-card" onclick="openModule('admin')"><div class="icon">⚙️</div><div class="name">管理</div><div class="desc">當值 · 狀況</div></div>
<div class="module-card" onclick="openModule('info')"><div class="icon">ℹ️</div><div class="name">服務資訊</div><div class="desc">班次 · 時間</div></div>
</div>
<div class="card">
<div class="card-title">📊 今日概況</div>
<div style="display:flex;gap:8px;">
<div style="flex:1;text-align:center;padding:12px;background:#422006;border-radius:10px;border:1px solid #f59e0b;">
<div style="font-size:24px;font-weight:700;color:#fbbf24;" id="home-pending">0</div>
<div style="font-size:11px;color:#94a3b8;">待確認</div>
</div>
<div style="flex:1;text-align:center;padding:12px;background:#052e16;border-radius:10px;border:1px solid #22c55e;">
<div style="font-size:24px;font-weight:700;color:#4ade80;" id="home-confirmed">0</div>
<div style="font-size:11px;color:#94a3b8;">已確認</div>
</div>
<div style="flex:1;text-align:center;padding:12px;background:#0c4a6e;border-radius:10px;border:1px solid #0ea5e9;">
<div style="font-size:24px;font-weight:700;color:#7dd3fc;" id="home-loop">0</div>
<div style="font-size:11px;color:#94a3b8;">循環留位</div>
</div>
</div>
</div>
</div>
<div class="screen" id="screen-booking"><div id="booking-content"></div></div>
<div class="screen" id="screen-driver"><div id="driver-content"></div></div>
<div class="screen" id="screen-admin"><div id="admin-content"></div></div>
<div class="screen" id="screen-info"><div id="info-content"></div></div>
<div class="bottom-nav" id="bottom-nav" style="display:none;">
<button class="nav-item active" onclick="navTo('home')"><span class="icon">🏠</span>首頁</button>
<button class="nav-item" onclick="navTo('booking')"><span class="icon">🚐</span>留座</button>
<button class="nav-item" onclick="navTo('driver')"><span class="icon">🧑‍✈️</span>司機</button>
</div>
<div class="toast" id="toast"></div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAX7Zy5br1ozGOGxHvDeFNY-Ldcjjw8Qgc",
  authDomain: "triple-login-version.firebaseapp.com",
  databaseURL: "https://triple-login-version-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "triple-login-version",
  storageBucket: "triple-login-version.firebasestorage.app",
  messagingSenderId: "66459706459",
  appId: "1:66459706459:web:28f99a455652f393da0b7e"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const GPS_WONG = { lat: 22.416280, lng: 114.021977 };
const GPS_YUEN = { lat: 22.445847, lng: 114.037022 };
const SM = ['06:20','06:30','06:40','06:50'];
const SE = ['18:15','18:30','18:45','19:00','19:15','19:30','19:45','20:00','20:20'];
const GPS_R = 80;
const AW = 15 * 60 * 1000;
const AT = 5 * 60 * 1000;
const LS = 7;
const LE = 18;
const LOOP_TIMEOUT = 30 * 60 * 1000;
const LOOP_NOSHOW = 4 * 60 * 60 * 1000;

function toast(m, d = 3000) {
  const e = document.getElementById('toast');
  e.textContent = m;
  e.classList.add('show');
  clearTimeout(e._t);
  e._t = setTimeout(() => e.classList.remove('show'), d);
}
function now() { return Date.now(); }
function getToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isWeekday() {
  const d = new Date().getDay();
  return d >= 1 && d <= 5;
}
function dist(a, b, c, d) {
  const R = 6371000;
  const dl = (c - a) * Math.PI / 180;
  const dn = (d - b) * Math.PI / 180;
  const x = Math.sin(dl / 2) ** 2 + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(dn / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
function getShiftTime(d, t) {
  const [h, m] = t.split(':').map(Number);
  const x = new Date(d + 'T00:00:00');
  x.setHours(h, m, 0, 0);
  return x.getTime();
}
function getSid(d, t) { return d + '_' + t.replace(':', ''); }
function getDir(t) { return parseInt(t.split(':')[0]) < 12 ? 'morning' : 'evening'; }
function getGPS(t) { return getDir(t) === 'morning' ? GPS_WONG : GPS_YUEN; }
function getOrig(t) { return getDir(t) === 'morning' ? '大棠黃泥墩' : '元朗港鐵站 H 出口'; }
function getOrigL(t) { return getDir(t) === 'morning' ? '🌅 大棠黃泥墩開出' : '🌆 元朗港鐵站 H 出口開出'; }
function getDest(t) { return getDir(t) === 'morning' ? '元朗港鐵站 H 出口' : '大棠黃泥墩'; }
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function isLoopHour() {
  const h = new Date().getHours();
  return isWeekday() && h >= LS && h < LE;
}

const DL = {
  async getActiveBuses() {
    const s = await db.ref('van/active_buses').once('value');
    const all = s.val() || {};
    const n = now();
    const r = [];
    Object.entries(all).forEach(([p, b]) => {
      if (b && b.isActive && (n - (b.lastUpdate || 0) < AT)) r.push({ plate: p, ...b });
    });
    return r;
  },
  async getBookings(d) {
    const s = await db.ref('booking/' + d).once('value');
    return s.val() || {};
  },
  async addBooking(d, b) {
    const r = db.ref('booking/' + d).push();
    b.id = r.key;
    b.createdAt = now();
    await r.set(b);
    return b;
  },
  async updateBooking(d, i, p) {
    return db.ref('booking/' + d + '/' + i).update(p);
  },
  async cancelBooking(d, i) {
    return DL.updateBooking(d, i, { status: 'cancelled', cancelledAt: now() });
  },
  async getPassenger(p) {
    const s = await db.ref('booking_passengers/' + p).once('value');
    return s.val();
  },
  async savePassenger(p, d) {
    return db.ref('booking_passengers/' + p).update(d);
  },
  async getSeatConfig(d, t) {
    const s = await db.ref('booking_seats/' + d + '/' + t.replace(':', '')).once('value');
    return s.val();
  },
  async getAllSeatConfigs(d) {
    const s = await db.ref('booking_seats/' + d).once('value');
    return s.val() || {};
  },
  async getLoopQueue(d) {
    const s = await db.ref('booking_loop/' + d).once('value');
    return s.val() || {};
  },
  async addLoopQueue(d, i) {
    const r = db.ref('booking_loop/' + d).push();
    i.id = r.key;
    i.createdAt = now();
    await r.set(i);
    return i;
  },
  async updateLoopQueue(d, i, p) {
    return db.ref('booking_loop/' + d + '/' + i).update(p);
  },
  async removeLoopQueue(d, i) {
    return db.ref('booking_loop/' + d + '/' + i).remove();
  }
};

let currentPassenger = loadPassengerSession();
let currentScreen = 'home';
let waitingRoomListener = null;
let loopPassengerRef = null, loopPassengerHandler = null;

function savePassengerSession(p) {
  try { localStorage.setItem('booking_passenger', JSON.stringify(p)); } catch (e) {}
}
function loadPassengerSession() {
  try {
    const r = localStorage.getItem('booking_passenger');
    return r ? JSON.parse(r) : null;
  } catch (e) { return null; }
}
function clearPassengerSession() {
  try { localStorage.removeItem('booking_passenger'); } catch (e) {}
}
async function ensureAuth() {
  if (auth.currentUser) return auth.currentUser;
  const r = await auth.signInAnonymously();
  return r.user;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  currentScreen = id.replace('screen-', '');
}
function navTo(m) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event.target.closest('.nav-item').classList.add('active');
  openModule(m);
}
function openModule(m) {
  document.getElementById('bottom-nav').style.display = 'flex';
  if (m === 'home') { showScreen('screen-home'); updateHomeStats(); }
  else if (m === 'booking') { showScreen('screen-booking'); renderPassengerHome(); }
  else if (m === 'driver') { location.href = 'index (9).html'; }
  else if (m === 'admin') { showScreen('screen-admin'); renderAdmin(); }
  else if (m === 'info') { showScreen('screen-info'); renderInfo(); }
}

async function updateHomeStats() {
  try {
    const t = getToday();
    const b = await DL.getBookings(t);
    let p = 0, c = 0;
    Object.values(b).forEach(x => {
      if (x.status === 'pending') p++;
      if (x.status === 'reserved' || x.status === 'arrived' || x.status === 'boarded') c++;
    });
    const l = await DL.getLoopQueue(t);
    let lc = 0;
    Object.values(l).forEach(x => {
      if (x.status === 'pending' || x.status === 'reserved') lc++;
    });
    document.getElementById('home-pending').textContent = p;
    document.getElementById('home-confirmed').textContent = c;
    document.getElementById('home-loop').textContent = lc;
  } catch (e) {}
}

async function renderPassengerHome() {
  const c = document.getElementById('booking-content');
  if (waitingRoomListener) { try { waitingRoomListener.off(); } catch (e) {} waitingRoomListener = null; }
  if (!currentPassenger) currentPassenger = loadPassengerSession();
  if (!currentPassenger) { renderPassengerLogin(c); return; }
  try {
    const pd = await DL.getPassenger(currentPassenger.phone) || {};
    const cs = pd.creditScore != null ? pd.creditScore : 100;
    const su = pd.suspendedUntil || 0;
    const t = getToday();
    if (!isWeekday()) {
      c.innerHTML = '<div class="card"><div class="card-title">📅 今日不設留座</div><div style="font-size:13px;color:#64748b;line-height:1.8;">星期六, 日及公眾假期採循環線運作，不設留座。</div></div><button class="btn btn-outline" onclick="passengerLogout()">登出</button>';
      return;
    }
    if (su > now()) {
      const r = Math.ceil((su - now()) / (24 * 60 * 60 * 1000));
      c.innerHTML = '<div class="card" style="border-color:#ef4444;background:#450a0a;"><div style="font-size:14px;font-weight:600;color:#f87171;">⛔ 預約資格已暫停</div><div style="font-size:12px;color:#fca5a5;margin-top:6px;">剩餘 ' + r + ' 日。</div></div><button class="btn btn-outline" onclick="passengerLogout()">登出</button>';
      return;
    }
    let h = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:15px;font-weight:600;">👤 ' + esc(pd.name || currentPassenger.name) + '</div><div style="font-size:12px;color:#64748b;margin-top:2px;">' + esc(currentPassenger.phone) + '</div></div><div style="text-align:right;"><div style="font-size:20px;font-weight:700;color:' + (cs >= 80 ? '#22c55e' : cs >= 50 ? '#f59e0b' : '#ef4444') + ';">' + cs + '</div><div style="font-size:10px;color:#64748b;">信用分</div></div></div></div>';
    const tb = await DL.getBookings(t);
    const sc = await DL.getAllSeatConfigs(t);
    h += '<div class="card-title" style="margin-bottom:10px;">🌅 早上固定班次 · 大棠黃泥墩開出</div>';
    for (const tm of SM) h += renderShiftCard(t, tm, tb, sc);
    if (isLoopHour()) {
      h += '<div class="loop-card"><div class="title">🔄 循環線留位（07:00 - 18:00）</div><div class="sub">冇固定班次，留位後司機確認，有位就上車</div></div><div id="loop-section"></div>';
    }
    h += '<div class="card-title" style="margin:16px 0 10px;">🌆 傍晚固定班次 · 元朗港鐵站 H 出口開出</div>';
    for (const tm of SE) h += renderShiftCard(t, tm, tb, sc);
    const mb = Object.values(tb).filter(b => b.passengerPhone === currentPassenger.phone && b.status !== 'cancelled' && b.status !== 'rejected');
    if (mb.length > 0) {
      h += '<div class="card-title" style="margin:16px 0 10px;">🎫 我的固定班次預約</div>';
      mb.sort((a, b) => a.time.localeCompare(b.time));
      mb.forEach(b => {
        const m = {
          'pending': { text: '⏳ 等待司機確認', color: '#fdba74', border: '#fb923c' },
          'reserved': { text: '✅ 已確認留位', color: '#4ade80', border: '#22c55e' },
          'arrived': { text: '✅ 已到站', color: '#4ade80', border: '#22c55e' },
          'boarded': { text: '🚐 已上車', color: '#7dd3fc', border: '#38bdf8' },
          'no-show': { text: '❌ 未到站', color: '#f87171', border: '#ef4444' }
        };
        const s = m[b.status] || { text: b.status, color: '#94a3b8', border: '#334155' };
        h += '<div class="card" style="padding:12px;border-color:' + s.border + ';cursor:pointer;" onclick="openWaitingRoom(\'' + b.id + '\',\'' + b.date + '\',\'' + b.time + '\')"><div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:15px;font-weight:600;">' + esc(b.time) + ' 班次</div><div style="font-size:12px;color:#64748b;">' + esc(getOrig(b.time)) + ' · ' + b.seats + ' 人</div></div><div style="font-size:13px;color:' + s.color + ';font-weight:700;">' + s.text + '</div></div></div>';
      });
    }
    h += '<button class="btn btn-outline" style="margin-top:20px;" onclick="passengerLogout()">登出</button>';
    c.innerHTML = h;
    if (isLoopHour()) loadLoopSection();
  } catch (e) {
    c.innerHTML = '<div class="card" style="border-color:#ef4444;"><div style="color:#f87171;">⚠️ ' + esc(e.message) + '</div></div><button class="btn btn-primary" onclick="renderPassengerHome()">🔄 重試</button>';
  }
}

async function loadLoopSection() {
  const s = document.getElementById('loop-section');
  if (!s) return;
  s.innerHTML = '<div class="card" style="text-align:center;color:#64748b;padding:20px;">🔄 載入中...</div>';
  const t = getToday();
  if (loopPassengerRef && loopPassengerHandler) { try { loopPassengerRef.off('value', loopPassengerHandler); } catch (e) {} loopPassengerRef = null; loopPassengerHandler = null; }
  const buses = await DL.getActiveBuses();
  let totalSeats = 0, currentPax = 0;
  buses.forEach(b => { totalSeats += (b.carSeats || 16); currentPax += (b.passengerCount || 0); });
  const availSeats = Math.max(0, totalSeats - currentPax);
  const r = db.ref('booking_loop/' + t);
  const h = async (snap) => {
    const all = snap.val() || {};
    const my = Object.values(all).find(x => x.phone === currentPassenger.phone && (x.status === 'pending' || x.status === 'reserved'));
    const waitingCount = Object.values(all).filter(x => x.status === 'pending').length;
    const reservedCount = Object.values(all).filter(x => x.status === 'reserved').length;
    const el = document.getElementById('loop-section');
    if (!el) return;
    if (my) {
      if (my.status === 'pending') {
        el.innerHTML = '<div class="loop-card" style="background:linear-gradient(135deg,#431407,#7c2d12);border-color:#fb923c;"><div class="title" style="color:#fdba74;">⏳ 等待司機確認</div><div class="sub" style="color:#fed7aa;">你嘅循環線留位已送出<br>司機確認後會即時通知你<br>前面仲有 <strong>' + Math.max(0, waitingCount - 1) + '</strong> 位乘客</div><button class="btn btn-danger" style="margin-top:12px;" onclick="loopCancel()">取消留位</button></div>';
      } else if (my.status === 'reserved') {
        el.innerHTML = '<div class="loop-card" style="background:linear-gradient(135deg,#052e16,#065f46);border-color:#22c55e;"><div class="title" style="color:#4ade80;">✅ 已確認留位</div><div class="sub" style="color:#86efac;">司機已確認你嘅留位<br>請到站頭等候上車<br>上車後撳「我已上車」</div><button class="btn btn-success" style="margin-top:12px;" onclick="loopBoarded()">🚐 我已上車</button><button class="btn btn-outline" style="margin-top:8px;" onclick="loopCancel()">取消留位</button></div>';
      }
    } else {
      el.innerHTML = '<div class="loop-card"><div class="title" style="color:#7dd3fc;">🔄 循環線留位</div><div class="sub" style="color:#bae6fd;">而家循環線時段（07:00 - 18:00）<br>可留位座位：<strong style="font-size:18px;color:#4ade80;">' + availSeats + '</strong> 個<br>候補中：<strong>' + waitingCount + '</strong> 人 · 已確認：<strong>' + reservedCount + '</strong> 人<br><br>留位後司機確認，有位就上車</div><button class="btn btn-primary" style="margin-top:12px;" onclick="loopJoin()" ' + (availSeats <= 0 ? 'disabled' : '') + '>' + (availSeats <= 0 ? '❌ 暫無座位' : '✅ 立即留位') + '</button></div>';
    }
  };
  r.on('value', h);
  loopPassengerRef = r;
  loopPassengerHandler = h;
}

async function loopJoin() {
  try {
    await ensureAuth();
    const t = getToday();
    const all = await DL.getLoopQueue(t);
    const ex = Object.values(all).find(x => x.phone === currentPassenger.phone && (x.status === 'pending' || x.status === 'reserved'));
    if (ex) { toast('⚠️ 你已經留咗位'); return; }
    const pd = await DL.getPassenger(currentPassenger.phone) || {};
    const cs = pd.creditScore != null ? pd.creditScore : 100;
    if (cs < 50) { toast('⚠️ 信用分不足'); return; }
    await DL.addLoopQueue(t, { phone: currentPassenger.phone, name: pd.name || currentPassenger.name, seats: 1, status: 'pending', date: t });
    toast('✅ 已送出，等待司機確認', 3000);
  } catch (e) { toast('❌ 留位失敗：' + e.message); }
}

async function loopCancel() {
  if (!confirm('確定取消留位？')) return;
  try {
    const t = getToday();
    const all = await DL.getLoopQueue(t);
    const my = Object.values(all).find(x => x.phone === currentPassenger.phone && (x.status === 'pending' || x.status === 'reserved'));
    if (my) await DL.removeLoopQueue(t, my.id);
    toast('已取消留位');
  } catch (e) { toast('取消失敗：' + e.message); }
}

async function loopBoarded() {
  if (!confirm('確定你已上車？')) return;
  try {
    const t = getToday();
    const all = await DL.getLoopQueue(t);
    const my = Object.values(all).find(x => x.phone === currentPassenger.phone && x.status === 'reserved');
    if (!my) { toast('搵唔到留位記錄'); return; }
    await DL.updateLoopQueue(t, my.id, { status: 'boarded', boardedAt: now() });
    
    // 循環線精準車牌計數連動
    const buses = await DL.getActiveBuses();
    if (buses.length > 0) {
      const targetPlate = buses[0].plate;
      await db.ref('van/active_buses/' + targetPlate + '/passengerCount').transaction(c => (c || 0) + (my.seats || 1));
    }
    toast('✅ 已上車，祝旅途愉快', 3000);
    renderPassengerHome();
  } catch (e) { toast('❌ 失敗：' + e.message); }
}

function renderShiftCard(d, t, ab, sc) {
  const sid = getSid(d, t);
  const cfg = sc[t.replace(':', '')];
  const dir = getDir(t);
  if (!cfg || !cfg.seats) {
    return '<div class="shift-card full" style="opacity:.4;"><div><div class="shift-time">' + esc(t) + '</div><div class="shift-info ' + (dir === 'morning' ? 'morning' : 'evening') + '">' + esc(getOrigL(t)) + '</div><div style="margin-top:6px;"><span class="badge badge-red">未開放</span></div></div><div class="shift-seats"><div class="num zero">—</div><div class="label">未開放</div></div></div>';
  }
  const quota = cfg.quota || cfg.seats;
  const used = Object.values(ab).filter(b => b.scheduleId === sid && ['pending', 'reserved', 'arrived', 'boarded'].includes(b.status)).reduce((s, b) => s + (b.seats || 0), 0);
  const rem = quota - used;
  const full = rem <= 0;
  const my = Object.values(ab).find(b => b.scheduleId === sid && b.passengerPhone === currentPassenger.phone && b.status !== 'cancelled' && b.status !== 'rejected' && b.status !== 'no-show');
  let bg = '';
  if (my) {
    if (my.status === 'pending') bg = '<span class="badge badge-orange">⏳ 等待司機確認</span>';
    else if (my.status === 'reserved') bg = '<span class="badge badge-yellow">✅ 已確認</span>';
    else if (my.status === 'arrived') bg = '<span class="badge badge-green">已到站</span>';
    else if (my.status === 'boarded') bg = '<span class="badge badge-blue">已上車</span>';
  }
  const clk = !full || my;
  return '<div class="shift-card ' + (full && !my ? 'full' : '') + '" ' + (clk ? 'onclick="selectShift(\'' + d + '\',\'' + t + '\')"' : '') + '><div><div class="shift-time">' + esc(t) + '</div><div class="shift-info ' + (dir === 'morning' ? 'morning' : 'evening') + '">' + esc(getOrigL(t)) + '</div>' + (bg ? '<div style="margin-top:6px;">' + bg + '</div>' : '') + '<div style="font-size:10px;color:#64748b;margin-top:4px;">留位額：' + quota + ' 個</div></div><div class="shift-seats"><div class="num ' + (rem <= 0 ? 'zero' : rem <= 2 ? 'low' : '') + '">' + rem + '</div><div class="label">剩餘留位</div></div></div>';
}

function renderPassengerLogin(c) {
  c.innerHTML = '<div class="card"><div class="card-title">📱 輸入電話號碼開始預約</div><div class="input-group"><label>電話號碼（8 位數字）</label><input type="tel" id="login-phone" placeholder="例如：91234567" maxlength="8" inputmode="numeric"></div><div class="input-group"><label>姓名</label><input type="text" id="login-name" placeholder="例如：陳先生" maxlength="20"></div><button class="btn btn-primary" id="passenger-login-btn" onclick="passengerLogin()">確認</button></div>';
}

async function passengerLogin() {
  const btn = document.getElementById('passenger-login-btn');
  if (btn) { btn.disabled = true; btn.textContent = '處理中...'; }
  const phone = document.getElementById('login-phone').value.trim();
  const name = document.getElementById('login-name').value.trim();
  if (!/^\d{8}$/.test(phone)) { toast('請輸入 8 位數字'); if (btn) { btn.disabled = false; btn.textContent = '確認'; } return; }
  if (!name || name.length > 20) { toast('請輸入姓名（20 字內）'); if (btn) { btn.disabled = false; btn.textContent = '確認'; } return; }
  try {
    await ensureAuth();
    const ex = await DL.getPassenger(phone) || {};
    if (ex.suspendedUntil && ex.suspendedUntil > now()) {
      const r = Math.ceil((ex.suspendedUntil - now()) / (24 * 60 * 60 * 1000));
      toast('預約資格暫停中，剩餘 ' + r + ' 日');
      if (btn) { btn.disabled = false; btn.textContent = '確認'; }
      return;
    }
    await DL.savePassenger(phone, {
      name: name, phone: phone,
      creditScore: ex.creditScore != null ? ex.creditScore : 100,
      totalBookings: ex.totalBookings || 0,
      totalNoShows: ex.totalNoShows || 0,
      lastLogin: now()
    });
    currentPassenger = { phone: phone, name: name };
    savePassengerSession(currentPassenger);
    toast('✅ 登入成功');
    renderPassengerHome();
  } catch (e) {
    toast('❌ ' + e.message, 5000);
    if (btn) { btn.disabled = false; btn.textContent = '確認'; }
  }
}

function passengerLogout() {
  currentPassenger = null;
  clearPassengerSession();
  if (waitingRoomListener) { try { waitingRoomListener.off(); } catch (e) {} waitingRoomListener = null; }
  if (loopPassengerRef && loopPassengerHandler) { try { loopPassengerRef.off('value', loopPassengerHandler); } catch (e) {} loopPassengerRef = null; loopPassengerHandler = null; }
  renderPassengerHome();
}

async function selectShift(d, t) {
  const c = document.getElementById('booking-content');
  try {
    const cfg = await DL.getSeatConfig(d, t);
    if (!cfg || !cfg.seats) { toast('此班次未開放預約'); return; }
    const quota = cfg.quota || cfg.seats;
    const tb = await DL.getBookings(d);
    const sid = getSid(d, t);
    const used = Object.values(tb).filter(b => b.scheduleId === sid && ['pending', 'reserved', 'arrived', 'boarded'].includes(b.status)).reduce((s, b) => s + (b.seats || 0), 0);
    const rem = quota - used;
    const my = Object.values(tb).find(b => b.scheduleId === sid && b.passengerPhone === currentPassenger.phone && b.status !== 'cancelled' && b.status !== 'rejected' && b.status !== 'no-show');
    if (my) { toast('你已經預約咗呢個班次'); return; }
    const pd = await DL.getPassenger(currentPassenger.phone) || {};
    c.innerHTML = '<div style="display:flex;align-items:center;margin-bottom:16px;"><button class="btn btn-outline btn-sm" onclick="renderPassengerHome()">← 返回</button></div><div class="card"><div class="card-title">🚐 預約班次</div><div style="font-size:28px;font-weight:700;color:#38bdf8;">' + esc(t) + '</div><div style="font-size:13px;color:#64748b;margin-top:4px;">' + esc(d) + '</div><div style="font-size:13px;margin-top:6px;font-weight:600;color:' + (getDir(t) === 'morning' ? '#4ade80' : '#fdba74') + ';">' + esc(getOrigL(t)) + '</div><div style="font-size:13px;color:#94a3b8;margin-top:4px;">→ ' + esc(getDest(t)) + '</div><div style="font-size:13px;color:#22c55e;margin-top:8px;">剩餘留位額：' + rem + ' 個（總共 ' + quota + '）</div></div><div class="card"><div class="input-group"><label>姓名</label><input type="text" id="book-name" value="' + esc(pd.name || currentPassenger.name) + '" maxlength="20"></div><div class="input-group"><label>人數</label><select id="book-seats"><option value="1">1 人</option><option value="2">2 人</option></select></div><button class="btn btn-primary" id="confirm-booking-btn" onclick="confirmBooking(\'' + d + '\',\'' + t + '\')">送出預約（待司機確認）</button><div style="font-size:12px;color:#94a3b8;margin-top:10px;text-align:center;line-height:1.6;">⚠️ 送出後需要司機確認<br>司機確認後才作實留位</div></div>';
  } catch (e) { toast('載入失敗：' + e.message); }
}

// 防超賣原子性檢查邏輯
async function confirmBooking(d, t) {
  const btn = document.getElementById('confirm-booking-btn');
  if (btn) { btn.disabled = true; btn.textContent = '處理中...'; }
  const name = document.getElementById('book-name').value.trim();
  const seats = parseInt(document.getElementById('book-seats').value);
  if (!name || name.length > 20) { toast('請輸入有效姓名'); if (btn) { btn.disabled = false; btn.textContent = '送出預約'; } return; }
  try {
    await ensureAuth();
    const cfg = await DL.getSeatConfig(d, t);
    if (!cfg || !cfg.seats) throw new Error('此班次未開放預約');
    const quota = cfg.quota || cfg.seats;
    const sid = getSid(d, t);
    
    const tbSnap = await db.ref('booking/' + d).once('value');
    const tb = tbSnap.val() || {};
    const used = Object.values(tb).filter(b => b.scheduleId === sid && ['pending', 'reserved', 'arrived', 'boarded'].includes(b.status)).reduce((s, b) => s + (b.seats || 0), 0);
    
    if (used + seats > quota) throw new Error('對不起，剛才有其他乘客搶先預約，此班次剩餘留位額不足！');
    
    const b = { scheduleId: sid, date: d, time: t, passengerName: name, passengerPhone: currentPassenger.phone, seats: seats, status: 'pending', direction: getDir(t), createdAt: now() };
    const sv = await DL.addBooking(d, b);
    try {
      const pd = await DL.getPassenger(currentPassenger.phone) || {};
      await DL.savePassenger(currentPassenger.phone, { totalBookings: (pd.totalBookings || 0) + 1, lastBooking: now() });
    } catch (e) {}
    toast('✅ 已送出，等待司機確認', 3000);
    openWaitingRoom(sv.id, d, t);
  } catch (e) {
    toast('❌ ' + e.message, 5000);
    if (btn) { btn.disabled = false; btn.textContent = '送出預約'; }
  }
}

function openWaitingRoom(id, d, t) { renderWaitingRoom(id, d, t); }
async function renderWaitingRoom(id, d, t) {
  if (waitingRoomListener) { try { waitingRoomListener.off(); } catch (e) {} waitingRoomListener = null; }
  const r = db.ref('booking/' + d + '/' + id);
  const h = (snap) => { const b = snap.val(); if (!b) { renderPassengerHome(); return; } renderWaitingRoomUI(b, d, id); };
  r.on('value', h);
  waitingRoomListener = r;
  const s = await r.once('value');
  const b = s.val();
  if (!b) { renderPassengerHome(); return; }
  renderWaitingRoomUI(b, d, id);
}

function renderWaitingRoomUI(b, d, id) {
  const c = document.getElementById('booking-content');
  let sb = '';
  if (b.status === 'pending') {
    sb = '<div class="card" style="border-color:#fb923c;background:#431407;text-align:center;padding:24px;"><div style="font-size:60px;">⏳</div><h2 style="color:#fdba74;font-size:22px;margin:12px 0 8px;">等待司機確認</h2><p style="font-size:14px;color:#fdba74;">你嘅預約已送出<br>司機確認後會即時通知你</p></div>';
  } else if (b.status === 'reserved') {
    sb = '<div class="card" style="border-color:#22c55e;background:#052e16;text-align:center;padding:24px;"><div style="font-size:60px;">✅</div><h2 style="color:#22c55e;font-size:22px;margin:12px 0 8px;">已確認留位！</h2><p style="font-size:14px;color:#86efac;">司機已確認你嘅預約</p></div>';
  } else if (b.status === 'rejected') {
    sb = '<div class="card" style="border-color:#ef4444;background:#450a0a;text-align:center;padding:24px;"><div style="font-size:60px;">❌</div><h2 style="color:#f87171;font-size:22px;margin:12px 0 8px;">預約已被拒絕</h2><p style="font-size:14px;color:#fca5a5;">' + esc(b.rejectReason ? '原因：' + b.rejectReason : '司機未能確認') + '</p></div>';
  } else if (b.status === 'boarded') {
    sb = '<div class="card" style="text-align:center;padding:24px;"><div style="font-size:60px;">🚐</div><h2 style="color:#7dd3fc;font-size:22px;margin:12px 0 8px;">已上車</h2></div>';
  } else if (b.status === 'cancelled') {
    sb = '<div class="card" style="text-align:center;color:#94a3b8;">已取消</div>';
  }
  let h = '<div style="display:flex;align-items:center;margin-bottom:16px;"><button class="btn btn-outline btn-sm" onclick="renderPassengerHome()">← 返回</button></div>' + sb + '<div class="card" style="text-align:center;"><div style="font-size:14px;color:#64748b;">預約編號</div><div style="font-size:20px;font-weight:700;color:#38bdf8;letter-spacing:2px;margin:8px 0;">' + esc(b.id.substring(0, 8).toUpperCase()) + '</div><div style="font-size:13px;color:#94a3b8;">' + esc(b.time) + ' 班次 · ' + b.seats + ' 人</div></div>';
  if (b.status === 'pending' || b.status === 'reserved') {
    h += '<button class="btn btn-outline" onclick="cancelBooking(\'' + b.id + '\',\'' + b.date + '\')">取消預約</button>';
    if (b.status === 'reserved') {
      h += '<button class="btn btn-success" style="margin-top:10px;" onclick="passengerBoardFixed(\'' + b.id + '\',\'' + b.date + '\')">🚐 我已上車</button>';
    }
  }
  c.innerHTML = h;
}

async function passengerBoardFixed(id, d) {
  if (!confirm('確定你已上車？')) return;
  try {
    await DL.updateBooking(d, id, { status: 'boarded', boardedAt: now() });
    toast('✅ 已上車');
    renderPassengerHome();
  } catch (e) { toast('失敗：' + e.message); }
}

async function cancelBooking(id, d) {
  if (!confirm('確定取消預約？')) return;
  try {
    const b = (await DL.getBookings(d))[id];
    await DL.cancelBooking(d || getToday(), id);
    if (b && b.status === 'reserved') {
      const cfg = await DL.getSeatConfig(d, b.time);
      if (cfg && cfg.plate) {
        await db.ref('van/active_buses/' + cfg.plate + '/passengerCount').transaction(c => Math.max(0, (c || 0) - (b.seats || 1)));
      }
    }
    toast('已取消預約');
    if (waitingRoomListener) { try { waitingRoomListener.off(); } catch (e) {} waitingRoomListener = null; }
    renderPassengerHome();
  } catch (e) { toast('取消失敗：' + e.message); }
}

function renderAdmin() {
  document.getElementById('admin-content').innerHTML = '<div class="card"><div class="card-title">⚙️ 管理端</div><div style="font-size:13px;color:#64748b;">留座系統運作正常。</div></div>';
}
function renderInfo() {
  document.getElementById('info-content').innerHTML = '<div class="card"><div class="card-title">🚐 服務資訊</div><div style="font-size:13px;line-height:1.8;">大棠黃泥墩 ↔ 元朗港鐵站 H 出口</div></div>';
}

(async function init() {
  currentPassenger = loadPassengerSession();
  try { await ensureAuth(); } catch (e) {}
  updateHomeStats();
})();
</script>
