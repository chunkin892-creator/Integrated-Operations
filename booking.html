<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>浚鍵管理有限公司 · 小巴留座系統</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    background: #0a0f1a;
    color: #e2e8f0;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  .header {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    padding: 18px 16px;
    text-align: center;
    border-bottom: 1px solid #1e293b;
    position: sticky; top: 0; z-index: 100;
  }
  .header h1 { font-size: 16px; font-weight: 700; color: #38bdf8; letter-spacing: 0.5px; }
  .header .sub { font-size: 11px; color: #64748b; margin-top: 4px; }
  .header .company { font-size: 13px; color: #94a3b8; font-weight: 600; }

  .screen { display: none; flex: 1; padding: 16px; }
  .screen.active { display: block; }

  .btn {
    display: block; width: 100%; padding: 16px; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    text-align: center;
  }
  .btn-primary { background: #0ea5e9; color: #fff; }
  .btn-primary:active { background: #0284c7; transform: scale(0.98); }
  .btn-success { background: #22c55e; color: #fff; }
  .btn-success:active { background: #16a34a; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:active { background: #dc2626; }
  .btn-outline { background: transparent; border: 1px solid #334155; color: #94a3b8; }
  .btn-outline:active { background: #1e293b; }
  .btn-sm { padding: 10px 16px; font-size: 14px; border-radius: 8px; width: auto; display: inline-block; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .card {
    background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 12px;
    border: 1px solid #334155;
  }
  .card-title { font-size: 14px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }

  .module-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .module-card {
    background: #1e293b; border-radius: 16px; padding: 20px 16px;
    border: 1px solid #334155; text-align: center; cursor: pointer;
    transition: all 0.2s;
  }
  .module-card:active { background: #334155; transform: scale(0.97); }
  .module-card .icon { font-size: 32px; margin-bottom: 8px; }
  .module-card .name { font-size: 14px; font-weight: 600; color: #f1f5f9; }
  .module-card .desc { font-size: 11px; color: #64748b; margin-top: 4px; }

  .shift-card {
    background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 10px;
    border: 1px solid #334155; display: flex; justify-content: space-between;
    align-items: center; cursor: pointer; transition: all 0.2s;
  }
  .shift-card:active { background: #334155; }
  .shift-card.full { opacity: 0.5; }
  .shift-time { font-size: 22px; font-weight: 700; color: #f1f5f9; }
  .shift-info { font-size: 12px; color: #64748b; margin-top: 4px; }
  .shift-seats { text-align: right; }
  .shift-seats .num { font-size: 28px; font-weight: 700; color: #22c55e; }
  .shift-seats .num.low { color: #f59e0b; }
  .shift-seats .num.zero { color: #ef4444; }
  .shift-seats .label { font-size: 11px; color: #64748b; }

  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
  }
  .badge-green { background: #052e16; color: #4ade80; }
  .badge-yellow { background: #422006; color: #fbbf24; }
  .badge-red { background: #450a0a; color: #f87171; }
  .badge-blue { background: #082f49; color: #38bdf8; }

  .input-group { margin-bottom: 14px; }
  .input-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  .input-group input, .input-group select {
    width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155;
    background: #0f172a; color: #f1f5f9; font-size: 16px; outline: none;
  }
  .input-group input:focus, .input-group select:focus { border-color: #0ea5e9; }

  .gps-box {
    background: #0f172a; border-radius: 12px; padding: 16px; text-align: center;
    border: 2px dashed #334155; margin: 16px 0;
  }
  .gps-box.arrived { border-color: #22c55e; background: #052e16; }
  .gps-box.waiting { border-color: #f59e0b; background: #422006; }
  .gps-icon { font-size: 40px; margin-bottom: 8px; }
  .gps-text { font-size: 14px; font-weight: 600; }
  .gps-sub { font-size: 12px; color: #64748b; margin-top: 4px; }

  .booking-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px; border-radius: 10px; margin-bottom: 8px;
    background: #0f172a; border-left: 4px solid #334155;
  }
  .booking-item.arrived { border-left-color: #22c55e; }
  .booking-item.not-arrived { border-left-color: #f59e0b; }
  .booking-item.empty { border-left-color: #334155; opacity: 0.4; }
  .booking-name { font-size: 15px; font-weight: 600; }
  .booking-phone { font-size: 12px; color: #64748b; }
  .booking-status { font-size: 20px; }

  .stats { display: flex; gap: 8px; margin-bottom: 16px; }
  .stat {
    flex: 1; background: #1e293b; border-radius: 10px; padding: 12px;
    text-align: center; border: 1px solid #334155;
  }
  .stat .num { font-size: 24px; font-weight: 700; }
  .stat .lbl { font-size: 11px; color: #64748b; margin-top: 2px; }
  .stat.green .num { color: #22c55e; }
  .stat.yellow .num { color: #f59e0b; }
  .stat.blue .num { color: #38bdf8; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #f1f5f9; padding: 12px 24px; border-radius: 10px;
    font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s;
    border: 1px solid #334155; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  .bottom-nav {
    display: flex; background: #1e293b; border-top: 1px solid #334155;
    position: sticky; bottom: 0;
  }
  .nav-item {
    flex: 1; padding: 12px; text-align: center; font-size: 11px;
    color: #64748b; cursor: pointer; border: none; background: none;
  }
  .nav-item.active { color: #38bdf8; }
  .nav-item .icon { font-size: 20px; display: block; margin-bottom: 2px; }

  .credit-bar {
    height: 8px; border-radius: 4px; background: #334155; overflow: hidden; margin-top: 6px;
  }
  .credit-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
  .credit-fill.high { background: #22c55e; }
  .credit-fill.mid { background: #f59e0b; }
  .credit-fill.low { background: #ef4444; }

  .timer { font-size: 13px; color: #f59e0b; font-weight: 600; }

  .empty { text-align: center; padding: 40px 20px; color: #475569; }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="app">

  <div class="header" id="app-header">
    <div class="company">浚鍵管理有限公司</div>
    <h1 id="header-title">小巴留座系統</h1>
    <div class="sub" id="header-sub">大棠黃泥墩 ↔ 元朗西鐵站</div>
  </div>

  <!-- 首頁 -->
  <div class="screen active" id="screen-home">
    <div class="module-grid">
      <div class="module-card" onclick="openModule('booking')">
        <div class="icon">🚐</div>
        <div class="name">小巴留座</div>
        <div class="desc">乘客預約</div>
      </div>
      <div class="module-card" onclick="openModule('driver')">

        <div class="name">司機端</div>

      </div>
      <div class="module-card" onclick="openModule('admin')">
        <div class="icon">⚙️</div>
        <div class="name">管理</div>
        <div class="desc">座位 · 設定</div>
      </div>
      <div class="module-card" onclick="openModule('info')">
        <div class="icon">ℹ️</div>
        <div class="name">服務資訊</div>
        <div class="desc">班次 · 時間</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">📊 今日概況</div>
      <div class="stats">
        <div class="stat green"><div class="num" id="home-arrived">0</div><div class="lbl">已到站</div></div>
        <div class="stat yellow"><div class="num" id="home-pending">0</div><div class="lbl">待確認</div></div>
        <div class="stat blue"><div class="num" id="home-active">0</div><div class="lbl">當值中</div></div>
      </div>
    </div>
  </div>

  <!-- 小巴留座（乘客端） -->
  <div class="screen" id="screen-booking">
    <div id="booking-content"></div>
  </div>

  <!-- 司機端 -->
  <div class="screen" id="screen-driver">
    <div id="driver-content"></div>
  </div>

  <!-- 管理 -->
  <div class="screen" id="screen-admin">
    <div id="admin-content"></div>
  </div>

  <!-- 服務資訊 -->
  <div class="screen" id="screen-info">
    <div id="info-content"></div>
  </div>

  <div class="bottom-nav" id="bottom-nav" style="display:none;">
    <button class="nav-item active" onclick="navTo('home')"><span class="icon">🏠</span>首頁</button>
    <button class="nav-item" onclick="navTo('booking')"><span class="icon">🚐</span>留座</button>
    <button class="nav-item" onclick="navTo('driver')"><span class="icon">🧑‍✈️</span>司機</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// ============================================================
// 浚鍵管理有限公司 · 小巴留座系統
// Firebase: triple-login-version（同西鐵小巴共用）
// ============================================================

const firebaseConfig = {
  apiKey: "AIzaSyAX7Zy5br1ozGOGxHvDeFNY-Ldcjjw8Qgc",
  authDomain: "triple-login-version.firebaseapp.com",
  databaseURL: "https://triple-login-version-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "triple-login-version",
  storageBucket: "triple-login-version.firebasestorage.app",
  messagingSenderId: "66459706459",
  appId: "1:66459706459:web:28f99a455652f393da0b7e"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// ============================================================
// 常數設定
// ============================================================

const COMPANY = '浚鍵管理有限公司';

// GPS 座標
const GPS_WONG = { lat: 22.416280, lng: 114.021977 }; // 大棠黃泥墩
const GPS_YUEN = { lat: 22.445847, lng: 114.037022 }; // 元朗站 H 出口（朗明街）

// 班次表（平日）
const SHIFTS_MORNING = ['06:20', '06:30', '06:40', '06:50'];
const SHIFTS_EVENING = ['18:15', '18:30', '18:45', '19:00', '19:15', '19:30', '19:45', '20:00', '20:20'];

const GPS_RADIUS = 80; // 到站半徑（米）
const ARRIVE_WINDOW = 15 * 60 * 1000; // 發車前 15 分鐘開始追蹤

// ============================================================
// 工具函數
// ============================================================

function toast(msg, duration = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

function now() { return Date.now(); }

function getToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function isWeekday() {
  const day = new Date().getDay();
  return day >= 1 && day <= 5; // 星期一至五
}

function distance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function getShiftTime(date, time) {
  const [h, m] = time.split(':').map(Number);
  const d = new Date(date + 'T00:00:00');
  d.setHours(h, m, 0, 0);
  return d.getTime();
}

function getScheduleId(date, time) {
  return date + '_' + time.replace(':', '');
}

function getShiftDirection(time) {
  // 早上班次：黃泥墩開出，往元朗
  // 傍晚班次：元朗站開出，往黃泥墩
  const hour = parseInt(time.split(':')[0]);
  return hour < 12 ? 'morning' : 'evening';
}

function getShiftGPS(time) {
  return getShiftDirection(time) === 'morning' ? GPS_WONG : GPS_YUEN;
}

function getShiftOrigin(time) {
  return getShiftDirection(time) === 'morning' ? '大棠黃泥墩' : '元朗站 H 出口';
}

function getShiftDestination(time) {
  return getShiftDirection(time) === 'morning' ? '元朗西鐵站' : '大棠黃泥墩';
}

function getTodayShifts() {
  if (!isWeekday()) return [];
  return [...SHIFTS_MORNING, ...SHIFTS_EVENING];
}

// ============================================================
// Firebase 資料層
// ============================================================

const DataLayer = {

  // ---------- 司機 ----------
  async getDriverByIdentifier(identifier) {
    const snap = await db.ref('drivers').orderByChild('identifier').equalTo(identifier).once('value');
    if (!snap.exists()) return null;
    let driver = null;
    snap.forEach(c => { driver = { key: c.key, ...c.val() }; });
    return driver;
  },

  async getDriverByPhone(phone) {
    return DataLayer.getDriverByIdentifier(phone);
  },

  // ---------- 當值狀態 ----------
  async getActiveBus(plate) {
    const snap = await db.ref('van/active_buses/' + plate).once('value');
    return snap.val();
  },

  watchActiveBus(plate, cb) {
    const ref = db.ref('van/active_buses/' + plate);
    const handler = snap => cb(snap.val());
    ref.on('value', handler);
    return () => ref.off('value', handler);
  },

  async setDriverSeats(plate, seats) {
    return db.ref('van/active_buses/' + plate).update({
      carSeats: seats,
      seatsUpdatedAt: now()
    });
  },

  // ---------- 留座 ----------
  async getBookings(date) {
    const snap = await db.ref('booking/' + date).once('value');
    return snap.val() || {};
  },

  watchBookings(date, cb) {
    const ref = db.ref('booking/' + date);
    const handler = snap => cb(snap.val() || {});
    ref.on('value', handler);
    return () => ref.off('value', handler);
  },

  async addBooking(date, booking) {
    const ref = db.ref('booking/' + date).push();
    booking.id = ref.key;
    booking.createdAt = now();
    await ref.set(booking);
    return booking;
  },

  async updateBooking(date, id, patch) {
    return db.ref('booking/' + date + '/' + id).update(patch);
  },

  async cancelBooking(date, id) {
    return DataLayer.updateBooking(date, id, { status: 'cancelled', cancelledAt: now() });
  },

  // ---------- 乘客 ----------
  async getPassenger(phone) {
    const snap = await db.ref('booking_passengers/' + phone).once('value');
    return snap.val();
  },

  async savePassenger(phone, data) {
    return db.ref('booking_passengers/' + phone).update(data);
  },

  // ---------- 座位設定 ----------
  async getSeatConfig(date, time) {
    const snap = await db.ref('booking_seats/' + date + '/' + time.replace(':','')).once('value');
    return snap.val();
  },

  async setSeatConfig(date, time, seats, plate) {
    return db.ref('booking_seats/' + date + '/' + time.replace(':','')).set({
      seats: seats,
      plate: plate,
      setAt: now()
    });
  }
};

// ============================================================
// 全域狀態
// ============================================================

let currentDriver = null; // { identifier, plate, ... }
let currentPassenger = null; // { phone, name }
let currentScreen = 'home';
let bookingListenerOff = null;
let activeBusListenerOff = null;

// 司機登入狀態（localStorage 記住）
function saveDriverSession(driver) {
  try { localStorage.setItem('booking_driver', JSON.stringify(driver)); } catch(e) {}
}
function loadDriverSession() {
  try {
    const raw = localStorage.getItem('booking_driver');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function clearDriverSession() {
  try { localStorage.removeItem('booking_driver'); } catch(e) {}
}

// 乘客登入狀態（localStorage 記住）
function savePassengerSession(p) {
  try { localStorage.setItem('booking_passenger', JSON.stringify(p)); } catch(e) {}
}
function loadPassengerSession() {
  try {
    const raw = localStorage.getItem('booking_passenger');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function clearPassengerSession() {
  try { localStorage.removeItem('booking_passenger'); } catch(e) {}
}

// ============================================================
// 導航
// ============================================================

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  currentScreen = id.replace('screen-', '');
}

function navTo(module) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event.target.closest('.nav-item').classList.add('active');
  openModule(module);
}

function openModule(module) {
  document.getElementById('bottom-nav').style.display = 'flex';
  if (module === 'home') {
    showScreen('screen-home');
    updateHomeStats();
  } else if (module === 'booking') {
    showScreen('screen-booking');
    renderPassengerHome();
  } else if (module === 'driver') {
    showScreen('screen-driver');
    renderDriverHome();
  } else if (module === 'admin') {
    showScreen('screen-admin');
    renderAdmin();
  } else if (module === 'info') {
    showScreen('screen-info');
    renderInfo();
  }
}

async function updateHomeStats() {
  const today = getToday();
  const bookings = await DataLayer.getBookings(today);
  let arrived = 0, pending = 0;
  Object.values(bookings).forEach(b => {
    if (b.status === 'arrived' || b.status === 'boarded') arrived++;
    if (b.status === 'reserved') pending++;
  });
  document.getElementById('home-arrived').textContent = arrived;
  document.getElementById('home-pending').textContent = pending;
  document.getElementById('home-active').textContent = '—';
}<script>
// ============================================================
// 乘客端
// ============================================================

async function renderPassengerHome() {
  const content = document.getElementById('booking-content');
  
  // 檢查乘客登入狀態
  if (!currentPassenger) {
    currentPassenger = loadPassengerSession();
  }
  
  if (!currentPassenger) {
    renderPassengerLogin(content);
    return;
  }

  // 檢查乘客信用分
  const passengerData = await DataLayer.getPassenger(currentPassenger.phone) || {};
  const creditScore = passengerData.creditScore != null ? passengerData.creditScore : 100;
  const suspendedUntil = passengerData.suspendedUntil || 0;

  const today = getToday();

  // 檢查週末
  if (!isWeekday()) {
    content.innerHTML = `
      <div class="card">
        <div class="card-title">📅 今日不設留座</div>
        <div style="font-size:13px; color:#64748b; line-height:1.8;">
          星期六、日及公眾假期採循環線運作，不設固定班次，因此不設留座。<br>
          乘客可即場上車，或使用小巴行車查詢系統查詢即時位置。
        </div>
      </div>
      <div class="card">
        <div class="card-title">👤 ${passengerData.name || currentPassenger.name}</div>

        <div style="font-size:12px; color:#64748b; margin-top:4px;">信用分：${creditScore}</div>
      </div>
      <button class="btn btn-outline" onclick="passengerLogout()">登出</button>
    `;
    return;
  }

  // 檢查暫停資格
  if (suspendedUntil > now()) {
    const remaining = Math.ceil((suspendedUntil - now()) / (24*60*60*1000));
    content.innerHTML = `
      <div class="card" style="border-color:#ef4444; background:#450a0a;">
        <div style="font-size:14px; font-weight:600; color:#f87171;">⛔ 預約資格已暫停</div>
        <div style="font-size:12px; color:#fca5a5; margin-top:6px;">
          因多次未到站，你的預約資格已暫停。剩餘 ${remaining} 日。
        </div>
      </div>
      <button class="btn btn-outline" onclick="passengerLogout()">登出</button>
    `;
    return;
  }

  // 顯示乘客資訊卡
  let html = `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:15px; font-weight:600;">👤 ${passengerData.name || currentPassenger.name}</div>
          <div style="font-size:12px; color:#64748b; margin-top:2px;">${currentPassenger.phone}</div>

  const myBookings = Object.values(todayBookings).filter(b =>

  );

  if (myBookings.length > 0) {
    html += `<div class="card-title" style="margin:16px 0 10px;">🎫 我的預約</div>`;

    myBookings.forEach(b => {

        'arrived': '✅ 已到站',

      }[b.status] || b.status;

    });
  }

  html += `<button class="btn btn-outline" style="margin-top:20px;" onclick="passengerLogout()">登出</button>`;
  content.innerHTML = html;
}

async function renderShiftCard(date, time, allBookings) {
  const scheduleId = getScheduleId(date, time);

  // 讀取座位設定（由司機當值時輸入）
  const seatConfig = await DataLayer.getSeatConfig(date, time);

  // 如果未有座位設定，代表司機未開始當值
  if (!seatConfig || !seatConfig.seats) {
    return `
      <div class="shift-card full" style="opacity:0.4;">
        <div>
          <div class="shift-time">${time}</div>
          <div class="shift-info">${getShiftOrigin(time)} 開出</div>
          <div style="margin-top:6px;"><span class="badge badge-red">未開放</span></div>
        </div>
        <div class="shift-seats">
          <div class="num zero">—</div>
          <div class="label">未開放</div>
        </div>
      </div>
    `;
  }

  const totalSeats = seatConfig.seats;

  // 計算已預約座位
  const bookedSeats = Object.values(allBookings)
    .filter(b => b.scheduleId === scheduleId && ['reserved','arrived','boarded'].includes(b.status))
    .reduce((sum, b) => sum + (b.seats || 0), 0);

  const remaining = totalSeats - bookedSeats;
  const isFull = remaining <= 0;

  // 檢查乘客自己有冇預約呢班
  const myBooking = Object.values(allBookings).find(b =>
    b.scheduleId === scheduleId &&
    b.passengerPhone === currentPassenger.phone &&
    b.status !== 'cancelled'
  );

  let statusBadge = '';
  if (myBooking) {
    if (myBooking.status === 'reserved') statusBadge = '<span class="badge badge-yellow">已預約</span>';
    else if (myBooking.status === 'arrived') statusBadge = '<span class="badge badge-green">已到站</span>';
    else if (myBooking.status === 'boarded') statusBadge = '<span class="badge badge-blue">已上車</span>';
    else if (myBooking.status === 'no-show') statusBadge = '<span class="badge badge-red">未到站</span>';
  }

  const clickable = !isFull || myBooking;

  return `
    <div class="shift-card ${isFull && !myBooking ? 'full' : ''}" ${clickable ? `onclick="selectShift('${date}','${time}')"` : ''}>
      <div>
        <div class="shift-time">${time}</div>
        <div class="shift-info">${getShiftOrigin(time)} 開出</div>
        ${statusBadge ? '<div style="margin-top:6px;">' + statusBadge + '</div>' : ''}
      </div>
      <div class="shift-seats">
        <div class="num ${remaining <= 0 ? 'zero' : remaining <= 4 ? 'low' : ''}">${remaining}</div>
        <div class="label">剩餘座位</div>
      </div>
    </div>
  `;
}

  const phone = document.getElementById('login-phone').value.trim();
  const name = document.getElementById('login-name').value.trim();

  if (!/^\d{8}$/.test(phone)) { toast('請輸入 8 位數字電話號碼'); return; }
  if (!name || name.length > 20) { toast('請輸入姓名（20 字內）'); return; }

  // 檢查有冇被暫停
  const existing = await DataLayer.getPassenger(phone) || {};
  if (existing.suspendedUntil && existing.suspendedUntil > now()) {
    const remaining = Math.ceil((existing.suspendedUntil - now()) / (24*60*60*1000));
    toast(`預約資格暫停中，剩餘 ${remaining} 日`);
    return;
  }

  // 儲存乘客資料
  await DataLayer.savePassenger(phone, {
    name: name,
    phone: phone,
    creditScore: existing.creditScore != null ? existing.creditScore : 100,
    totalBookings: existing.totalBookings || 0,
    totalNoShows: existing.totalNoShows || 0,
    lastLogin: now()
  });

  currentPassenger = { phone, name };
  savePassengerSession(currentPassenger);
  toast('登入成功');
  renderPassengerHome();
}

  const seatConfig = await DataLayer.getSeatConfig(date, time);
  if (!seatConfig || !seatConfig.seats) { toast('此班次未開放'); return; }

  const todayBookings = await DataLayer.getBookings(date);
  const scheduleId = getScheduleId(date, time);

  const bookedSeats = Object.values(todayBookings)
    .filter(b => b.scheduleId === scheduleId && ['reserved','arrived','boarded'].includes(b.status))
    .reduce((sum, b) => sum + (b.seats || 0), 0);

  if (bookedSeats + seats > seatConfig.seats) {
    toast('座位不足，請重新選擇');
    return;
  }

  const booking = {
    scheduleId: scheduleId,
    date: date,
    time: time,
    passengerName: name,
    passengerPhone: currentPassenger.phone,
    seats: seats,
    status: 'reserved',
    direction: getShiftDirection(time)
  };

  if (b.status === 'reserved') {

    </div>`;
  } else if (b.status === 'boarded') {
    html += `<div class="card" style="text-align:center; border-color:#38bdf8; background:#082f49;">
      <div style="font-size:16px; font-weight:600; color:#7dd3fc;">🚐 已上車</div>
    </div>`;
  } else if (b.status === 'cancelled') {
    html += `<div class="card" style="text-align:center; color:#94a3b8;">已取消</div>`;

    html += `<div class="card" style="text-align:center; border-color:#ef4444; background:#450a0a;">
      <div style="font-size:16px; font-weight:600; color:#f87171;">❌ 未到站</div>
    </div>`;
  }

  content.innerHTML = html;

  updateCountdown(b.date, b.time);

  if (b.status === 'reserved') {
    if (timeUntil < ARRIVE_WINDOW && timeUntil > -5 * 60 * 1000) {
      startGPS(b.id, b.date, b.time);
    } else if (timeUntil > 0) {
      // 等到時間到先啟動
      const delay = timeUntil - ARRIVE_WINDOW;
      if (delay < 24 * 60 * 60 * 1000) {
        setTimeout(() => {
          if (currentScreen === 'booking') {

async function checkAndStartGPS(bookingId, date, time) {
  const bookings = await DataLayer.getBookings(date);
  const b = bookings[bookingId];
  if (b && b.status === 'reserved') {
    startGPS(bookingId, date, time);
  }
}

function updateCountdown(date, time) {
  const el = document.getElementById('countdown');
  if (!el) return;
  const shiftTime = getShiftTime(date, time);
  const diff = shiftTime - now();
  if (diff <= 0) { el.textContent = '班次已發車'; return; }
  const mins = Math.floor(diff / 60000);
  const secs = Math.floor((diff % 60000) / 1000);
  el.textContent = `距離發車：${mins}:${String(secs).padStart(2,'0')}`;
  setTimeout(() => {
    if (document.getElementById('countdown')) updateCountdown(date, time);
  }, 1000);
}

// ============================================================
// GPS 到站確認
// ============================================================

let gpsWatchId = null;
let gpsMarkedBookingId = null;

function startGPS(bookingId, date, time) {
  if (!navigator.geolocation) {
    const t = document.getElementById('gps-text');
    if (t) t.textContent = '此裝置不支援 GPS';
    return;
  }
  const gps = getShiftGPS(time);
  const gpsText = document.getElementById('gps-text');
  const gpsSub = document.getElementById('gps-sub');
  if (gpsText) gpsText.textContent = '正在定位...';
  if (gpsSub) gpsSub.textContent = `目標：${getShiftOrigin(time)}`;

  stopGPS();

  gpsWatchId = navigator.geolocation.watchPosition(
    async (pos) => {
      const d = distance(pos.coords.latitude, pos.coords.longitude, gps.lat, gps.lng);
      const box = document.getElementById('gps-box');
      const text = document.getElementById('gps-text');
      const sub = document.getElementById('gps-sub');
      if (!box || !text || !sub) return;

      if (d <= GPS_RADIUS) {
        box.className = 'gps-box arrived';
        text.textContent = '✅ 已到站！';
        sub.textContent = `距離 ${getShiftOrigin(time)} ${Math.round(d)} 米`;
        if (gpsMarkedBookingId !== bookingId) {
          gpsMarkedBookingId = bookingId;
          await markArrived(bookingId, date);
        }
      } else {
        box.className = 'gps-box waiting';
        text.textContent = '⏳ 未到站';
        sub.textContent = `距離 ${getShiftOrigin(time)} ${Math.round(d)} 米（需進入 ${GPS_RADIUS} 米範圍）`;
      }
    },
    (err) => {
      const t = document.getElementById('gps-text');
      if (t) t.textContent = 'GPS 錯誤：' + err.message;
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
}

function stopGPS() {
  if (gpsWatchId !== null) {
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
  }
}

async function markArrived(bookingId, date) {
  const bookings = await DataLayer.getBookings(date);
  const b = bookings[bookingId];
  if (!b || b.status !== 'reserved') return;
  await DataLayer.updateBooking(date, bookingId, {
    status: 'arrived',
    arrivedAt: now()
  });
  stopGPS();
  toast('✅ 已確認到站！');
}

    <div class="card">

      <div style="font-size:12px; color:#64748b; margin-bottom:14px;">
        請輸入你喺西鐵小巴系統登記嘅電話號碼或電郵
      </div>
      <div class="input-group">
        <label>電話號碼 / 電郵</label>
        <input type="text" id="driver-login-id" placeholder="例如：91234567" autocomplete="off">
      </div>
      <button class="btn btn-success" onclick="driverLogin()">確認登入</button>
    </div>
  `;
}

async function driverLogin() {
  const id = document.getElementById('driver-login-id').value.trim();
  if (!id) { toast('請輸入電話號碼或電郵'); return; }

  const driver = await DataLayer.getDriverByIdentifier(id);
  if (!driver) {
    toast('❌ 此帳戶不是司機');
    return;
  }

  currentDriver = {
    identifier: id,
    plate: driver.plate || loadDriverPlate(id)
  };
  saveDriverSession(currentDriver);
  toast('✅ 司機登入成功');
  renderDriverHome();
}

function driverLogout() {
  if (!confirm('確定登出？')) return;
  currentDriver = null;
  clearDriverSession();
  renderDriverLogin(document.getElementById('driver-content'));
}

function loadDriverPlate(id) {
  try {
    const raw = localStorage.getItem('booking_driver_plate_' + id);
    return raw || null;
  } catch(e) { return null; }
}

function saveDriverPlate(id, plate) {
  try { localStorage.setItem('booking_driver_plate_' + id, plate); } catch(e) {}
}

async function driverStartDuty() {
  const plate = document.getElementById('driver-plate').value.trim().toUpperCase();
  const seats = parseInt(document.getElementById('driver-seats').value);

  if (!plate) { toast('請輸入車牌'); return; }

  currentDriver.plate = plate;
  saveDriverPlate(currentDriver.identifier, plate);
  saveDriverSession(currentDriver);

  // 設定 active_buses（同西鐵小巴共用）
  await db.ref('van/active_buses/' + plate).update({
    plate: plate,
    driverIdentifier: currentDriver.identifier,
    carSeats: seats,
    isActive: true,
    mode: 'booking',
    lastUpdate: now()
  });

  // 為今日所有班次設定座位數
  const today = getToday();
  if (isWeekday()) {
    const allShifts = [...SHIFTS_MORNING, ...SHIFTS_EVENING];
    for (const time of allShifts) {
      await DataLayer.setSeatConfig(today, time, seats, plate);
    }
  }

  toast('🟢 已開始當值');
  renderDriverHome();
}

async function driverStopDuty() {
  if (!confirm('確定停止當值？停止後乘客將無法預約今日班次。')) return;

  if (currentDriver.plate) {
    await db.ref('van/active_buses/' + currentDriver.plate).remove();
  }

  toast('🔴 已停止當值');
  renderDriverHome();
}

async function renderDriverShift(date, time) {
  const content = document.getElementById('driver-content');
  const todayBookings = await DataLayer.getBookings(date);
  const scheduleId = getScheduleId(date, time);
  const shiftBookings = Object.values(todayBookings).filter(b =>
    b.scheduleId === scheduleId && b.status !== 'cancelled'
  );

  const activeBus = await DataLayer.getActiveBus(currentDriver.plate);
  const totalSeats = (activeBus && activeBus.carSeats) || 16;

  const arrived = shiftBookings.filter(b => b.status === 'arrived' || b.status === 'boarded');
  const notArrived = shiftBookings.filter(b => b.status === 'reserved');
  const bookedSeats = shiftBookings
    .filter(b => ['reserved','arrived','boarded'].includes(b.status))
    .reduce((s,b) => s + (b.seats||0), 0);
  const remaining = totalSeats - bookedSeats;

  let html = `
    <div style="display:flex; align-items:center; margin-bottom:16px;">
      <button class="btn btn-outline btn-sm" onclick="renderDriverHome()">← 返回</button>
    </div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:24px; font-weight:700; color:#38bdf8;">${time}</div>
          <div style="font-size:12px; color:#64748b;">${getShiftOrigin(time)} → ${getShiftDestination(time)}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:20px; font-weight:700;">${bookedSeats}/${totalSeats}</div>
          <div style="font-size:11px; color:#64748b;">已預約</div>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat green"><div class="num">${arrived.length}</div><div class="lbl">🔴 已到站</div></div>
      <div class="stat yellow"><div class="num">${notArrived.length}</div><div class="lbl">🟡 未到站</div></div>
      <div class="stat blue"><div class="num">${remaining}</div><div class="lbl">🟢 空位</div></div>
    </div>
  `;

  if (arrived.length > 0) {
    html += `<div class="card-title" style="margin-bottom:8px;">🔴 已到站（可上車）</div>`;
    arrived.forEach(b => {
      html += `
        <div class="booking-item arrived">
          <div>
            <div class="booking-name">${b.passengerName} ${b.seats > 1 ? '×'+b.seats : ''}</div>
            <div class="booking-phone">${b.passengerPhone}</div>
          </div>
          <div>
            ${b.status === 'boarded'
              ? '<span class="badge badge-blue">已上車</span>'
              : `<button class="btn btn-success btn-sm" onclick="markBoarded('${date}','${b.id}')">上車</button>`
            }
          </div>
        </div>
      `;
    });
  }

  if (notArrived.length > 0) {
    html += `<div class="card-title" style="margin:16px 0 8px;">🟡 未到站</div>`;
    notArrived.forEach(b => {
      html += `
        <div class="booking-item not-arrived">
          <div>
            <div class="booking-name">${b.passengerName} ${b.seats > 1 ? '×'+b.seats : ''}</div>
            <div class="booking-phone">${b.passengerPhone}</div>
          </div>
          <div>
            <button class="btn btn-outline btn-sm" onclick="markBoarded('${date}','${b.id}')">手動上車</button>
          </div>
        </div>
      `;
    });
  }

  html += `
    <div style="margin-top:20px;">
      <button class="btn btn-primary" onclick="confirmDeparture('${date}','${time}')" ${arrived.length === 0 ? 'disabled' : ''}>
        🚐 確認發車
      </button>
    </div>
  `;

  content.innerHTML = html;
}

async function markBoarded(date, bookingId) {
  await DataLayer.updateBooking(date, bookingId, {
    status: 'boarded',
    boardedAt: now()
  });
  toast('✅ 已確認上車');
  const todayBookings = await DataLayer.getBookings(date);
  const b = todayBookings[bookingId];
  if (b) renderDriverShift(date, b.time);
}

async function confirmDeparture(date, time) {
  const todayBookings = await DataLayer.getBookings(date);
  const scheduleId = getScheduleId(date, time);
  const shiftBookings = Object.entries(todayBookings).filter(([k, b]) =>
    b.scheduleId === scheduleId && b.status === 'reserved'
  );

  if (shiftBookings.length === 0) { toast('冇未到站嘅乘客'); return; }

  if (!confirm(`確定發車？有 ${shiftBookings.length} 位乘客未到站，將被記錄為未到站。`)) return;

  let noShowCount = 0;
  for (const [id, b] of shiftBookings) {
    await DataLayer.updateBooking(date, id, { status: 'no-show', noShowAt: now() });
    // 扣信用分
    const passengerData = await DataLayer.getPassenger(b.passengerPhone) || {};
    const newScore = Math.max(0, (passengerData.creditScore != null ? passengerData.creditScore : 100) - 20);
    const patch = {
      creditScore: newScore,
      totalNoShows: (passengerData.totalNoShows || 0) + 1
    };
    if (newScore < 30) patch.suspendedUntil = now() + 30 * 24 * 60 * 60 * 1000;
    else if (newScore < 60) patch.suspendedUntil = now() + 7 * 24 * 60 * 60 * 1000;
    await DataLayer.savePassenger(b.passengerPhone, patch);
    noShowCount++;
  }

  toast(`已發車，${noShowCount} 人未到站`);
  renderDriverShift(date, time);
}

// 自動清理：將過期未到站標記為 no-show
// ============================================================

async function autoCleanExpiredBookings() {
  if (!isWeekday()) return;
  const today = getToday();
  const bookings = await DataLayer.getBookings(today);
  const allShifts = [...SHIFTS_MORNING, ...SHIFTS_EVENING];

  for (const [id, b] of Object.entries(bookings)) {
    if (b.status !== 'reserved') continue;
    const shiftTime = getShiftTime(b.date, b.time);
    // 發車後 5 分鐘仍未到站，自動標記為 no-show
    if (now() > shiftTime + 5 * 60 * 1000) {
      await DataLayer.updateBooking(b.date, id, { status: 'no-show', noShowAt: now() });
      const passengerData = await DataLayer.getPassenger(b.passengerPhone) || {};
      const newScore = Math.max(0, (passengerData.creditScore != null ? passengerData.creditScore : 100) - 20);
      const patch = {
        creditScore: newScore,
        totalNoShows: (passengerData.totalNoShows || 0) + 1
      };
      if (newScore < 30) patch.suspendedUntil = now() + 30 * 24 * 60 * 60 * 1000;
      else if (newScore < 60) patch.suspendedUntil = now() + 7 * 24 * 60 * 60 * 1000;
      await DataLayer.savePassenger(b.passengerPhone, patch);
    }
  }
}
